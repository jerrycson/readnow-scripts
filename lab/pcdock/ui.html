<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리드나우 PC 배치</title>
<!-- 🖥 PC 배치 도우미 화면(이 PC 127.0.0.1에서만) — 처음 화면 단추 4개 · ① 설정(배치도) · ④ PC 정리 · 브라우저 팝업 없음(쪽지·두 번 누르기) -->
<style>
:root { --bg: #f6f7f9; --card: #fff; --ink: #1d232b; --mute: #6a7380; --line: #dde1e7; --acc: #2463eb; --acc2: #e8efff; --ok: #138a52; --warn: #b26a00; --bad: #c62828; --cell: #eef1f5; --cellh: #dfe8ff; --blk: #2463eb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14171c; --card: #1d2229; --ink: #e8ebef; --mute: #98a2ae; --line: #313843; --acc: #6e9bff; --acc2: #22304d; --ok: #43c486; --warn: #f0a640; --bad: #ff6b6b; --cell: #232a33; --cellh: #2b3a58; --blk: #4c7ef0; } }
:root[data-theme="dark"] { --bg: #14171c; --card: #1d2229; --ink: #e8ebef; --mute: #98a2ae; --line: #313843; --acc: #6e9bff; --acc2: #22304d; --ok: #43c486; --warn: #f0a640; --bad: #ff6b6b; --cell: #232a33; --cellh: #2b3a58; --blk: #4c7ef0; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 "Malgun Gothic", "맑은 고딕", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 6px 10px; }
button:hover { border-color: var(--acc); }
button.pri { background: var(--acc); color: #fff; border-color: var(--acc); }
button.arm { background: var(--bad); color: #fff; border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 100%; }
textarea { resize: vertical; min-height: 54px; }
label { display: block; margin: 6px 0 2px; color: var(--mute); font-size: 12px; }
.mute { color: var(--mute); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.view { display: none; height: 100%; } .view.on { display: flex; flex-direction: column; }
/* 처음 화면 */
#home { padding: 12px; gap: 8px; position: relative; }
#home h1 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.big { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 12px; font-size: 14px; border-radius: 10px; }
.big .n { font-size: 18px; width: 26px; text-align: center; }
.big .t { flex: 1; } .big small { display: block; color: var(--mute); font-size: 11.5px; }
.sw { width: 40px; height: 22px; border-radius: 11px; background: var(--line); position: relative; flex: none; transition: .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
.sw.on { background: var(--ok); } .sw.on::after { left: 21px; }
#last { flex: 1; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; }
#last div { padding: 1px 0; }
/* 설정 */
#set { flex-direction: row; }
#side { width: 290px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--card); }
#side h2, #main h2 { font-size: 13px; margin: 0; }
#apps { flex: 1 1 50%; overflow: auto; padding: 6px; border-bottom: 1px solid var(--line); position: relative; }
#apps.drop { outline: 3px dashed var(--acc); outline-offset: -6px; background: var(--acc2); }
.app { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; border: 1px solid transparent; user-select: none; touch-action: none; cursor: grab; }
.app:hover { background: var(--acc2); } .app.sel { border-color: var(--acc); background: var(--acc2); }
.ic { width: 24px; height: 24px; flex: none; display: grid; place-items: center; font-size: 17px; }
.ic img { width: 24px; height: 24px; }
.app .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .cnt { font-size: 11px; color: var(--mute); }
#addrow { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#addrow button { padding: 3px 7px; font-size: 12px; }
#detail { flex: 1 1 50%; overflow: auto; padding: 8px 10px 12px; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
#bar .sp { flex: 1; }
#bar select { width: auto; }
#mapwrap { flex: 1; position: relative; overflow: hidden; }
#map { position: absolute; inset: 0; }
.mon { position: absolute; border: 2px solid var(--mute); border-radius: 6px; background: var(--bg); }
.mon .lab { position: absolute; left: 0; right: 0; top: -20px; font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon.pri { border-color: var(--acc); }
.cell { position: absolute; background: var(--cell); border: 1px solid var(--line); }
.cell.hot { background: var(--cellh); border-color: var(--acc); }
.blk { position: absolute; background: var(--blk); color: #fff; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; text-align: center; overflow: hidden; cursor: grab; touch-action: none; user-select: none; box-shadow: 0 1px 4px #0004; }
.blk.bad { background: var(--bad); }
.blk .ic { font-size: 20px; }
.blk.sm .nm2 { display: none; } .blk.sm .ic { font-size: 16px; }
.blk .x { position: absolute; top: 1px; right: 2px; font-size: 11px; line-height: 14px; opacity: 0; cursor: pointer; padding: 0 3px; border-radius: 3px; }
.blk:hover .x { opacity: .9; background: #0003; }
.blk .rz { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #fff9 50%); }
#monopts { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--card); }
#monopts .mo { display: flex; gap: 4px; align-items: center; }
#monopts select { width: auto; } #monopts input { width: 46px; }
.ghost { position: fixed; pointer-events: none; z-index: 50; background: var(--blk); color: #fff; border-radius: 6px; padding: 4px 8px; opacity: .9; display: flex; gap: 5px; align-items: center; }
/* 정리 */
#clean { padding: 10px 12px; gap: 8px; overflow: auto; }
#clean .lvs { display: flex; gap: 6px; } #clean .lvs button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.list .row { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.list .row:last-child { border-bottom: 0; }
.list .row input[type=checkbox] { width: auto; margin-top: 3px; }
.list .row .g { flex: 1; min-width: 0; } .list .row .sz { white-space: nowrap; color: var(--mute); }
.adv { background: var(--acc2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
code { font-family: Consolas, monospace; font-size: 11.5px; background: var(--bg); padding: 1px 4px; border-radius: 4px; word-break: break-all; }
#toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; max-width: 92%; display: none; z-index: 99; white-space: pre-line; }
.back { padding: 3px 8px; }
.blk.sel { outline: 3px solid #ffd54a; outline-offset: -1px; }
.tabs { display: flex; flex-direction: column; gap: 3px; }
.tab { display: flex; gap: 3px; align-items: center; } .tab .tn { width: 16px; color: var(--mute); font-size: 11px; text-align: right; flex: none; }
.tab button { padding: 2px 6px; font-size: 11.5px; flex: none; } .tabs > button { align-self: flex-start; padding: 2px 8px; font-size: 12px; }
.ask { position: absolute; inset: 0; background: var(--bg); padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: auto; z-index: 20; }
.ask[hidden] { display: none; } .ask button { text-align: left; } .ask .list { font-size: 12px; }
details.raw { font-size: 11px; color: var(--mute); margin: 1px 0 3px 18px; } details.raw summary { cursor: pointer; }
.hd { font-size: 11.5px; color: var(--mute); margin: 2px 0 6px; }
</style>
</head>
<body>
<div id="home" class="view on">
  <h1><span>🖥 리드나우 PC 배치</span><span class="mute" id="ver" style="font-size:11px"></span></h1>
  <button class="big" id="b1"><span class="n">⚙</span><span class="t">① 실행·배치 설정<small id="b1s">프로그램을 모니터 칸에 끌어 놓기</small></span></button>
  <button class="big" id="b2"><span class="n">🔁</span><span class="t">② 윈도우 시작 때 자동<small id="b2s">로그온 뒤 20초 기다렸다 실행·배치</small></span><span class="sw" id="b2sw"></span></button>
  <button class="big pri" id="b3"><span class="n">▶</span><span class="t">③ 설정대로 지금 실행·배치<small id="b3s" style="color:#ffffffcc">켜고 · 뜨길 기다려 · 칸에 놓음</small></span></button>
  <button class="big" id="b4"><span class="n">🧹</span><span class="t">④ PC 정리<small>임시·캐시만 · 리드나우는 안 건드림</small></span></button>
  <div id="last" class="mute">아직 실행·배치하지 않았습니다.</div>
  <div id="ask" class="ask" hidden>
    <b style="font-size:14px">▶ 지금 열린 프로그램을 어떻게 할까요?</b>
    <button id="askKeep" class="pri">📌 남겨 둔 채 설정대로 열기</button>
    <button id="askClose">🧹 화면에 열린 프로그램 모두 닫고 설정대로 열기<small class="mute" style="display:block;font-size:11px">닫을 목록을 먼저 보여 드림 · 크롬·Claude·원격·출고·탐색기 셸은 절대 안 닫음</small></button>
    <button id="askNo">취소</button>
    <div id="askList"></div>
  </div>
</div>

<div id="set" class="view">
  <div id="side">
    <div style="padding:8px 10px;border-bottom:1px solid var(--line)"><h2>📋 프로그램 <span class="mute" style="font-weight:normal;font-size:11.5px">끌어서 오른쪽 칸에 놓기</span></h2></div>
    <div id="apps"></div>
    <div id="addrow"><button id="addChrome">＋ 크롬 창</button><button id="addWeb">＋ 웹 주소 창</button><button id="addFolder">＋ 폴더</button><button id="addExe">＋ 프로그램</button></div>
    <div id="detail" class="mute"></div>
  </div>
  <div id="main">
    <div id="bar">
      <button class="back" id="setBack">← 처음</button>
      <h2>🖥 모니터 배치도</h2>
      <span class="mute">일반 모니터</span><select id="base"><option value="16:9">16:9</option><option value="16:10">16:10</option><option value="4:3">4:3</option><option value="21:9">21:9</option></select><span class="mute">= 가로 4 × 세로 3칸</span>
      <span class="sp"></span>
      <button id="reMon">🔄 모니터 다시 읽기</button>
      <button id="setCancel">취소</button>
      <button class="pri" id="setOk">✔ 확인(저장)</button>
    </div>
    <div id="mapwrap"><div id="map"></div></div>
    <div id="monopts"></div>
    <div id="runopts" style="display:flex;gap:14px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap">
      <span>② 윈도우 시작 뒤 <input id="oDelay" type="number" min="0" max="600" style="width:58px"> 초 기다렸다 실행</span>
      <span>③ 창이 뜨길 최대 <input id="oWait" type="number" min="5" max="180" style="width:58px"> 초 기다림</span>
      <label style="display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)"><input id="oReuse" type="checkbox" style="width:auto"> 이미 떠 있는 프로그램은 새로 안 띄우고 자리만(크롬 빼고)</label>
    </div>
  </div>
</div>

<div id="clean" class="view">
  <div style="display:flex;gap:8px;align-items:center"><button class="back" id="clBack">← 처음</button><h2 style="margin:0;font-size:14px">🧹 PC 정리</h2></div>
  <div class="lvs" id="lvs"></div>
  <div class="mute" id="lvdesc"></div>
  <button id="scan" class="pri">🔍 미리보기(아직 아무것도 안 지움)</button>
  <div id="scanout"></div>
  <div class="adv" id="advice"></div>
</div>
<div id="toast"></div>

<script src="/grid.js"></script>
<script src="/apps.js"></script>
<script src="/settings.js"></script>
<script>
'use strict';
const G = window.PDGrid, AP = window.PDApps, SETL = window.PDSet;
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null; /* 서버 상태 */ let C = null; /* 고치는 중인 설정(확인 전) */ let sel = null; /* 고른 틀(목록) */ let selP = null; /* 고른 배치(칸에 놓은 덩이) */
const HINT = '왼쪽 목록의 프로그램은 <b>틀</b>입니다 — 칸에 끌어 놓을 때마다 새 <b>배치</b>가 생기고, 배치마다 따로 설정합니다(예: 스크린샷 폴더 / 다운로드 폴더, A 주소 크롬 / B 주소 크롬).<br><br>칸에 놓은 덩이를 누르면 그 배치의 설정이, 목록을 누르면 틀(놓을 때 처음 값)이 여기 나옵니다.<br><br>탐색기에서 프로그램(.exe)·바로가기(.lnk)를 목록에 끌어다 놓으면 더해집니다.';
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.T); toast.T = setTimeout(() => { t.style.display = 'none'; }, ms || 3200); }
/* 두 번 누르기 — 첫 번째는 단추 글만 바뀜(4초) · 브라우저 확인 창 없음 */
function twice(btn, msg, fn) { if (btn.dataset.arm) { delete btn.dataset.arm; btn.classList.remove('arm'); btn.innerHTML = btn.dataset.orig; return fn(); }
  btn.dataset.arm = '1'; btn.dataset.orig = btn.innerHTML; btn.classList.add('arm'); btn.textContent = msg; clearTimeout(btn._t); btn._t = setTimeout(() => { if (btn.dataset.arm) { delete btn.dataset.arm; btn.classList.remove('arm'); btn.innerHTML = btn.dataset.orig; } }, 4000); }
async function api(p, b) { const r = await fetch(p, b === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json', 'x-rn-dock': '1' }, body: JSON.stringify(b) }); let j = {}; try { j = await r.json(); } catch (e) { j = { ok: false, err: '응답이 이상함' }; } return j; }
function show(v) { $$('.view').forEach((x) => x.classList.toggle('on', x.id === v)); }
function fit(view) { const W = view === 'set' ? { w: 1180, h: 760 } : view === 'clean' ? { w: 560, h: 720 } : { w: 340, h: 470 }; try { window.resizeTo(W.w, W.h); } catch (e) {} if (window.outerWidth < W.w - 40 || window.outerHeight < W.h - 40) api('/api/fit', { view }); }
const appIcon0 = (a) => { const k = AP.keyOf(a); const b64 = (a.kind === 'exe' && a.exe && S.icons[a.exe]) || S.icons[k]; return b64 ? `<img alt="" src="data:image/png;base64,${b64}">` : esc(a.icon || ({ chrome: '🌐', folder: '📁', phone: '📱', crd: '🖥', claude: '✳', exe: '🧩', web: '🔗', col2: '🧪', alps: '🅰' })[a.kind] || '🧩'); };
const appIcon = appIcon0;

/* ── 처음 화면 ── */
async function load(fresh) { S = await api('/api/state' + (fresh ? '?fresh=1' : '')); if (!S.ok) { toast('도우미 상태를 못 읽음: ' + (S.err || '')); return; } $('#ver').textContent = `${S.pc} · 판 ${S.ver}` + (S.update ? ` · 새 판 ${S.update.v} 준비됨(다시 열면 바뀜)` : ''); paintHome(); }
function paintHome() { const c = S.cfg; $('#b2sw').classList.toggle('on', !!S.startup); $('#b2s').textContent = S.startup ? `켜짐 — 로그온 뒤 ${c.auto.delaySec}초 기다렸다 실행·배치` : `꺼짐 — 켜면 로그온 뒤 ${c.auto.delaySec}초 기다렸다 실행·배치`;
  $('#b1s').textContent = c.place.length ? `프로그램 ${c.apps.length}개 · 놓은 자리 ${c.place.length}곳 · 모니터 ${S.mons.length}대` : `아직 놓은 것 없음 · 모니터 ${S.mons.length}대`;
  if (S.last) paintLast(S.last); }
const raw = (t) => t ? `<details class="raw"><summary>원문</summary><code>${esc(t)}</code></details>` : '';
function paintLast(L) { const el = $('#last'); el.classList.remove('mute'); const t = new Date(L.at).toLocaleTimeString('ko-KR');
  const cl = L.closed || []; const cOk = cl.filter((c) => c.ok);
  el.innerHTML = `<div><b>${esc(t)} ${esc(L.by || '')}${L.mode === 'close' ? ' · 모두 닫고' : ''}</b> ${L.ok ? '<span class="ok">끝</span>' : '<span class="bad">' + esc(L.err || '안 됨') + '</span>'}${L.sec != null ? ' · ' + L.sec + '초' : ''}</div>` + raw(L.raw) +
    (cl.length ? `<div>🧹 닫아 달라고 부탁 ${cOk.length}개 · 닫힘 ${cOk.filter((c) => c.gone).length}개${cOk.some((c) => !c.gone) ? ` · 아직 떠 있음 ${cOk.filter((c) => !c.gone).length}개(저장할지 묻는 중일 수 있음 — 그 창에서 골라 주세요)` : ''}</div>` + `<details class="raw"><summary>닫은 창</summary>${cl.map((c) => `<div>${c.ok ? (c.gone ? '✓' : '…') : '—'} ${esc(c.proc)} · ${esc(c.title)}${c.why ? ' (' + esc(c.why) + ')' : ''}</div>`).join('')}</details>` : '') +
    (L.res || []).map((r) => `<div>${r.ok ? '✅' : '⚠'} ${r.ok ? esc(r.name) + ' — ' + esc(r.how) : esc(r.msg || (r.name + ' — ' + r.how))}</div>` + raw(r.raw)).join('') +
    (L.skipped || []).map((s) => `<div class="warn">⏭ ${esc(s.app)}: ${esc(s.why)}${s.todo ? ' → ' + esc(s.todo) : ''}</div>`).join(''); }
$('#b1').onclick = () => openSet();
$('#b2').onclick = async () => { const on = !S.startup; const r = await api('/api/startup', { on }); if (!r.ok) return toast('바꾸지 못함: ' + (r.err || '')); S.startup = r.on; S.cfg.auto.on = r.on; paintHome(); toast(r.on ? '윈도우 시작 때 자동 실행·배치를 켰습니다' : '껐습니다(바로가기 이름만 .off로 바꿈)'); };
/* ③ — 먼저 묻기: 남겨 둔 채 / 모두 닫고(목록을 보여 준 뒤 두 번 누르기) / 취소 */
async function doRun(body) { $('#ask').hidden = true; const b = $('#b3'); b.disabled = true; $('#b3s').textContent = '실행·배치 중… (창이 뜨길 기다림)'; const r = await api('/api/run', body); b.disabled = false; $('#b3s').textContent = '켜고 · 뜨길 기다려 · 칸에 놓음'; paintLast({ at: Date.now(), by: '단추', ...r }); }
$('#b3').onclick = () => { $('#askList').innerHTML = ''; $('#ask').hidden = false; };

    $$('[data-ti]', box).forEach((x) => { x.oninput = () => { L[+x.dataset.ti] = x.value; }; });
    $$('[data-up]', box).forEach((b) => { b.onclick = () => { const i = +b.dataset.up; if (i > 0) { [L[i - 1], L[i]] = [L[i], L[i - 1]]; paintDetail(); } }; });
    $$('[data-dn]', box).forEach((b) => { b.onclick = () => { const i = +b.dataset.dn; if (i < L.length - 1) { [L[i + 1], L[i]] = [L[i], L[i + 1]]; paintDetail(); } }; });
    $$('[data-rm]', box).forEach((b) => { b.onclick = () => { L.splice(+b.dataset.rm, 1); paintDetail(); }; });
    $('[data-add]', box).onclick = () => { L.push(''); paintDetail(); const ins = $$(`[data-tabs="${f}"] [data-ti]`); if (ins.length) ins[ins.length - 1].focus(); }; });
  if ($('#dDelP')) $('#dDelP').onclick = () => { C.place = C.place.filter((x) => x.id !== p.id); selP = null; paintSet(); paintDetail(); };
  if ($('#dDel')) $('#dDel').onclick = () => twice($('#dDel'), '한 번 더 누르면 빼고, 그 틀로 놓은 배치도 지웁니다', () => { C.apps = C.apps.filter((x) => x.id !== a.id); C.place = C.place.filter((x) => x.app !== a.id); sel = null; paintSet(); paintDetail(); }); }
function newId(base) { let i = 1; while (C.apps.some((a) => a.id === base + i)) i++; return base + i; }
function addApp(a) { C.apps.push(a); sel = a.id; selP = null; paintApps(); paintDetail(); const el = $(`.app[data-app="${a.id}"]`); if (el) el.scrollIntoView({ block: 'nearest' }); return a; }
$('#addChrome').onclick = () => addApp({ id: newId('chrome'), kind: 'chrome', name: '크롬 ' + (C.apps.filter((a) => a.kind === 'chrome').length + 1), icon: '🌐', urls: [], windows: 1, profile: '' });
$('#addWeb').onclick = () => addApp({ id: newId('web'), kind: 'web', name: '웹 주소 창', icon: '🔗', url: '' });
$('#addFolder').onclick = () => addApp({ id: newId('folder'), kind: 'folder', name: '폴더', icon: '📁', paths: [] });
$('#addExe').onclick = () => addApp({ id: newId('exe'), kind: 'exe', name: '프로그램', icon: '🧩', exe: '', file: '' });
/* 탐색기에서 끌어다 놓기 — .lnk는 도우미가 대상 경로를 풀고, .exe는 이름으로 찾음(브라우저는 파일 경로를 알려 주지 않음) */
{ const el = $('#apps'); const on = (e) => { if ([...(e.dataTransfer && e.dataTransfer.types) || []].includes('Files')) { e.preventDefault(); el.classList.add('drop'); } };
  el.addEventListener('dragenter', on); el.addEventListener('dragover', on); el.addEventListener('dragleave', () => el.classList.remove('drop'));
  window.addEventListener('dragover', (e) => e.preventDefault()); window.addEventListener('drop', (e) => e.preventDefault());
  el.addEventListener('drop', async (e) => { e.preventDefault(); el.classList.remove('drop'); for (const f of [...e.dataTransfer.files]) await dropFile(f); }); }
async function dropFile(f) { const n = f.name; const base = n.replace(/\.(exe|lnk)$/i, '');
  if (/\.lnk$/i.test(n)) { if (f.size > 200 * 1024) return toast('바로가기 파일이 너무 큼'); const b64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.readAsDataURL(f); });
    const r = await api('/api/lnk', { name: n, b64 }); if (!r.ok || !r.target) return toast('바로가기를 못 풀었습니다: ' + (r.err || '')); if (r.icon) S.icons[r.target] = r.icon;
    if (!/\.exe$/i.test(r.target)) { if (!/\./.test(r.target.split('\\').pop())) { addApp({ id: newId('folder'), kind: 'folder', name: r.name || base, icon: '📁', paths: [r.target] }); return toast('폴더로 더했습니다'); } return toast('프로그램이 아닌 바로가기(' + r.target.split('\\').pop() + ')'); }
    addApp({ id: newId('exe'), kind: 'exe', name: r.name || base, icon: '🧩', exe: r.target, file: '' }); return toast('더했습니다: ' + (r.name || base)); }
  if (/\.exe$/i.test(n)) { const a = addApp({ id: newId('exe'), kind: 'exe', name: base, icon: '🧩', exe: '', file: '' }); const r = await api('/api/exe', { name: n });
    if (r.ok && r.list && r.list[0]) { a.exe = r.list[0]; if (r.icon) S.icons[a.exe] = r.icon; paintApps(); paintDetail(); return toast('더했습니다: ' + base + '\n' + a.exe); }
    paintDetail(); const inp = $('[data-f=exe]'); if (inp) inp.focus(); return toast('더했지만 경로를 못 찾았습니다 — 실행 파일 경로를 붙여 넣어 주세요', 5000); }
  toast('프로그램(.exe)·바로가기(.lnk)만 더할 수 있습니다'); }
$('#base').onchange = () => { const [aw, ah] = $('#base').value.split(':').map(Number); const old = S.mons.map((m) => gridFor(m)); C.base = { ...C.base, aw, ah }; S.mons.forEach((m, i) => regrid(m.id, old[i], gridFor(m))); paintSet(); };
$('#reMon').onclick = async () => { const r = await api('/api/screens', {}); if (!r.ok) return toast('모니터를 못 읽음: ' + (r.err || '')); S.mons = r.mons; paintSet(); toast(`모니터 ${S.mons.length}대를 읽었습니다`); };
$('#setCancel').onclick = $('#setBack').onclick = () => { C = null; show('home'); fit('home'); };
$('#oDelay').onchange = () => { C.auto.delaySec = Math.max(0, Math.min(600, +$('#oDelay').value || 0)); }; $('#oWait').onchange = () => { C.run.waitSec = Math.max(5, Math.min(180, +$('#oWait').value || 40)); }; $('#oReuse').onchange = () => { C.run.reuse = $('#oReuse').checked; };
$('#setOk').onclick = async () => { for (const m of S.mons) { const g = gridFor(m); C.mons[m.id] = { ...(C.mons[m.id] || {}), grid: (C.mons[m.id] || {}).grid || 'auto', cols: g.cols, rows: g.rows, w: m.b.w, h: m.b.h }; }
  const r = await api('/api/save', { cfg: C }); if (!r.ok) return toast('저장 못 함:\n' + (r.errs || [r.err]).slice(0, 5).join('\n'), 6000);
  S.cfg = r.cfg; C = null; show('home'); fit('home'); paintHome(); toast('저장했습니다' + (r.warns && r.warns.length ? '\n' + r.warns.join('\n') : '')); };

/* ── ④ 정리 ── */
let LV = 1, SC = null;
const LVD = { 1: '7일 넘은 임시 파일 · 메모리 비우기(프로그램은 그대로). 매주 한 번이면 충분.', 2: '+ 썸네일·오류 보고·셰이더 캐시·30일 넘은 로그 · 없어도 되는 백그라운드 프로그램(고른 것만 끔).', 3: '+ 임시 파일 2일 · 로그 14일 · 시작 프로그램 정리 제안(목록만) · 보안 검사 제외 제안(정범님이 고름).' };
function openClean() { show('clean'); fit('clean'); $('#advice').textContent = S.advice || ''; paintLv(); }
function paintLv() { $('#lvs').innerHTML = (S.levels || []).map((l) => `<button data-lv="${l.lv}" class="${l.lv === LV ? 'on' : ''}">${esc(l.t)}</button>`).join(''); $$('#lvs button').forEach((b) => { b.onclick = () => { LV = +b.dataset.lv; SC = null; $('#scanout').innerHTML = ''; paintLv(); }; }); $('#lvdesc').textContent = LVD[LV]; }
const MB = (b) => b >= 1073741824 ? (b / 1073741824).toFixed(1) + 'GB' : Math.round(b / 1048576) + 'MB';
$('#scan').onclick = async () => { const b = $('#scan'); b.disabled = true; b.textContent = '훑는 중…(지우지 않음)'; const r = await api('/api/clean/scan', { lv: LV }); b.disabled = false; b.textContent = '🔍 미리보기(아직 아무것도 안 지움)'; if (!r.ok) return toast('미리보기 실패: ' + (r.err || '')); SC = r; paintScan(); };
function paintScan() { const r = SC; let tot = 0; let h = '<div class="list"><b>지울 것</b>';
  for (const it of r.items) { if (it.kind === 'mem') h += `<div class="row"><input type="checkbox" data-trim checked><div class="g">${esc(it.t)}<div class="mute">리드나우·크롬·보호 프로그램은 빼고 · 지금 약 ${it.mb}MB 쓰는 중</div></div></div>`;
    else if (!it.kind) { tot += it.bytes; h += `<div class="row"><input type="checkbox" data-id="${esc(it.id)}" ${it.files ? 'checked' : 'disabled'}><div class="g">${esc(it.t)}${it.sample && it.sample.length ? `<div class="mute" style="font-size:11px">${it.sample.slice(0, 2).map(esc).join('<br>')}</div>` : ''}</div><div class="sz">${it.files}개 · ${MB(it.bytes)}</div></div>`; } }
  h += `<div class="mute" style="margin-top:4px">파일 합 ${MB(tot)} · 열려 있어 못 지우는 파일은 건너뜀</div></div>`;
  if (r.stop && r.stop.length) h += '<div class="list"><b>없어도 되는 백그라운드 프로그램</b> <span class="mute">(고른 것만 끔 · 기본은 안 고름)</span>' + r.stop.map((p) => `<div class="row"><input type="checkbox" data-pid="${p.pid}" ${p.block ? 'disabled' : ''}><div class="g">${esc(p.t)} <span class="mute">${esc(p.name)}</span><div class="mute" style="font-size:11px">${esc(p.block || p.why || '')}</div></div><div class="sz">CPU ${p.cpu}% · ${p.mb}MB</div></div>`).join('') + '</div>';
  if (r.info && r.info.length) h += '<div class="list"><b>지금 많이 쓰는 다른 프로그램</b> <span class="mute">(보기만 — 여기서 끄지 않음)</span>' + r.info.map((p) => `<div class="row"><div class="g">${esc(p.name)}</div><div class="sz">CPU ${p.cpu}% · ${p.mb}MB</div></div>`).join('') + '</div>';
  if (r.startup) h += '<div class="list"><b>시작 프로그램 정리 제안</b> <span class="mute">(목록만 — 끄기는 작업 관리자 › 시작 앱에서 정범님이)</span>' + r.startup.map((s) => `<div class="row"><div class="g">${s.sug === 'off' ? '🔕' : s.sug === 'keep' ? '✅' : '❔'} ${esc(s.name)}<div class="mute" style="font-size:11px">${esc(s.why)}</div></div></div>`).join('') + '</div>';
  if (r.defender) h += `<div class="list"><b>보안 검사 제외 제안</b> <span class="mute">(Defender를 끄지 않음 · 하지 않아도 됨)</span><div style="margin:4px 0">${esc(r.defender.why)}</div><div class="mute">지금 제외: ${r.defender.have ? (r.defender.have.length ? r.defender.have.map(esc).join(' · ') : '없음') : '관리자 권한이 없어 못 봄'}</div><div style="margin-top:4px">하려면 관리자 PowerShell에 붙여 넣기:</div><code>${esc(r.defender.cmd)}</code> <button id="cpDef" style="padding:2px 6px;font-size:11.5px">명령 복사</button></div>`;
  h += '<button id="doClean" class="pri" style="margin-top:6px">🧹 고른 것 정리하기</button>';
  $('#scanout').innerHTML = h;
  if ($('#cpDef')) $('#cpDef').onclick = async () => { try { await navigator.clipboard.writeText(r.defender.cmd); toast('복사했습니다 — 관리자 PowerShell에 붙여 넣으면 됩니다'); } catch (e) { toast('복사 못 함 — 글을 직접 골라 복사해 주세요'); } };
  $('#doClean').onclick = () => { const ids = $$('[data-id]:checked').map((x) => x.dataset.id), pids = $$('[data-pid]:checked').map((x) => +x.dataset.pid), trim = !!($('[data-trim]') && $('[data-trim]').checked);
    if (!ids.length && !pids.length && !trim) return toast('고른 것이 없습니다');
    twice($('#doClean'), `한 번 더 누르면 정리합니다(파일 ${ids.length}종 · 프로그램 ${pids.length}개${trim ? ' · 메모리' : ''})`, async () => { const b = $('#doClean'); b.disabled = true; b.textContent = '정리 중…';
      const x = await api('/api/clean/run', { token: r.token, ids, pids, trim }); SC = null;
      $('#scanout').innerHTML = x.ok ? `<div class="list"><b class="ok">끝</b><div>파일 ${x.deleted || 0}개 · ${MB(x.freed || 0)} 비움${x.failed ? ` · 쓰는 중이라 못 지움 ${x.failed}개` : ''}</div>${(x.stopped || []).length ? `<div>끈 프로그램: ${x.stopped.map(esc).join(', ')}</div>` : ''}${x.mem ? `<div>메모리 ${MB(Math.max(0, x.mem.before - x.mem.after))} 비움(프로그램 ${x.mem.n}개)</div>` : ''}</div>` : `<div class="bad">정리 못 함: ${esc(x.err || '')}</div>`; }); }; }
$('#clBack').onclick = () => { show('home'); fit('home'); };

/* 창이 떠 있다고 도우미에게 알림(창을 닫고 오래 지나면 도우미가 스스로 꺼짐) */
setInterval(() => { fetch('/api/ping').catch(() => {}); }, 60000);
$('#detail').innerHTML = HINT;
load();
</script>
