<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔎 번외 수집 그림자 비교</title>
<!-- (0.1.1 정범님 11/05 밤 '도우미는 ALPS·로거 도우미처럼 작게') 작은 앱 창(380×560)에 맞춘 꾸밈 — 번외 도우미가 내줄 때 SMALL_CSS(상태 창과 같은 모양)를 넣음 · 큰 표는 접힘/가로 굴림
     (0.1.1 '구글로 로그인이 실패') Firebase를 이 화면에서 열지 않음 — 그 PC에 열린 운영 웹앱이 대신 읽고 씀(col2-store.js relayDb) -->
<style>
/*SMALL_CSS*/
textarea{width:100%;box-sizing:border-box;font:11.5px ui-monospace,Consolas,monospace;min-height:46px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}
input[type=number]{width:46px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:11.5px}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
#out>tr>td:first-child{max-width:110px;overflow-wrap:anywhere}
.f{font:10.5px ui-monospace,Consolas,monospace;word-break:break-all}
details summary{cursor:pointer}
#toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#26222E;color:#fff;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;font-size:12px}
#toast.on{opacity:1}
</style>
</head>
<body>
<h1>🔎 그림자 비교 <small id="ver"></small></h1>
<div class="b">
  <!--PCBAR-->
  <div class="c"><b>번외 도우미</b> <span id="hst" class="k">읽는 중…</span><br>
    <button id="onb" class="p">▶ 켜기</button><button id="showb">🪟 보이기</button><button id="hideb">🙈 숨기기</button><button id="statb">📊 상태 창</button></div>
  <div class="c"><div id="auto"></div><b>기록</b> <span id="fbst" class="k">—</span></div>
  <div class="c"><b>읽을 책</b> <span class="k">(알라딘 상품 번호 ItemId · 줄·쉼표로 나눔 · 20권까지)</span>
    <textarea id="ids" placeholder="예: 123456789"></textarea>
    <div><button id="pickb">운영 도서 표본</button> <input id="nsample" type="number" min="1" max="20" value="5">권 <button id="runb" class="p">그림자로 읽고 비교</button> <button id="stopb" disabled>멈춤</button><br><span id="prog" class="k"></span></div></div>
  <details class="c" id="resd" open><summary>결과 <span id="sum" class="k" style="font-weight:400">—</span></summary>
    <div class="tw"><table><thead><tr><th>책</th><th>판정</th><th>칸</th></tr></thead><tbody id="out"></tbody></table></div></details>
  <div class="c k" id="blk" style="display:none"></div>
  <details class="c"><summary>이 화면은</summary><div class="k">시험 환경입니다 — 운영 수집기·운영 도우미·웹앱과 따로 돕니다. 운영 자료(prd_books·prd_ids)는 <b>읽기만</b> 하고, 그림자 결과는 <b>col2_*</b> 칸에만 씁니다. 이 화면은 구글에 로그인하지 않습니다 — 이 PC에 열린 리드나우 웹앱이 운영 자료를 넘겨주고 결과를 대신 기록합니다. 번외 일꾼은 알라딘에 로그인하지 않습니다.</div></details>
</div>
<div id="toast"></div>
<script src="s/col2-config.js"></script>
<script src="s/col2-store.js"></script>
<script src="s/col2-compare-core.js"></script>
<script src="s/col2-compare.js"></script>
</body>
</html>
