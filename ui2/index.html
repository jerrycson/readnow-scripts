<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<title>리드나우 2 (시범)</title>
<link rel="manifest" href="m/ui2.webmanifest" id="u2-manifest">
<script>/* 📱 페이지마다 휴대폰 앱으로 설치(N22 ★): ?p=페이지 → m/페이지.webmanifest(아이콘·색 · 시작 화면 = 그 페이지) — 기본 페이지만(새로 만든 페이지는 공용 설치 파일) */
(function () { try { var K = ['home', 'search', 'products', 'sellers', 'orders', 'purchase', 'biz', 'market', 'projects', 'settings', 'inbox', 'pending']; var p = new URLSearchParams(location.search).get('p'); if (p && K.indexOf(p) >= 0) document.getElementById('u2-manifest').href = 'm/' + p + '.webmanifest'; } catch (e) {} })();</script>
<link rel="stylesheet" href="src/u2.css">
<!-- 리드나우 2 — 꾸밈 웹앱 시범. 지금 웹앱(U2_BASE)을 그대로 불러와 그 위에 격자·편집기를 얹음. 지금 웹앱 파일은 하나도 바꾸지 않음 -->
<script src="u2-config.js"></script>
<script src="src/u2-core.js"></script>
<script src="src/u2-guard.js"></script>
<script src="src/u2-theme.js"></script>
<script src="src/u2-grid.js"></script>
<script src="src/u2-expr.js"></script>
<script src="src/u2-data.js"></script>
<script src="src/u2-actions.js"></script>
<script src="src/u2-widgets.js"></script>
<script src="src/u2-omni.js"></script>
<script src="src/u2-loader.js"></script>
<script src="src/u2-dock.js"></script>
<script src="src/u2-catalog.js"></script>
<script src="src/u2-adapters.js"></script>
<script src="src/u2-check.js"></script>
<script src="src/u2-find.js"></script>
<script src="src/u2-move.js"></script>
<script src="src/u2-blocks.js"></script>
</head>
<body>
<!-- 지금 웹앱 본문이 그림을 그리는 자리(#app·#toast) — 이름을 바꾸지 말 것 -->
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="src/u2-shell.js"></script>
<script>/* 단계 13 비상 길: 지금 웹앱 주소에서 넘어왔는데(from=old) 25초가 지나도 새 웹앱이 서지 않으면 옛 화면(?old=1)으로 가는 띠 — 새 웹앱이 통째로 깨져도 일이 막히지 않게 */
(function () { try { if (new URLSearchParams(location.search).get('from') !== 'old') return; setTimeout(function () { var U = window.U2; if (U && U.legacy && (U.legacy.shellDone || U.safe)) return; var b = document.createElement('div'); b.id = 'u2-rescue'; b.setAttribute('role', 'alert'); b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483000;background:#8a1c1c;color:#fff;padding:12px 16px;font:15px/1.4 sans-serif'; var u = new URL(window.U2_BASE || '../readnow-scripts/app/', location.href); u.searchParams.set('old', '1'); b.innerHTML = '⚠ 리드나우 2가 열리지 않습니다 — <a style="color:#fff;font-weight:700" href="' + u.href + '">옛 화면(지금 웹앱)으로 열기 ›</a>'; document.body.appendChild(b); }, 25000); } catch (e) {} })();</script>
</body>
</html>
