<title>리드나우(북스킹)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--paper:#FFFFFF;--bg:#F3F5F4;--ink:#1E2B28;--sub:#5B6B66;--line:#DCE3E0;--cloth:#2F5D50;--cloth2:#264D42;--soft:#E6EFEB;--amber:#A8661B;--amberSoft:#FFF4E5;--red:#B0322A;--redSoft:#FDECEA;--gold:#8A6D1D;--goldSoft:#FBF3DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:calc(64px + env(safe-area-inset-bottom,0))}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
.top{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--cloth);color:#fff;padding:10px 16px 12px;padding-top:calc(10px + env(safe-area-inset-top,0))}
.top .row{display:flex;align-items:center;justify-content:space-between}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

.order{border-top:1px solid var(--line);padding:10px 0}

.st.x{background:var(--redSoft);color:var(--red)} .st.c{background:var(--amberSoft);color:var(--amber)}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px;font-weight:700;color:var(--sub)}

.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--cloth)}

.sortbar{display:flex;gap:6px;margin:0 0 8px}.sortbar select{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:#fff}

.rankbtn{display:inline-block}

.tag.cau{background:var(--amberSoft);color:var(--amber)}

.linkbtn{display:block;border:0;background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:4px 2px}
.scwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scb{border-radius:10px;padding:10px;text-align:center}.scb b{display:block;font-size:26px}.scb span{font-size:12px}
.scb.good{background:var(--soft);color:var(--cloth)}.scb.bad{background:var(--amberSoft);color:var(--amber)}
details summary{cursor:pointer;color:var(--cloth);font-weight:600;font-size:13px;margin-top:8px}
.sth{font-size:12.5px;margin:10px 0 4px;color:var(--sub)}.sp{margin-bottom:6px}.spl{display:flex;justify-content:space-between;font-size:12.5px}.spb{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.spb i{display:block;height:100%}.spb.good i{background:var(--cloth)}.spb.bad i{background:var(--amber)}.spt{font-size:11.5px;color:var(--sub)}
.src{font-size:11px;border-radius:4px;padding:0 4px}.src.auto{background:var(--soft);color:var(--cloth)}.src.manual{background:var(--goldSoft);color:var(--gold)}.src.sheet{background:var(--redSoft);color:var(--red)}
.seg{flex-wrap:wrap}.seg button.on.cau{background:var(--amberSoft);color:var(--amber)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mgrid div{background:var(--bg);border-radius:10px;padding:9px}.mgrid b{display:block;font-size:18px}.mgrid span{display:block;font-size:12.5px;font-weight:600}.mgrid small{display:block;font-size:11px;color:var(--sub)}
.rn2{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--cloth);text-align:center;font-size:12px;line-height:22px;font-weight:700}
/* 순위 패널 */
#rank{display:none}
body.withrank.rankopen #rank{display:block;position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:9;background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0)) 12px 90px;box-shadow:-8px 0 24px rgba(0,0,0,.12)}

}

/* 판매자 평가 추이: 상품 수집기가 모은 평가(날짜별 만족·보통·불만족)로 그림. 기간: 전체·1년·6개월·1개월·1주 */
const REVPER = [['all', '전체'], ['y1', '최근 1년'], ['m6', '최근 6개월'], ['m1', '최근 1개월'], ['w1', '최근 1주']];
function reviewTrend(s, rev) {
  if (!s.sc) return '';
  if (!rev || !rev.days) return `<div class="card"><h3>평가 수 추이</h3><div class="hint" style="margin:0">아직 이 판매자의 평가를 모으지 않았습니다. 상품 수집기 → 판매자 평가에서 모으면 기간별 추이가 나타납니다.</div></div>`;
  const per = S.revPer || localStorage.getItem('rn-revper') || 'm6'; if (!REVPER.some((x) => x[0] === per)) S.revPer = null;
  const BACK = { all: null, y1: 365, m6: 180, m1: 30, w1: 7 }; const back = per in BACK ? BACK[per] : 180; // ('전체'의 null이 ?? 때문에 180일로 바뀌던 잘못 고침)
  const since = back ? new Date(Date.now() - back * 864e5).toISOString().slice(0, 10) : '0000';
  const unit = per === 'all' ? 'year' : per === 'y1' ? 'month' : per === 'm6' ? 'week' : 'day';
  const keyOf = (d) => { if (unit === 'year') return d.slice(0, 4); if (unit === 'month') return d.slice(0, 7); if (unit === 'day') return d; const t = new Date(d); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t.toISOString().slice(0, 10); };
  const B = new Map(); let tot = [0, 0, 0];
  Object.entries(rev.days).forEach(([d, v]) => { if (d <= since) return; const k = keyOf(d); const x = B.get(k) || [0, 0, 0]; for (let i = 0; i < 3; i++) { x[i] += v[i] || 0; tot[i] += v[i] || 0; } B.set(k, x); });
  // 빈 구간도 0으로 채움 (추이가 끊겨 보이지 않게)
  const keys = []; if (B.size) { const firstKey = back ? keyOf(since) : [...B.keys()].sort()[0]; const now = new Date(); const pad = (n) => String(n).padStart(2, '0');
    if (unit === 'year') { for (let y = +firstKey.slice(0, 4); y <= now.getFullYear(); y++) keys.push(String(y)); }
    else if (unit === 'month') { let y = +firstKey.slice(0, 4), mo = +firstKey.slice(5, 7); while (y < now.getFullYear() || (y === now.getFullYear() && mo <= now.getMonth() + 1)) { keys.push(`${y}-${pad(mo)}`); mo++; if (mo > 12) { mo = 1; y++; } } }
    else { const t = new Date((back ? since : firstKey) + 'T12:00:00'); let guard = 0; while (t <= now && guard++ < 400) { const k = keyOf(`${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`); if (!keys.includes(k)) keys.push(k); t.setDate(t.getDate() + (unit === 'week' ? 7 : 1)); } } }
  const rows = keys.map((k) => [k, B.get(k) || [0, 0, 0]]); const max = Math.max(1, ...rows.map(([, v]) => v[0] + v[1] + v[2]));
  const n = tot[0] + tot[1] + tot[2]; const W = Math.max(2, Math.min(unit === 'year' ? 44 : 18, Math.floor(620 / Math.max(1, rows.length)) - 1)); const lab = (k) => (unit === 'year' ? k : unit === 'month' ? (k.slice(5) === '01' ? k.slice(2, 4) + '.01' : +k.slice(5) + '월') : k.slice(5).replace('-', '/')); const every = unit === 'year' ? 1 : Math.ceil(rows.length / 10);
  const bars = rows.map(([k, v], i) => { const h = (x) => (x / max) * 110; let y = 120; const seg = (x, c) => { if (!x) return ''; y -= h(x); return `<rect x="${i * (W + 1)}" y="${y.toFixed(1)}" width="${W}" height="${h(x).toFixed(1)}" fill="${c}"/>`; };
    const sum = v[0] + v[1] + v[2]; const top = 120 - h(sum);
    return `<g><title>${k}: 만족 ${v[0]} · 보통 ${v[1]} · 불만족 ${v[2]}</title>${seg(v[0], '#2F7D4F')}${seg(v[1], '#D9A400')}${seg(v[2], '#B0322A')}${unit === 'year' && sum ? `<text x="${i * (W + 1) + W / 2}" y="${Math.max(9, top - 2).toFixed(1)}" font-size="9" text-anchor="middle" fill="#5B6B66">${sum.toLocaleString()}</text>` : ''}${i % every === 0 || i === rows.length - 1 ? `<text x="${i * (W + 1) + W / 2}" y="134" font-size="9" text-anchor="middle" fill="#5B6B66">${lab(k)}</text>` : ''}</g>`; }).join('');
  const st = rev.stats || {};
  return `<div class="card"><h3>평가 수 추이 <small>(${unit === 'year' ? '연도별' : unit === 'month' ? '월별' : unit === 'week' ? '주별' : '일별'})</small></h3>
    <div class="ptabs" style="margin:6px 0">${REVPER.map(([k, l]) => `<button class="${k === per ? 'on' : ''}" data-rper="${k}">${l}</button>`).join('')}</div>
    <div class="mgrid">${mcell(num(n) + '건', (REVPER.find((x) => x[0] === per) || REVPER[2])[1] + ' 평가', rows.length ? `${unit === 'year' ? '연' : unit === 'month' ? '월' : unit === 'week' ? '주' : '일'} 평균 ${(n / rows.length).toFixed(1)}건` : '')}${mcell(n ? Math.round((tot[0] / n) * 1000) / 10 + '%' : '-', '만족 비율', `보통 ${tot[1]} · 불만족 ${tot[2]}`)}${mcell(num(rev6(s) ?? 0) + '건', '최근 6개월', `${esc(rev6src(s).src || '')} · 최근 1개월 ${num(st.d30 || 0)}`)}</div>
    <div style="overflow-x:auto;margin-top:8px"><svg width="${Math.max(200, rows.length * (W + 1))}" height="138" style="display:block">${bars}</svg></div>
    <div class="hint" style="margin:4px 0 0"><span style="color:#2F7D4F">■</span> 만족 <span style="color:#D9A400">■</span> 보통 <span style="color:#B0322A">■</span> 불만족 · 모은 범위: ${esc(st.first || '-')} ~ ${esc(st.last || '-')}${rev.complete ? ' (전체)' : ' (최근분만, 전체 수집 전)'} · ${rev.updatedAt ? tsText(rev.updatedAt) + ' 갱신' : ''}</div></div>`;
}

/* ══════════ 공통: 기간 선택 · 접고 펴기 · 구역 접기 ══════════ */
S.pp = JSON.parse(localStorage.getItem('rn-pp') || '{}'); S.fold = {}; S.sec = JSON.parse(localStorage.getItem('rn-sec') || '{}');
const PK = { day: '일별', week: '주별', month: '월별', year: '연별', r7: '7일간', r30: '30일간', r365: '365일간', all: '전체' };
const ROLL = { r7: 7, r30: 30, r365: 365 };
const z2 = (x) => String(x).padStart(2, '0');
const dstr = (d) => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
function rangeOf(kind, off = 0) {
  if (kind === 'all') return { kind, off: 0, start: null, end: null, label: '전체 기간', days: null, current: true };
  const t = new Date(); t.setHours(0, 0, 0, 0); let s, e;
  if (ROLL[kind]) { // 오늘을 포함해 거꾸로 N일 (이전 = 그 앞 N일)
    const n = ROLL[kind]; e = new Date(t); e.setDate(e.getDate() + 1 + off * n); s = new Date(e); s.setDate(s.getDate() - n);
    const l2 = new Date(e); l2.setDate(l2.getDate() - 1);
    const lab2 = `${s.getFullYear() % 100}.${s.getMonth() + 1}.${s.getDate()} ~ ${l2.getMonth() + 1}/${l2.getDate()}`;
    return { kind, off, start: dstr(s), end: dstr(e), label: (off === 0 ? `이번 ${n}일간 · ` : '') + lab2, days: n, current: off === 0 };
  }
  if (kind === 'day') { s = new Date(t); s.setDate(s.getDate() + off); e = new Date(s); e.setDate(e.getDate() + 1); }
  else if (kind === 'week') { s = new Date(t); s.setDate(s.getDate() - ((s.getDay() + 6) % 7) + off * 7); e = new Date(s); e.setDate(e.getDate() + 7); }
  else if (kind === 'month') { s = new Date(t.getFullYear(), t.getMonth() + off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); }
  else { s = new Date(t.getFullYear() + off, 0, 1); e = new Date(s.getFullYear() + 1, 0, 1); }
  const last = new Date(e); last.setDate(last.getDate() - 1);
  const lab = kind === 'day' ? `${s.getMonth() + 1}/${s.getDate()} (${'일월화수목금토'[s.getDay()]})` : kind === 'week' ? `${s.getMonth() + 1}/${s.getDate()} ~ ${last.getMonth() + 1}/${last.getDate()}` : kind === 'month' ? `${s.getFullYear()}년 ${s.getMonth() + 1}월` : `${s.getFullYear()}년`;
  const now = new Date(); const days = Math.max(1, Math.ceil(((e > now ? now : e) - s) / 864e5));
  return { kind, off, start: dstr(s), end: dstr(e), label: (off === 0 ? { day: '오늘', week: '이번 주', month: '이번 달', year: '올해' }[kind] + ' · ' : '') + lab, days, current: off === 0 };

const shiftYear = (iso, n) => (iso ? `${+iso.slice(0, 4) + n}${iso.slice(4)}` : iso);

const yoyRange = (r) => (r.kind === 'all' || r.kind === 'year' || r.kind === 'r365' ? null : { ...r, start: shiftYear(r.start, -1), end: shiftYear(r.end, -1) });

function picker(id, def) {

  return `<div class="pp" data-pp="${id}"><div class="ptabs">${Object.entries(PK).map(([k, l]) => `<button class="${p.kind === k ? 'on' : ''}" data-ppk="${k}">${l}</button>`).join('')}</div>
    ${p.kind !== 'all' ? `<div class="ppnav"><button data-ppo="-1" aria-label="이전">◀</button><b>${r.label}</b><button data-ppo="1" ${p.off >= 0 ? 'disabled' : ''} aria-label="다음">▶</button>${p.off ? '<button data-ppo="0" class="now">지금</button>' : ''}</div>` : ''}</div>`;
}
const rangeFor = (id, def) => { const p = S.pp[id] || (S.pp[id] = { kind: def || 'all', off: 0 }); return rangeOf(p.kind, p.off); };
// 긴 목록은 보이는 줄만 만듦 (lzmap: 수천 줄이어도 화면에 보일 10줄만 계산)

function saleLines(o) { let qty = 0, amt = 0, cq = 0, rq = 0; (o.items || []).forEach((it) => { const q = it.qty || 1; if (it.lineStatus === 'normal') { qty += q; amt += (it.price || 0) * q; } else if (it.lineStatus === 'returned') rq += q; else if (it.lineStatus !== 'cancelledInOrder' && /cancel/i.test(it.lineStatus || '')) cq += q; }); return { qty, amt, cq, rq }; }
function firstMap() { if (S._firstMap && S._firstMapN === S.orders.size) return S._firstMap; const m = new Map(); for (const o of S.orders.values()) { if (o.kind !== 'sale') continue; const d = String(o.orderedAt || '').slice(0, 10); if (d && (!m.has(o.customerId) || d < m.get(o.customerId))) m.set(o.customerId, d); } S._firstMap = m; S._firstMapN = S.orders.size; return m; }

    const c = A.cust.get(o.customerId) || { orders: 0, amt: 0, qty: 0 }; c.orders += 1; c.amt += L.amt; c.qty += L.qty; A.cust.set(o.customerId, c);

/* 매출 추이: 일·주·월·연 */

const HOME_DEFAULT = ['alerts', 'pace', 'goal', 'cheapValid', 'cheapFirst', 'margin', 'purUnit', 'purRecover', 'purMonth', 'sales', 'cust', 'reviews', 'inv', 'topBooks', 'topCust', 'sellers', 'shortcuts'];
function homeLayout(mode) {
  const adm = (S.homeAdmin && S.homeAdmin.widgets) || HOME_DEFAULT;
  if (mode === 'admin') return adm.filter((k) => WIDGETS[k]);
  const p = JSON.parse(localStorage.getItem('rn-home') || 'null'); return (p || adm).filter((k) => WIDGETS[k]);
}
function renderHome(m) {
  const mode = S.homeMode || localStorage.getItem('rn-homemode') || 'personal'; const edit = S.homeEdit && (mode === 'personal' || isAdminDevice());
  const lay = homeLayout(mode); const personalSaved = !!localStorage.getItem('rn-home');
  const head = `<div class="homebar"><div class="ptabs"><button class="${mode === 'personal' ? 'on' : ''}" data-hm="personal">개인 페이지</button><button class="${mode === 'admin' ? 'on' : ''}" data-hm="admin">관리자 페이지</button></div>
    <button class="btn ghost sm" id="hedit" ${mode === 'admin' && !isAdminDevice() ? 'disabled title="관리자 기기만 편집할 수 있습니다"' : ''}>${edit ? '편집 끝내기' : '편집'}</button></div>
    <p class="hint" style="margin:4px 2px 8px">${mode === 'personal' ? (personalSaved ? '이 기기에만 저장된 내 배치입니다.' : '아직 내 배치가 없어 관리자 배치를 보여 줍니다. 편집하면 이 기기에만 저장됩니다.') : `모든 기기가 기본으로 보는 배치입니다.${isAdminDevice() ? '' : ' 관리자 기기에서만 바꿀 수 있습니다.'}${S.homeAdmin && S.homeAdmin.byName ? ` 마지막 변경: ${esc(S.homeAdmin.byName)}` : ''}`}</p>`;
  if (edit) {
    const rows = lay.map((k, i) => `<div class="hrow"><b>${WIDGETS[k][0]} <small>${esc(WIDGETS[k][2] || '')}</small></b><span><button data-mv="${i}:-1" ${i ? '' : 'disabled'}>↑</button><button data-mv="${i}:1" ${i < lay.length - 1 ? '' : 'disabled'}>↓</button><button data-rm="${i}">빼기</button></span></div>`).join('');
    const avail = Object.keys(WIDGETS).filter((k) => !lay.includes(k)); const cats = [...new Set([...W_ORDER, ...avail.map((k) => WIDGETS[k][2])])];
    const add = cats.map((c) => { const ks = avail.filter((k) => WIDGETS[k][2] === c); return ks.length ? `<div class="wcat"><b>${esc(c)}</b><div class="sc">${ks.map((k) => `<button data-add="${k}" title="${esc(WIDGETS[k][3] || W_DESC[k] || '')}">＋ ${WIDGETS[k][0]}<small>${esc(WIDGETS[k][3] || W_DESC[k] || '')}</small></button>`).join('')}</div></div>` : ''; }).join('');
    m.innerHTML = head + `<div class="card"><h3>보이는 칸 (위에서부터)</h3>${rows || '<div class="hint">없음</div>'}<h3 style="margin-top:12px">더할 수 있는 칸 <small>(${Object.keys(WIDGETS).length - lay.length}개)</small></h3>${add || '<span class="hint">모두 들어 있음</span>'}
      ${mode === 'personal' && personalSaved ? '<button class="btn ghost" id="hreset" style="margin-top:12px">내 배치 지우고 관리자 배치 따르기</button>' : ''}</div>`;
    const save = async (L) => { if (mode === 'personal') { localStorage.setItem('rn-home', JSON.stringify(L)); renderMain(); } else { try { await db.collection('app_settings').doc('home').set({ widgets: L, by: S.user.email, byName: S.user.displayName || S.user.email, device: deviceName(), at: TS() }); } catch (e) { toast('저장 실패: ' + e.message); } } };
    m.querySelectorAll('[data-mv]').forEach((b) => (b.onclick = () => { const [i, d] = b.dataset.mv.split(':').map(Number); const L = lay.slice(); [L[i], L[i + d]] = [L[i + d], L[i]]; save(L); }));
    m.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { const L = lay.slice(); L.splice(+b.dataset.rm, 1); save(L); }));
    m.querySelectorAll('[data-add]').forEach((b) => (b.onclick = () => save([...lay, b.dataset.add])));
    const hr = $('#hreset'); if (hr) hr.onclick = () => { localStorage.removeItem('rn-home'); renderMain(); };
  } else {
    // 칸을 먼저 자리만 그리고, 위에서부터 하나씩 채움 (계산이 많아도 화면이 멈추지 않게)
    const gen = (S._homeGen = (S._homeGen || 0) + 1);
    m.innerHTML = head + lay.map((k) => `<div class="card wcard" id="wc_${k}"><h3>${WIDGETS[k][0]}</h3><div class="wbody">${S._wcache && S._wcache[k] ? S._wcache[k] : '<div class="wload"></div>'}</div></div>`).join('');
    const bindW = (el) => {
      bindUI(el, renderMain);
      el.querySelectorAll('[data-sid]').forEach((b) => (b.onclick = () => openSeller(b.dataset.sid)));
      el.querySelectorAll('[data-pid]').forEach((b) => (b.onclick = () => openProduct(b.dataset.pid)));
      el.querySelectorAll('[data-cid]').forEach((b) => (b.onclick = () => b.dataset.cid && openCustomer(b.dataset.cid)));
      el.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { const [t, f] = b.dataset.go.split(':'); S.tab = t; if (f) S.flagList = f; if (b.dataset.cv2) S.custView = b.dataset.cv2; renderTabs(); renderMain(); window.scrollTo(0, 0); }));
    };
    bindW(m); S._wcache = S._wcache || {};
    const fill = (k) => {
        if (gen !== S._homeGen || S.tab !== 'home') return; const el = document.getElementById('wc_' + k); if (!el || el._done) return; el._done = true;
        let html; try { html = WIDGETS[k][1](); } catch (e) { console.error(k, e); html = `<div class="hint" style="margin:0;color:var(--red)">표시 오류: ${esc(e.message)}</div>`; }
        S._wcache[k] = html; const body = el.querySelector('.wbody'); body.innerHTML = html; bindW(body); updPaint();
    };
    if ('IntersectionObserver' in window) { const io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { io.unobserve(en.target); const k = en.target.id.slice(3); setTimeout(() => fill(k), 0); } }), { rootMargin: '600px 0px' }); lay.forEach((k) => { const el = document.getElementById('wc_' + k); if (el) io.observe(el); }); }
    else (async () => { for (const k of lay) { await new Promise((r) => setTimeout(r, 0)); fill(k); } })();
  }
  m.querySelectorAll('[data-hm]').forEach((b) => (b.onclick = () => { S.homeMode = b.dataset.hm; localStorage.setItem('rn-homemode', b.dataset.hm); S.homeEdit = false; renderMain(); }));
  $('#hedit').onclick = () => { S.homeEdit = !S.homeEdit; renderMain(); };
  if (!S.sellersLoaded && lay.includes('sellers')) syncSellers().then(() => { if (S.tab === 'home') renderMain(); }).catch(() => {});
}

function recoveryStats() {

    return { net, disp: D.amt, bb: B.amount, total: net + D.amt + B.amount, cost: X.total, left: X.total - (net + D.amt + B.amount) }; });

  <h4>3. 판정 모델의 층 구조 (로드맵)</h4>
  <table class="tbl"><tr><th>층</th><th>무엇으로 판단</th><th>상태</th><th>다음 층으로 바꾸는 조건</th></tr>

  <h4>4. 재고 기간 = 최저가 등록 기간</h4>
  <p>재고 단계(신규~불용)는 <b>우리가 최저가 자리를 지킨 날수</b>로 잽니다. 두 관측이 모두 최저가였고 간격이 ${D.lowestMaxGapHours || 48}시간 이하일 때만 그 사이를 셉니다.<br>

  <b>불용(4년 초과)</b>: 등록일 기준 · <b>일시판매중지</b> + 관리코드 뒤 3자리 <b>BAD</b> (관리자 승인, 원래 관리코드는 기록에 남김). 판매중지는 알라딘이 다른 이유로 쓰는 일이 많아 쓰지 않고, '판매금지'는 알라딘만 정하는 상태입니다.</p>
  <h4>5. 가격 정하기</h4>
  <p><b>상태 등급: 최상 &gt; 상 &gt; 중</b>(최상이 가장 좋음), 등급 계수 ${Object.entries(D.gradeCoef || {}).map(([k, v]) => k + ' ' + v).join(' · ')}. 소비자는 상태가 같거나 <b>더 좋은</b> 매물이 더 싸면 그쪽을 사므로, 같은 등급뿐 아니라 <b>더 좋은 등급의 유효 매물도 모두 기준 후보</b>로 봅니다 — 더 좋은 등급 매물의 판매가를 우리 등급 값으로 환산해, 우리 가격이 항상 그보다 확실히 싸게 합니다. 더 나쁜 등급 매물은 기준으로 삼지 않되(상태 이점), 우리보다 싸면 이유 칸에 알립니다.<br><b>가격 단위</b>: 가격대의 5% — 100원대 5원 · 1,000원대 50원 · 10,000원대 500원 · 100,000원대 5,000원. 결정 화면·일괄 처리의 ±5% 버튼과 할인·환산 결과는 모두 이 단위로 맞춥니다(정확히 같은 가격으로 맞출 때만 단위 예외).<br>유효 최저가와 <b>정확히 동가</b>가 기본이고 <b>구매자 이점(더 깎기)은 주지 않음</b>. <b>맨 위 동가 우선</b>: 기준이 목록 맨 위(최저가 표시)면 재고 기간 할인도 하지 않고, 맨 위 같은 등급 유효 매물 밑으로는 내리지 않음 — 최저가 표시는 같은 가격이면 함께 달리고, 그 자리를 뺏으면 상대(프로그램 포함)와 출혈 경쟁이 시작되기 때문. 더 좋은 등급 기준은 <b>판매가끼리</b> 비교(그 판매가 × 등급 계수, 단위 내림 — 배송비는 넣지 않음). <b>알라딘측</b> = 알라딘 직접 배송(판매자 번호 0)·이 광활한 우주점·알라딘 중고매장 ○○점 — 유효 판매자와 같이 항상 기준 후보, 알라딘측 균일가는 '중'으로 봄. 기준이 목록 맨 위(최저가 표시)이고 배송비가 우리와 비슷하면(차이 ${(D.firstTieMaxShipGap || 1000).toLocaleString()}원 이하) 판매가 동가로 서고 더 내리지 않음 · <b>맨 위 매물의 배송비가 그보다 비싸면</b> 판매가를 맞추면 배송비 차이만큼 마진을 버리므로 총액 기준 · 그 밖에는 배송비 차이를 반영해 ${Math.round((D.advPct || 0.05) * 100)}% 이점 · 가격 단위는 가격대의 5% · <b>하한선은 알라딘 매입가 하나뿐</b>: 목표가가 '알라딘 매입가 하한가'(팔아서 손에 남는 돈 = 알라딘 매입가가 되는 판매가)보다 <b>${Math.round((D.buybackTolerance ?? 0.1) * 100)}% 넘게 낮을 때만</b> 하한가에 멈추고 '알라딘에 팔기' 검토로 표시, 그 안이면 최저가를 그대로 맞춤 (원가 하한선 없음 — 이미 산 책의 값은 되돌릴 수 없으므로). <b>'중' 상품은 알라딘이 사지 않으므로 매입가 하한선이 없음</b> · 알라딘 반영 지연 때문에 변화는 ${D.confirmHours || 24}시간 확정 뒤 판단 · 판매자 기록이 없는 매물이 기준보다 앞에 있으면 판매자 정보부터 모음.</p>
  <h4>6. 가격 감시 표시</h4>
  <p>수집기(샵매니저 상품 조회/수정 목록)와 웹앱 상품 목록·상세에 묶음이 색으로 표시됩니다: <span class="tag mon-treat">감시·적용</span>(파랑) 판정 엔진이 매일 보고 가격을 맞춤 · <span class="tag mon-control">감시·비교</span>(보라) 판정만 기록하고 가격은 절대 안 바꿈(효과 측정용) · <span class="tag mon-hold">가격상승대기 PND</span> 판매보류풀 · <span class="tag mon-retire">불용 BAD</span> · <span class="tag mon-excluded">자동 제외</span>(빨강, KHKDVD 등 — 관리자 확인 필수). 초록은 검토, 노랑은 판매자 분류에 쓰는 색이라 감시 표시에는 쓰지 않습니다. 샵매니저 목록 위 범례에서 <b>이 쪽만</b>(지금 쪽에서 그 묶음만 남기기)·<b>전체 모아보기</b>(우리 상품 기록 전체에서 그 묶음만 골라 정렬)를 누를 수 있고, 웹앱은 상품 탭 '가격 감시' 칸의 숫자를 누르면 같은 목록이 나옵니다. 지금 비율: 적용 ${ro.treatPct || 0}% · 비교 ${ro.controlPct || 0}%. 묶음은 상품코드로 고정 배정되어 비율을 올려도 이미 들어간 상품은 그대로.</p>
  <h4>7. 관리자 판정 기간 (지금)</h4>
  <p>감시 상품은 엔진 판정과 관계없이 <b>모두</b> 관리자 결정 대기에 들어갑니다(바꾸자는 것·유지·기다림·확인 모두). 결정: [−·입력칸·+·<b>승인</b>] = 입력칸 가격으로 결정(−·+ 비율은 화면 위 '올림·내림 n%'에서 바꿈, 가격대 5% 단위로 맞춤) · 그 오른쪽에 따로 <b>추천가격으로</b>(언제나 엔진 추천가 — 추천이 '바꾸지 말자'면 지금 가격) · <b>지금 가격 유지</b>(언제나 지금 가격) · 지금 가격 유지 · 판매보류풀로(PND, 입력칸 가격 = 최저 수용가) · 거절. 결정한 것은 '결정함' 탭으로 옮겨지고 거기서 다시 정하거나 원상복귀(하나씩·전체, 범위 = 이번 접속 / 이번 감시 바퀴)할 수 있습니다. 판단 이유는 기준 매물·판매자 분류·등급·수요 전략·채널로 나눈 코드라 엔진이 같은 상황을 스스로 알아보는 학습 신호가 됩니다. 관리자가 정해 아직 반영 안 된 결정은 새 판정이 절대 덮지 않습니다. 결정한 가격만 반영되고, 모든 결정은 이유·메모·그때의 매물 목록과 함께 <b>지우지 않는 판단 기록</b>(prd_price_reviews)에 쌓입니다. 이 기록을 분석해 엔진을 고친 뒤에 자동화로 넘어갑니다. 실제로 바뀐 가격은 '판정·반영 목록 → 실제 반영'에서 보고 되돌릴 수 있습니다(웹앱·샵매니저 둘 다).<br><b>가격 감시 탭은 딱 한 PC의 딱 한 탭</b>: 샵매니저 '가격 감시' 탭에서 '이 탭을 가격 감시 탭으로'를 누르면 그 탭만 작동하고 다른 모든 탭·PC는 즉시 꺼집니다(회색).</p>
  <h4>7-2. 수동 일괄 처리</h4>
  <p>상품 탭 → 가격 감시 → '수동 일괄 처리'. 조건(등급·판매가·관리코드·등록일·이름 키워드·빼기)을 고를 때마다 해당 상품 수가 바로 바뀝니다. 기준(무조건 최상단 배치 / 유효 같은 등급 대비 최저가), 기준 판매자 범위(노랑·주황·빨강 추가), 기준 대비 x%, 등급 환산(이 그룹만 계수 변경), 하한선(알라딘 매입가·최소 판매가·최대 인하폭)을 정하면 상품마다 추천가와 이유가 나오고, 체크한 것을 한꺼번에 '관리자 가격'으로 결정합니다. 시장 자료는 수집기의 시장 지표(온라인 중고 첫 페이지)를 쓰며 상품마다 수집 날짜가 보입니다. 그룹 조건은 저장돼 다시 쓸 수 있고, 모든 결정은 그룹 이름과 함께 판단 기록에 남습니다.</p>
  <h4>7-3a. 가격 결정 화면 보는 법</h4>
  <p>상품마다 크게: <b>우리 상태</b>(최상·상·중 글자) · <b>지금 가격 → 엔진 추천 가격</b>, 그 아래 엔진 판정(바꾸자 · 유지 = 이미 기준과 같음 · 기다림 = 24시간 확정 등 판단을 미룬 이유 · 확인 = 기준을 못 찾음)과 <b>등록일</b>. 탭: 변경 결정 대기(엔진이 바꾸자는 것) / 변경 없음·유지(엔진이 바꾸지 말자는 것 — 유지·기다림·확인, 예전 감시기가 결정 대기에 올리지 않았던 것도 여기) / 결정함 / 전체 미결정.<br>
  오른쪽 블록 한 줄 = <b>[?] 상태 판매가 · 판매자 이름 (배송비: n)</b>. 블록 배경 = 온라인 중고 페이지(판매자 툴팁)의 줄 색 그대로 — 판매자 분류 5색 · 알라딘측 파랑 · <b>북스킹 남색(노란 테두리)</b>, 판매자 기록이 아직 없는 매물은 무효 색. 상태는 알라딘 색 네모: <b>최상 분홍 · 상 초록 · 중 회색</b>(흰 글자). 자료는 가격 감시기가 판정 때 본 첫 페이지, 없으면 수집기 시장 지표의 첫 페이지(블록 아래에 출처 표시). 블록을 누르면 그 매물 페이지, <b>?</b>를 누르면 구매 유의 사항 글과 사진이 뜹니다. 온라인 중고 페이지는 언제 열어도 매물 목록(반값택배 줄)이 화면 맨 위에 오도록 내려간 채로 열립니다 — 판매자 툴팁이 맡으므로 '온라인중고 바로가기'를 꺼 둬도 같음. '전체중고 창 지정하기'를 누르면 새 탭이 열리고 그 탭이 지정 창이 되어, 이후 전체중고·매물 링크가 모두 그 탭 하나에서 열립니다. 같은 블록이 수동 일괄 처리와 상품 목록 화면(유효 최저가보다 싸게 파는 상품·오래된 재고 등 상품이 나열되는 모든 목록)에도 붙습니다 — 목록에서는 수집기 시장 지표의 첫 페이지 기준(날짜 표시).</p>
  <h4>7-3. 블록의 ? 표시</h4>
  <p>결정 화면 오른쪽 블록 왼쪽의 <b>?</b> = 그 매물에 '중고상품 구매 유의 사항' 글이 있거나 새상품 표지와 다른 사진(판매자 실사진)이 있음. 마우스를 올리면 내용. 수집기 '경쟁 매물 유의사항·사진'(버튼, 상품 일괄·모두 일괄에 포함)이 우리 책마다 온라인 중고 <b>첫 페이지의 다른 판매자 매물 전부</b>를 모읍니다(가격 감시 중인 책 먼저). 다시 확인 주기는 수집기 설정에서 바꿈(기본 30일, 0 = 매번). 내용이 바뀌면 <b>이전 내용을 덮어쓰지 않고 새 판으로 쌓아 모두 보관</b>하고, 같으면 판을 늘리지 않고 확인 시각만 남깁니다.</p>
  <h4>7-6. 알라딘 판매관리 흐름과 오늘 출고</h4>
  <p>① 주문확인요청 → [발송준비시작] → ② <b>발송 요청</b>(송장 입력) → [입력완료] → ③ 배송&구매확정전(고객이 수령확인·평가하거나, 출고 후 5일 안에 안 누르면 6일째 자동 구매확정) → ④ 구매확정&정산대기(다음 날 새벽 예치금 정산) → ⑤ 정산완료(3개월 보관). <b>오늘 출고 = ② 발송 요청 탭의 주문</b>이고 영업일(주말·설정 ⑫의 휴일 제외) 13~15시에 출고합니다(고객 안내 13시). 매출(0~24시 주문)과 출고(어제 출고 뒤부터 오늘 출고까지 모인 주문)는 따로 셉니다.<br>
  <b>오늘 출고 화면</b>(홈 알림 · 상품 탭 '오늘 출고'): 수집기 '발송 요청 읽기'(영업일 9~16시 15분마다 저절로)가 읽은 주문을 서가 순서로 보여 줍니다 — 주문은 절대 섞지 않고, 주문 안 상품은 서가 순서(PNKLUX → [BLK·YLW·GRY·GRN] → REDFGN → BLU → SKY → MGZ → ORGCMC → KHKDVD → KHKCPD → 그 외, 각각 따로 서가) → 같은 서가 안에서는 이름 철자 순. <b>BLK·YLW·GRY·GRN만 한 서가</b>(뒤 3자리 상관없이 한 책장에 섞여 꽂혀 있으므로 관리코드를 가리지 않고 섞어서 이름 철자 순), 주문끼리는 첫 상품의 서가 순. 관리코드는 앞 6자리로 봄(뒤의 _ms·-날짜 등은 무시). 상품마다 휴대폰은 위에서부터 <b>관리코드</b>(서가 색 띠, 서가 6글자 크게 · 같은 주문의 몇 번째 책 1/3 · 2권 이상이면 빨간 'n권') → <b>등급+제목</b> → <b>사진</b> → <b>상태 글</b>(우리 매물의 구매 유의 사항, 주황 칸) → 그 외(수량·판매가·서가·<b>등록일(굵게)</b>·주문·시장 블록) → 맨 아래 <b>같은 책 다른 재고</b>(판매중인 우리 상품의 상태등급·제목·상품 유의사항 — 유의사항은 수집기가 모은 것만) 순서로 쌓이고, 서가별 보기에서는 주문 순번(동그라미 숫자)이 관리코드 띠 오른쪽에 붙고, PC는 왼쪽 코드·사진 / 가운데 제목·상태·그 외 / 오른쪽 시장 블록(사진은 늘 제자리 — 누른 사진이 그 자리에서 커지고 크던 사진은 작아짐, 앞표지는 늘 첫 자리, 두 번 누르면 원본). 주문별 보기 머리 칸(화면을 내려도 위에 붙어 있음)의 '정렬'에서 <b>서가 순</b>(기본) 대신 <b>관리코드 순</b>을 고를 수 있음 — 주문 안 상품을 관리코드 글자 순(같은 코드면 이름 순), 주문끼리는 첫 상품의 관리코드 순(주문은 어느 쪽이든 섞지 않음, 고른 것은 그 기기에 기억). 오른쪽 아래(동그란 보기 단추 왼쪽) '⇄' 단추를 누르면 <b>서가별(상품) 보기</b>로 바뀜 — 주문을 풀어 모든 상품을 서가 순서, 서가 안에서는 이름 철자 순으로 늘어놓고 상품마다 주문 번호·수령인을 붙임(서가를 한 바퀴 돌며 꺼낼 때). 다시 누르면 주문별. 스크롤하면 지금 보는 상품의 주문·서가 머리 띠가 맨 위(머리 칸 바로 아래)에 붙어 있고, 다음 주문·서가가 올라오면 그 띠로 바뀝니다(끈끈한 머리 띠). 맨 아래에는 택배로 보낼 현금 판매가 따로 나옵니다. '출고 확정'은 지금은 기록만 하고, ALPS 송장 출력·알라딘 송장 일괄등록은 양식 파일을 받은 뒤 이 버튼에 붙입니다. 알라딘 송장 일괄등록은 <b>CSV 파일만</b> 받습니다(팝업 step1의 일괄등록용 엑셀에 송장번호를 넣고 CSV로 저장).<br>
  <b>출고 지연 알림</b>: 출고 예정 영업일(마감 시각 전 주문은 그날, 아니면 다음 영업일)에서 설정 ⑧의 영업일 수가 지나도 출고 기록이 없을 때.</p>
  <h4>7-8. 기록 받기와 이 기기 저장 용량</h4>
  <p>웹앱은 탭을 열 때 그 탭에 필요한 기록만 받습니다(받은 것은 기기에 저장돼 다음엔 바뀐 것만). 머리 칸 <b>⬇</b>를 누르면 모든 기록을 한 번에 받는 칸이 펼쳐집니다 — 단계별 진행, 끊기면 끝난 단계는 건너뛰고 큰 기록은 1,000건씩 받은 위치부터 이어 받음, 접어도 계속 받음, '웹앱을 열면 저절로'(기본 켬). 같은 칸에 이 기기가 웹앱 기록에 쓰는 저장 용량·한도와 기록 수가 나옵니다. 아래로 스크롤하면 머리 칸이 얇은 띠 하나(제목·⬇)로 줄고, 맨 위로 가거나 위로 조금 올리거나 띠를 누르면 다시 펼쳐집니다. 받다가 안 되는 단계는 3번까지 다시 시도하고, 그래도 안 되면 빨갛게 표시하고(이유는 마우스를 올리면) 다음 단계로 넘어갑니다. 오늘 출고는 홈 알림·상품 탭 버튼·<b>주문·매출 탭 맨 위</b>에서 엽니다.</p>
  <h4>7-7. 끝없는 탐색 수집</h4>
  <p>수집기 버튼으로만(일괄 수집 제외). 우리 책들의 함께 산 책·함께 클릭한 책에서 시작해, 새 책마다 도서 정보·사진·분야·평점·온라인 중고 시장 지표·구매자 분포를 모으고 그 책의 함께 산 책을 다시 대기열(prd_explore)에 넣어 멈출 때까지 넓혀 갑니다. 처음 보는 판매자는 판매자 목록에 넣어 판매자 수집이 이어 모읍니다. 탐색으로 모은 책은 '탐색' 표시로 우리 상품·알라딘 구매 풀과 구분되고, 나중에 매입하면 같은 기록을 그대로 씁니다. 다른 작업이 시작되면 잠시 멈췄다가 그 작업이 끝나면 다시 이어갑니다.</p>
  <h4>7-5. 오래 도는 수집의 메모리</h4>
  <p>수집기는 탭 메모리가 한계의 65%를 넘거나 숨은 창으로 연 페이지가 400개를 넘으면 진행 위치를 저장하고 탭을 새로고침한 뒤 같은 작업을 그 자리부터 자동으로 이어갑니다(기록에 '메모리 정리'로 남음). 숨은 창은 20번마다 새로 만들고, 툴팁·감시기는 숨은 창 안에서 돌지 않습니다.</p>
  <h4>7-4. 알라딘 요청 속도 (모든 수집·감시 공통)</h4>
  <p>상품 수집·고객 수집·가격 감시가 <b>자동 조절 하나</b>를 같이 씁니다(같은 PC의 모든 탭·스크립트가 공유). 1.2초 간격으로 시작해 연속 20번 성공마다 10%씩 빨라져 <b>최소 0.7초</b>까지 가고, 실패·시간 초과는 2배, 로그인 풀림 3배로 느려집니다(최대 20초). <b>알라딘이 '요청이 너무 많다(429)'고 하면</b> 간격 4배 + 이 PC의 모든 수집이 함께 1분 쉼(거듭되면 2·3…10분) — 성공이 쌓이면 다시 빨라짐. 숨은 창으로 상품 페이지를 통째로 여는 '구매자 분포'는 페이지 하나가 요청 수십 번이라 간격 3배. 같은 인터넷 주소의 여러 PC가 동시에 돌면 그 수만큼 간격을 늘림. 최소·최대는 설정 ⑨.<br>
  <b>안전한 새로고침</b>: 수집기가 스스로 새로고침할 때(메모리 정리·새 버전) 바로 새로고침하지 않고 ① 알라딘이 정상 응답할 때까지 기다림(30초→1·2·4…15분) ② 새 탭으로 엶 ③ 새 탭의 수집기가 실제로 뜨면 옛 탭을 닫음 ④ 2분 안에 안 뜨면(429 오류 화면) 그 탭을 닫고 다시 — 크롬 오류 화면에 멈추지 않음. 새 탭은 저장된 자리부터 사람 확인 없이 자동으로 이어가고, 옛 탭이 가격 감시 탭이었으면 새 탭이 이어받습니다. 모든 과정은 작업 기록에 <b>[안전한 새로고침]</b>으로 남습니다(이유·서버 확인 결과와 횟수·걸린 시간·새 탭이 이어받음·닫은 탭·이어간 작업). 옛 탭을 닫기 직전 남은 기록을 이 PC와 Firebase에 바로 저장하므로 끊김이 없습니다 — '기록' 화면에서 '[안전한 새로고침]'으로 찾아볼 수 있습니다. (크롬 오류 화면 자체에서는 어떤 스크립트도 돌 수 없어 '새로고침' 버튼을 대신 누를 수 없으므로, 그 화면에 가지 않게 막는 방식)</p>
  <h4>7-1. 실제 적용 단계</h4>
  <p><b>적용 상품은 사람이 고르지 않고 상품코드로 정해지는 무작위</b>입니다(측정이 공정하도록). 단 <b>${esc((prSettings().excludeSku || []).join(', '))}</b>는 마진 구조가 달라 비율과 관계없이 항상 자동 감시에서 빼고, 자동화를 따로 정할 때까지 무조건 관리자 확인입니다.<br><b>가격 감시기</b>는 수집기와 따로 도는 스크립트입니다(작업 잠금·진행 기록·저장 칸 모두 따로, 로그인은 수집기에 맡김). 웹앱에서 지정한 감시 PC 한 대에서만 돌고, 알라딘 요청 간격을 3~5초로 둬 같은 인터넷 주소의 수집과 부딪히지 않습니다. 상품 탭 맨 위 '가격 감시' 칸에서 시작·멈춤·전체 정지·승인합니다. 감시 PC의 샵매니저 화면에서는 오른쪽 위 탭 묶음(▶ 모두 · 고객·주문 · 상품·매입 · <b>가격 감시</b> · 기록)의 '가격 감시' 탭에 있고, 탭 이름 옆 점이 상태입니다(파랑 감시 중 · 회색 대기 · 빨강 문제). 감시기 칸의 '기록 내려받기'로 날짜별 기록을 파일로 받을 수 있고, 같은 기록이 웹앱 '기록 → 수집 작업 기록 목록'에도 [가격 감시]로 함께 보입니다(감시기 PC 이름을 수집기와 같게 지으면 한 줄로 합쳐 보임).<br>A: 1% 실제 적용 <b>3일</b>(실행이 정확한지 안전 확인) → B: 적용 25% vs 비교 25% <b>1주</b> → 확인 후 C: 적용 묶음 안에서 강도(맨 위 동가 / 한 단위 아래 / 유효 최저만)를 나눠 '다이얼 눈금' 만들기 → D: 전체. 비교 묶음은 C 이후에도 계속 두어 측정을 이어감(1주는 묶음당 판매 약 40건이라 아주 큰 차이만 보임).</p>
  <h4>8. 판매보류풀 — 가격상승대기</h4>
  <p>상품마다 '최저 수용가'를 정해 두고, 그 가격 이상으로 최저가 자리에 설 수 있을 때만 판매중, 아니면 일시판매중지. <b>관리코드 뒤 3자리를 PND로</b> 바꿔 구분합니다(예: BLKCMN → BLKPND · 앞 3자리 서가는 그대로 · 원래 가격 코드와 최저 수용가는 Firebase에 남김). 판매중↔일시판매중지 전환은 ${D.confirmHours || 24}시간 확정 + 최소 유지 시간을 둬 깜빡이지 않게 함. <b>일시판매중지 = 우리 전용 보관함</b>: 관리코드 뒤 PND = 판매보류풀, BAD = 불용. 이 둘이 아닌 일시판매중지 상품은 엔진이 건드리지 않고 처리 여부를 묻습니다.<br>
  <b>풀이 확실히 돈이 되는 경우는 두 가지</b>: ① <b>공급이 적은 책</b> — 우리 매물이 보이면 시장 가격을 붙잡아 둠, 숨기면 다른 판매자 가격이 오를 여지 ② <b>추격자가 붙은 책</b> — 보이는 동안 계속 따라 내려옴. 그 밖의 책은 수용가로 <b>계속 보여 두는 편이 낫습니다</b>(허위 매물을 피해 오는 손님에게 팔릴 기회가 남음).<br>
  ★ 확인할 위험: 판매상태를 바꿨다 돌리면 알라딘에서 등록일·노출 순서가 바뀌는지 아직 모름 → A단계에서 소수로 먼저 확인.</p>
  <h4>9. 샵매니저 실제 동작 (확인된 것)</h4>

  <p>온라인 중고 첫 페이지 매물의 변화(새 매물·빠진 매물·가격 변화)를 수집기 1.21.0부터 지우지 않고 쌓음(prd_metric_changes, kind = usedListings). 3층 판정과 실험 측정의 원자료.</p>`;

const Q_DONE = ['Yes', '취소된 질문']; // 샵매니저 묻고 답하기 '답변여부'에 실제로 나오는 값: Yes = 답함, 취소된 질문 = 고객이 취소

function sheetCutoff() { return memo('sheetCut', () => S.pur.entries.filter((e) => e.source !== 'app' && !e.deleted && (e.date || e.dateGuess)).reduce((a, e) => ((e.date || e.dateGuess) > a ? (e.date || e.dateGuess) : a), '')); }

function aoLinked() { return memo('aoLinked', () => { let cost = 0, n = 0; for (const m of S.pmatch.values()) { if (m.kind === 'none' || !m.itemKey || !String(m.itemKey).startsWith('ao_')) continue; cost += +m.cost || 0; n += m.qty || 1; } return { cost, n }; }); }
function aladinOrderEntries() {

function splitAladinOrder(e) {
  const L = e._lines || []; const amt = +e.amt || 0; const totalQ = Math.max(1, (e._ao && e._ao.qty) || L.reduce((a, x) => a + (x.qty || 1), 0) || 1);
  if (!L.length) return { items: [{ title: e.txt || '(내용 없음)', grade: null, qty: totalQ, price: null, est: Math.round(amt / totalQ) }], totalQ, unit: amt / totalQ, how: '주문 요약만 있음 (상세 수집 전) · 총액 ÷ 권수', aladin: true };

/* ══════════ 미등록 보유 상품 = 세 개의 풀 ══════════
 * ① 알라딘구매풀 (확정): 수집한 알라딘 주문의 책 중 아직 상품과 연결 안 된 것 — 하나하나 근거 있음
 * ② 김미소상품풀 (실사 추정 → 등록이 끝나면 확정): 실사 수량 − 실사 뒤 _ms로 등록한 수

 * 대량매입중폐기율 = 뭉치로 산 것 중 버리게 되는 비율 — 지금은 김미소상품풀로 계산(폐기 ÷ (폐기 + 등록·판매 + 남은 실사)), 대량 매입이 등록을 마칠 때마다 근거가 늘어남 */
const MS_POOL_DEFAULT = { books: 15000, dvd: 200, cd: 800, at: '2026-10-02' };
function poolModel() {
  return memo('poolModel', () => {
    const st = S.pur.set || PSET_DEFAULT; const X = purStats(); const D = dispStats();
    // ① 알라딘구매풀
    const AP = aladinPool(); const aTot = AP.reduce((a, r) => a + (r.qty || 1), 0); const aLk = AP.filter((r) => r.links.length).reduce((a, r) => a + (r.qty || 1), 0); const aUn = aTot - aLk;
    // ② 김미소상품풀
    const ms = { ...MS_POOL_DEFAULT, ...(st.msPool || {}) }; const msSurvey = (+ms.books || 0) + (+ms.dvd || 0) + (+ms.cd || 0);
    const msSince = [...S.plist.values()].filter((l) => /_ms$/i.test(l.sku || '') && String(l.registeredAt || '').slice(0, 10) >= ms.at).reduce((a, l) => a + (l.qty || 1), 0);
    const msRem = Math.max(0, msSurvey - msSince); const msDone = X.G.ms.active + X.G.ms.sold;
    // 폐기 나누기
    const dMix = +(st.dispMixed ?? 2500); const dMs = [Math.max(0, D.booksLo - dMix), Math.max(0, D.booksHi - dMix)];
    const rateOf = (dis) => dis / Math.max(1, dis + msDone + msRem);
    const rate = { lo: rateOf(dMs[0]), hi: rateOf(dMs[1]), mid: rateOf((dMs[0] + dMs[1]) / 2) }; S._bpRate = rate.mid; S._bpRateLo = rate.lo; S._bpRateHi = rate.hi;
    // ③ 미규명보유상품풀: 알라딘·김미소 밖의 매입 권수 − 그중 등록·판매된 것 (알라딘 풀과 연결된 등록분은 ①에서 셈)
    const isAl = (e) => /알라딘/.test(e.plat || '') || /\[(온라인)?중고/.test(e.txt || '');
    const genQ = X.use.filter((e) => ['book', 'mixed'].includes(catOf(e)) && !isAl(e)).reduce((a, e) => a + (splitPur(e).totalQ || 0), 0);
    const sp = st.genSpread ?? 0.1;
    // 헌옷도라이: _hd 등록·판매로 확정 (미등록 없음). 원래 매입 권수·폐기는 대량매입중폐기율로 추정
    const hdDone = X.G.hd.active + X.G.hd.sold;
    // 대량 매입(뭉치): 상품코드 끝자리(없으면 풀 이름)마다 따로 풀 — 미규명에 넣지 않음
    const bp = bulkPools(); const bpCodes = bp.map((x) => x.code).filter(Boolean);
    const hdUn = hdModel(rate).untracked; // 코드 없이 등록·판매된 헌옷도라이 (일반 상품 속에 섞임) → 미규명 계산에서 뺌
    const genDone = Math.max(0, X.G.gen.active + X.G.gen.sold - aLk - hdUn);
    let uLo = Math.max(0, genQ * (1 - sp) - genDone), uHi = Math.max(0, genQ * (1 + sp) - genDone), uWhy = `알라딘·김미소·헌옷도라이·대량 매입 밖의 매입 ${num(Math.round(genQ))}권(±${Math.round(sp * 100)}%) − 그중 등록·판매 ${num(genDone)} (코드 없이 등록된 헌옷도라이 ${num(Math.round(hdUn))}권 뺌)`;
    if (st.unkLo != null && st.unkHi != null && st.unkHi > 0) { uLo = +st.unkLo; uHi = +st.unkHi; uWhy = '직접 넣은 범위 (설정 ⑤)'; }
    // 합계: (① + ③) − 섞인 폐기 + ②
    const mixLo = Math.max(0, aUn + uLo - dMix), mixHi = Math.max(0, aUn + uHi - dMix);
    const bulkUnk = bulkEntries().filter((e) => !POOL_CODE_RE.test(String(e.bulk.code || '').trim())).reduce((a, e) => a + (+e.bulk.estQty || 0), 0); uLo += bulkUnk; uHi += bulkUnk; if (bulkUnk) uWhy += ` + 규칙 밖 끝자리 대량 매입 ${num(bulkUnk)}권`;
    const bpRem = bp.reduce((a, x) => [a[0] + x.remLo, a[1] + x.remHi], [0, 0]);
    const lo = Math.round(mixLo + msRem + bpRem[0]), hi = Math.round(mixHi + msRem + bpRem[1]);
    const hd = hdModel(rate);
    return { aTot, aLk, aUn, ms, msSurvey, msSince, msRem, msDone, dMix, dMs, rate, uLo, uHi, uWhy, lo, hi, use: Math.round((lo + hi) / 2), genQ, genDone, hd, bp, bpRem };
  });
}

}

  if (os0.length) { os0.forEach((v) => { v._sk = orderKey(v); S.orders.set(v.id, v); }); S.ordersLoaded = true; } bump();
  shell(); if (IDB.off) setSync(IDB.off);
  const hm = location.hash.match(/#c=([^&]+)/); if (hm) { history.replaceState(null, '', location.pathname); openCustomer(decodeURIComponent(hm[1])); }
  watchPending(); watchConfig(); watchAcct(); watchJobs(); watchRemote(); watchAppSettings(); watchRunStatusLite(); verifyDevice(); versionBanner();
  // 네트워크: 고객·주문은 나란히, 나머지는 그다음 (처음 한 번만 전체, 이후엔 바뀐 것만)
  const custP = syncCustomers().catch((e) => setSync(e.code === 'permission-denied' ? '권한 없음: 등록된 계정이 아닙니다' : '연결 실패: 기기에 저장된 내용 표시 중'));
  const ordP = (async () => { try { if (!S.ordersLoaded) setSync('주문 기록 받는 중 (처음 한 번)'); await syncOrders(true); setSync(); } catch (e) { S.ordersBusy = false; setSync('주문 기록 받기 실패: 나중에 다시 시도합니다'); } })();
  await Promise.all([custP, ordP]); renderMain();
  setTimeout(() => loadPur().catch(() => {}), 1500); loadReturns();
  setTimeout(async () => { const at = +localStorage.getItem('rn-match-at') || 0; if (Date.now() - at < 6 * 3600e3) return; loadProducts(); for (let i = 0; i < 60 && !(S.prodLoaded && S.pur.fresh); i++) await new Promise((r) => setTimeout(r, 5000)); if (S.prodLoaded && S.pur.fresh) matchNow(true).catch(() => {}); }, 20000);
  loadMatches(); watchRequest();
  try { await syncSellers(); if (S.tab === 'sellers' || S.tab === 'home') renderMain(); } catch (e) {}
  try { await syncReviews(); reviewStats(); if (S.tab === 'search' || S.tab === 'home') renderMain(); } catch (e) {}
  setSync();
});
