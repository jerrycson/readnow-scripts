<title>리드나우 고객</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--paper:#FFFFFF;--bg:#F3F5F4;--ink:#1E2B28;--sub:#5B6B66;--line:#DCE3E0;--cloth:#2F5D50;--cloth2:#264D42;--soft:#E6EFEB;--amber:#A8661B;--amberSoft:#FFF4E5;--red:#B0322A;--redSoft:#FDECEA;--gold:#8A6D1D;--goldSoft:#FBF3DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:calc(64px + env(safe-area-inset-bottom,0))}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--cloth);color:#fff;padding:10px 16px 12px;padding-top:calc(10px + env(safe-area-inset-top,0))}
.top .row{display:flex;align-items:center;justify-content:space-between}

.stat{font:inherit;color:inherit;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center}

.order{border-top:1px solid var(--line);padding:10px 0}

.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px;font-weight:700;color:var(--sub)}

.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--cloth)}
.lk input{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px}
.sortbar{display:flex;gap:6px;margin:0 0 8px}.sortbar select{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:#fff}

.rankbtn{display:inline-block}

.tag.cau{background:var(--amberSoft);color:var(--amber)}

.linkbtn{display:block;border:0;background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:4px 2px}
.scwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scb{border-radius:10px;padding:10px;text-align:center}.scb b{display:block;font-size:26px}.scb span{font-size:12px}
.scb.good{background:var(--soft);color:var(--cloth)}.scb.bad{background:var(--amberSoft);color:var(--amber)}
details summary{cursor:pointer;color:var(--cloth);font-weight:600;font-size:13px;margin-top:8px}
.sth{font-size:12.5px;margin:10px 0 4px;color:var(--sub)}.sp{margin-bottom:6px}.spl{display:flex;justify-content:space-between;font-size:12.5px}.spb{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.spb i{display:block;height:100%}.spb.good i{background:var(--cloth)}.spb.bad i{background:var(--amber)}.spt{font-size:11.5px;color:var(--sub)}
.src{font-size:11px;border-radius:4px;padding:0 4px}.src.auto{background:var(--soft);color:var(--cloth)}.src.manual{background:var(--goldSoft);color:var(--gold)}.src.sheet{background:var(--redSoft);color:var(--red)}
.seg{flex-wrap:wrap}.seg button.on.cau{background:var(--amberSoft);color:var(--amber)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mgrid div{background:var(--bg);border-radius:10px;padding:9px}.mgrid b{display:block;font-size:18px}.mgrid span{display:block;font-size:12.5px;font-weight:600}.mgrid small{display:block;font-size:11px;color:var(--sub)}
.rn2{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--cloth);text-align:center;font-size:12px;line-height:22px;font-weight:700}
/* 순위 패널 */
#rank{display:none}
body.withrank.rankopen #rank{display:block;position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:9;background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0)) 12px 90px;box-shadow:-8px 0 24px rgba(0,0,0,.12)}

}

// 알라딘 주문(수집기) ↔ 시트 알라딘 거래 맞추기: 날짜 ±2일, 금액 같음
function matchAladinOrders() {
  const sheet = S.pur.entries.filter((e) => /알라딘/.test(e.plat || '') || /\[중고|온라인중고/.test(e.txt || ''));
  const used = new Set();
  S.pur.aOrders.forEach((o) => { const d = new Date(o.date); const hit = sheet.find((e) => !used.has(e.id) && Math.round(e.amt) === Math.round(o.amount) && e.date && Math.abs(new Date(e.date) - d) <= 2 * 864e5); if (hit) { used.add(hit.id); o.matched = hit.id; } else o.matched = null; });
}

/* 사진 크게 보기: 상품 상세의 사진을 누르면 화면 가득 */
document.addEventListener('click', (ev) => {
  const im = ev.target.closest('#sheet .pimgs img, #sheet img[data-zoom]'); if (!im) return;
  const full = im.dataset.full || im.src; const ov = document.createElement('div'); ov.className = 'zoomov';
  ov.innerHTML = `<img src="${esc(full)}" alt=""><button aria-label="닫기">×</button>`; document.body.appendChild(ov);
  const close = () => ov.remove(); ov.onclick = close; document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
});

/* ══════════ 미등록 책 권수: 범위로 추정하고, 확정 값이 생길 때마다 범위가 좁아짐 ══════════

}

/* ══════════ 구매 연령대 (알라딘 새상품 페이지의 구매자 분포) ══════════

    rows.forEach((r, i) => { r._k = coreKey(r.title); r._t = fullText(r.title); r._key = `${r.e.id}#${r.idx}`; if (r._k.length >= 2) (byKey.get(r._k) || byKey.set(r._k, []).get(r._k)).push(r);
      const seen = new Set(); for (let j = 0; j + 4 <= r._t.length; j++) { const g = r._t.slice(j, j + 4); if (seen.has(g)) continue; seen.add(g); (byGram.get(g) || byGram.set(g, []).get(g)).push(r); }
      if (r._k.length >= 4) { const g = r._k.slice(0, 4); (byKeyGram.get(g) || byKeyGram.set(g, []).get(g)).push(r); } });

// 상품 하나에 맞는 매입 품목 후보 (정확 → 매입 글에 상품 제목 포함 → 상품 제목에 매입 열쇠 포함)
function candidatesFor(title) {
  const I = itemIndex(); const k = coreKey(title); const T = fullText(title); const out = new Map();
  (I.byKey.get(k) || []).forEach((r) => out.set(r._key, { r, how: '제목 같음' }));
  if (k.length >= 4) (I.byGram.get(k.slice(0, 4)) || []).forEach((r) => { if (!out.has(r._key) && r._t.includes(k)) out.set(r._key, { r, how: '매입 내용에 상품 제목이 들어 있음' }); });
  for (let j = 0; j + 4 <= T.length; j++) (I.byKeyGram.get(T.slice(j, j + 4)) || []).forEach((r) => { if (!out.has(r._key) && r._k.length >= 4 && T.includes(r._k)) out.set(r._key, { r, how: '상품 제목에 매입 품목 제목이 들어 있음' }); });

      e.who = $('#pf_who').value.trim(); e.shipFee = $('#pf_ship').value; e.discount = $('#pf_disc').value; e.qtyManual = $('#pf_qm').value === '' ? null : +$('#pf_qm').value;
      if ($('#pf_lump')) e.lumpTotal = $('#pf_lump').value; e.account = $('#pf_acc').value.trim(); e.shipInfo = $('#pf_shipinfo').value.trim(); e.note = $('#pf_note').value.trim();
      sh.querySelectorAll('.pit_t').forEach((x) => (e.items[+x.dataset.i].title = x.value.trim())); sh.querySelectorAll('.pit_q').forEach((x) => (e.items[+x.dataset.i].qty = +x.value || 0)); sh.querySelectorAll('.pit_p').forEach((x) => (e.items[+x.dataset.i].price = x.value === '' ? '' : +x.value));
    };
    const redraw = () => { read(); draw(); };
    $('#back').onclick = () => history.back();
    sh.querySelectorAll('[data-st]').forEach((b) => (b.onclick = () => { read(); const was = e.status; e.status = b.dataset.st; if (['received', 'checked'].includes(e.status) && !e.receivedAt) e.receivedAt = new Date().toISOString(); if (was !== e.status) e._stNote = `상태: ${stInfo(e.status)[1]}`; draw(); }));
    sh.querySelectorAll('[data-lump]').forEach((b) => (b.onclick = () => { read(); e.lump = b.dataset.lump === '1'; draw(); }));
    sh.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => { read(); e.items.splice(+b.dataset.del, 1); draw(); }));
    $('#pf_add').onclick = () => { read(); e.items.push({ title: '', qty: 1, price: '' }); draw(); const ts = sh.querySelectorAll('.pit_t'); ts[ts.length - 1].focus(); };
    $('#pf_paste').onclick = () => { const b = $('#pf_pastebox'); b.style.display = b.style.display === 'none' ? '' : 'none'; };
    $('#pf_pastego').onclick = () => { read(); const lines = $('#pf_pastetxt').value.split(/\n/).map((x) => x.trim()).filter(Boolean);
      const add = lines.map((ln) => { let q = 1; const qm = ln.match(/(\d+)\s*권/); if (qm) { q = +qm[1]; ln = ln.replace(qm[0], ' '); } const pm = ln.match(/([\d,]{3,})\s*원?\s*$/); const price = pm ? +pm[1].replace(/,/g, '') : ''; if (pm) ln = ln.slice(0, pm.index); return { title: ln.replace(/\s+/g, ' ').trim(), qty: q, price }; });
      e.items = e.items.filter((it) => it.title || it.price).concat(add); if (!e.items.length) e.items = [{ title: '', qty: 1, price: '' }]; draw(); };
    sh.querySelectorAll('.pit_q, .pit_p, #pf_lump, #pf_ship, #pf_disc, #pf_qm').forEach((x) => (x.onchange = redraw));
    $('#pf_plat').onchange = redraw;
    $('#pf_save').onclick = async () => { read(); if (!e.items.some((it) => it.title) && !e.note) return toast('내용(품목)을 하나 이상 적어 주세요'); const t = purTotals(e); if (!t.total && !confirm('매입총액이 0원입니다. 그대로 저장할까요?')) return;
      const note = id ? e._stNote || '수정' : '새 기록'; delete e._stNote; const nid = await savePur({ ...e, id: id || null }, note); if (nid) history.back(); };
    const del = $('#pf_delete'); if (del) del.onclick = async () => { if (!confirm('이 매입 기록을 지울까요? (기록은 남고 통계에서만 빠집니다)')) return; await savePur({ ...e, id, deleted: true }, '지움'); history.back(); };
  };
  draw();
}

/* ── 로그인 ── */
function loginView(err) {
  $('#app').innerHTML = `<div class="login"><h1>리드나우</h1><p>등록된 구글 계정으로 로그인하세요</p>
    <button class="btn" id="g">구글 계정으로 로그인</button>${err ? `<p style="color:var(--red);margin-top:12px">${esc(err)}</p>` : ''}
    <details><summary>Firebase 전용 계정으로 로그인</summary><input id="em" type="email" placeholder="이메일" autocomplete="username"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btn ghost" id="e" style="margin-top:8px;width:100%">로그인</button></details></div>`;
  $('#g').onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => loginView(e.code === 'auth/popup-blocked' ? '팝업이 막혔습니다. 브라우저에서 팝업을 허용해 주세요.' : e.message));
  $('#e').onclick = () => firebase.auth().signInWithEmailAndPassword($('#em').value.trim(), $('#pw').value).catch((e) => loginView('로그인 실패: ' + e.code));
}
firebase.auth().onAuthStateChanged(async (u) => {
  if (!u) { S.user = null; loginView(); return; }
  S.user = u;
  await idbOpen();
  const [cs, os0] = await Promise.all([idbAll('customers'), idbAll('orders')]);
  cs.forEach((v) => { v._sk = searchKey(v); S.customers.set(v.customerId, v); });
  if (os0.length) { os0.forEach((v) => { v._sk = orderKey(v); S.orders.set(v.id, v); }); S.ordersLoaded = true; } bump();
  shell(); if (IDB.off) setSync(IDB.off);
  const hm = location.hash.match(/#c=([^&]+)/); if (hm) { history.replaceState(null, '', location.pathname); openCustomer(decodeURIComponent(hm[1])); }
  watchPending(); watchConfig(); watchAcct(); watchJobs(); watchRemote(); watchAppSettings(); watchRunStatusLite(); verifyDevice(); versionBanner();
  // 네트워크: 고객·주문은 나란히, 나머지는 그다음 (처음 한 번만 전체, 이후엔 바뀐 것만)
  const custP = syncCustomers().catch((e) => setSync(e.code === 'permission-denied' ? '권한 없음: 등록된 계정이 아닙니다' : '연결 실패: 기기에 저장된 내용 표시 중'));
  const ordP = (async () => { try { if (!S.ordersLoaded) setSync('주문 기록 받는 중 (처음 한 번)'); await syncOrders(true); setSync(); } catch (e) { S.ordersBusy = false; setSync('주문 기록 받기 실패: 나중에 다시 시도합니다'); } })();
  await Promise.all([custP, ordP]); renderMain();
  setTimeout(() => loadPur().catch(() => {}), 1500); loadReturns();
  setTimeout(async () => { const at = +localStorage.getItem('rn-match-at') || 0; if (Date.now() - at < 6 * 3600e3) return; loadProducts(); for (let i = 0; i < 60 && !(S.prodLoaded && S.pur.fresh); i++) await new Promise((r) => setTimeout(r, 5000)); if (S.prodLoaded && S.pur.fresh) matchNow(true).catch(() => {}); }, 20000);
  loadMatches(); watchRequest();
  try { await syncSellers(); if (S.tab === 'sellers' || S.tab === 'home') renderMain(); } catch (e) {}
  try { await syncReviews(); reviewStats(); if (S.tab === 'search' || S.tab === 'home') renderMain(); } catch (e) {}
  setSync();
});
</script>
