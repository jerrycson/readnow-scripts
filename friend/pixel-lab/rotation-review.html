<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기본형 64방향 검토</title><link rel="stylesheet" href="style.css"><style>img{display:block;width:1088px;max-width:100%;height:auto;image-rendering:pixelated}.tools{display:flex;gap:18px;flex-wrap:wrap}figure{margin:24px 0}.status{padding:14px;background:#eee7d3}</style></head><body><header><div><p class="eyebrow">책방 친구 인체 연구</p><h1>기본형 64방향 검토</h1><p>열은 좌우 회전, 행은 위아래 회전입니다. 각 칸에 좌우 / 위아래 각도를 적었습니다.</p></div><nav><a href="continuous-review.html">실제로 돌려 비교</a> · <a href="anatomy-review.html">이전 시안과 비교</a> · <a href="reference-study.html">참고 그림과 대조</a></nav></header><main><p class="status">8차와 새 연속 표면 기본형을 선택해 비교합니다. 새 2~4등신은 독자 조형, 5~8등신은 CC0 성인 인체 변형입니다. 모든 방향의 그림이 생성돼도 인체의 자연스러움이 완성됐다는 뜻은 아닙니다. 몸매와 콘텐츠 확장은 보류 중입니다.</p><div class="tools"><label>연구 시안<select id="version"><option value="22" selected>22차 귀·눈·입 구분</option><option value="21">21차 흉곽·가슴 연결</option><option value="20">20차 발 정렬</option><option value="18">18차 성인 얼굴 면 정리</option><option value="17">17차 작은 얼굴·귀</option><option value="16">16차 근육 연결 교정</option><option value="14">14차 성인 눈꺼풀</option><option value="13">13차 작은 등신 얼굴</option><option value="12">12차 팔·손 교정</option><option value="11">11차 얼굴·팔 교정</option><option value="10">10차 연속 표면</option><option value="8">8차 보존본</option></select></label><label>기본형<select id="sex"><option value="female">여성</option><option value="male">남성</option></select></label><label>등신<select id="heads"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option></select></label><a id="download" download>원본 회전표 저장</a></div><figure><img id="atlas" alt="기본형의 64개 회전 방향"><figcaption id="caption"></figcaption></figure></main><script type="module" src="rotation-review.mjs"></script></body></html>
