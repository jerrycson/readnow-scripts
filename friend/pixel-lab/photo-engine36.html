<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 기반 모델링 · 얼굴 작업대</title><link rel="stylesheet" href="contour36.css"><style>body{background:#f3f4ef}main{padding-top:8px}nav,fieldset{margin:8px 0}fieldset{border:0;padding:0}legend{font-weight:700}#slots,#parts,#brushes,#regions,.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.panels{margin:8px 0}#source,#result{aspect-ratio:1;touch-action:none}#source{cursor:crosshair}#result{cursor:grab}#pad{touch-action:none;width:140px;height:96px;background:linear-gradient(transparent 49%,#8caaa0 50%,transparent 51%),linear-gradient(90deg,transparent 49%,#8caaa0 50%,transparent 51%),#e5efe9;border:1px solid #789988;position:relative;display:grid;place-items:center;border-radius:6px}#dot{width:11px;height:11px;border-radius:100%;background:#225e4b;position:absolute;transform:translate(-50%,-50%)}#info{font-size:14px}.bar label{display:inline-flex;gap:6px;align-items:center}#saved{max-width:100%}.editor{display:flex;gap:16px;align-items:center}small{display:block;color:#476155}.msg{min-height:1.6em;color:#365d50}canvas{margin-top:8px}#parts button:disabled{cursor:default}</style></head><body><main><fieldset><legend>모델링 부위</legend><div id="parts"></div></fieldset><fieldset><legend>참고 방향</legend><div id="slots"></div></fieldset><div class="bar"><label>이 방향에 사진 열기 <input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp"></label><label><input id="autoYaw" type="checkbox" checked> 뚜렷한 방향 자동 적용</label><button id="demo">실제 두상 다섯 방향 불러오기</button></div><div class="panels"><article><h2>사진과 추출한 외곽</h2><canvas id="source" width="256" height="256" aria-label="사진과 마스크 경계 편집"></canvas><div id="brushes"></div><label>붓 크기 <input id="brushSize" type="range" min="1" max="15" value="4"></label><label>배경 색 허용폭 <input id="tol" type="range" min="8" max="120" value="44"></label><p id="direction"></p><div class="bar"><button id="acceptYaw">추정 방향 적용</button><label>촬영 각도 <input id="sourceYaw" type="number" min="-180" max="180" step="1" value="0" style="width:5em"> °</label></div><small>정렬 도구로 중심을 끌고 휠로 크기를 맞춥니다. 머리카락과 옷은 마스크에서 직접 뺄 수 있습니다.</small><a href="profile37.html" target="_blank" rel="noopener">기준점을 정확히 찍어도 사선이 어긋나는 사례</a></article><article><h2>사진을 따라 만든 표면</h2><canvas id="result" width="224" height="224" tabindex="0" aria-label="부분 모델. 드래그 또는 방향키로 회전"></canvas><div class="bar"><button id="snap">이 사진 구도로 맞추기</button><label><input id="texture" type="checkbox" checked> 표면에 사진 투영</label></div><p id="angles"></p><div id="regions"></div><div class="editor"><div id="pad" tabindex="0" role="group" aria-label="부위 폭·깊이 조절. 방향키로 조절"><i id="dot"></i></div><div><span id="value"></span><small>가로는 폭, 세로는 깊이</small><button id="resetEdit">이 부위 복원</button></div></div></article></div><p id="info" aria-live="polite"></p><div class="bar"><button id="apply">관찰창 얼굴에 적용</button><button id="save">이 기기에 새 판 저장</button><button id="exportMesh">현재 메시 OBJ 받기</button><label>보존판 <select id="saved" aria-label="저장한 판"></select></label><button id="load">선택한 판 열기</button></div><p class="msg" id="msg" role="status"></p><small>참고 사진·편집판은 이 브라우저에 저장합니다. 운영 연구 일지는 프로젝트 연구 페이지에서 읽을 수 있습니다.</small></main><script type="module" src="photo-engine36.mjs"></script></body></html>
