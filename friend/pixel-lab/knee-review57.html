<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>57차 무릎 중립 전환 검토</title><style>body{font:16px system-ui;margin:16px;background:#ece9e3;color:#202025}button,input,select{font:inherit;padding:8px}fieldset{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}main{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{width:100%;image-rendering:pixelated;touch-action:none;background:#eee}figure{margin:0}p{max-width:80ch}@media(max-width:500px){body{margin:8px}main{gap:4px}}</style><h1>57차 무릎 중립 전환 검토</h1><p>55차 수동 범위 네 기본형만 비교합니다. 오른쪽은 연구 시안이며 기본형 채택이 아닙니다. 정지→첫 굽힘→중립 복귀의 연결을 검토하며 실제 보행을 재현한 화면은 아닙니다.</p><fieldset id="subjects"><legend>기본형</legend></fieldset><fieldset id="forms"><legend>체성분</legend></fieldset><fieldset id="sizes"><legend>실제 화소</legend></fieldset><fieldset><legend>같은 카메라와 자세</legend><label>굽힘 <input id="depth" type="range" min="0" max=".4" step=".000001" value="0"></label><button id="first">첫 굽힘</button><button id="reset">중립</button><button id="undo">되돌리기</button><label>회전 <input id="yaw" type="range" min="-180" max="180" value="45"></label><label><input id="new" type="checkbox" checked>57 시안 표시</label></fieldset><p id="status" aria-live="polite"></p><main><figure><figcaption>55차 기존 수동 이음</figcaption><canvas id="old"></canvas></figure><figure><figcaption>57차 고정 연결 / 끄면55</figcaption><canvas id="next"></canvas></figure></main><script type="module" src="knee-review57.mjs"></script></html>
