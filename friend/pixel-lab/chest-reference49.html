<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>손 위치와 몸통 표식 · 49차</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f1;color:#24372e;font:16px/1.55 "Malgun Gothic",sans-serif;word-break:keep-all}main{max-width:990px;padding:clamp(12px,3vw,34px);margin:auto}h1{font-size:clamp(1.35rem,3.2vw,2rem);margin:.25em 0}a{color:#125b50}fieldset,figure{margin:.7rem 0}fieldset{border:1px solid #c1c9bb;border-radius:6px;padding:.5rem .75rem}legend{font-weight:700}fieldset label{display:inline-flex;gap:.28rem;align-items:center;margin:.12rem .7rem .16rem 0}input,select,button{font:inherit}figure{background:#fff;border:1px solid #bec9bc;padding:.5rem;border-radius:5px}svg{display:block;width:100%;height:min(52vh,460px);min-height:200px}figcaption,small{font-size:.89rem}#readout{min-height:3.2em}footer{font-size:.9rem;border-top:1px solid #b8c3b6;padding-top:.6rem}@media(max-width:600px){svg{height:45vh}.bar{display:block}}
</style></head><body><main><h1>손 위치에 따른 몸통 표식</h1>
<fieldset id="pose"><legend>촬영 자세</legend><label><input type="radio" name="pose" value="waist" checked>서서 양손을 허리에</label><label><input type="radio" name="pose" value="behindHead">서서 양손을 머리 뒤에</label></fieldset>
<fieldset><legend>도판과 비교선</legend><label><input type="radio" name="view" value="photo" checked>원본 사진</label><label><input type="radio" name="view" value="surface">원본 표면지도</label><label><input id="markers" type="checkbox" checked>표식</label><label><input id="observed" type="checkbox" checked>판독된 음영</label><label><input id="model" type="checkbox">모형 가시선</label><label>모형 수평 회전 <select id="yaw"><option>-8</option><option selected>0</option><option>8</option></select>°</label></fieldset>
<fieldset id="register"><legend>두 사진의 정합</legend><label>기준 표식 <select id="registerMode"><option value="none">겹치지 않음</option><option value="upperLower">① 상단 중앙과 ③ 하단 중앙</option><option value="middleLower">② 중간 중앙과 ③ 하단 중앙</option><option value="lowerPair">④·⑤ 좌우 하단</option></select></label><label><input id="ghost" type="checkbox">반대 자세 사진 30%</label></fieldset>
<figure><svg id="plate" role="img" aria-label="원도판 위 흉부 표식과 보이는 하부 음영"></svg><figcaption id="caption"></figcaption></figure>
<p id="readout" role="status" aria-live="polite">원도판을 읽고 있습니다.</p>
<p>①~⑤는 사진 속 흰 표식, 십자는 모형 정합에 쓴 좌우 돌출점입니다. 모형선은 그 두 점을 맞춘 뒤 투영한 가시선입니다. 사진의 주름이나 내부 조직과 일대일로 대응하는 선은 확인되지 않았습니다.</p>
<footer>Olivia L. H. Tong 등(2020), 그림 5의 b·c·e·f를 잘라 표식과 선을 덧그렸습니다. <a href="https://doi.org/10.1038/s41598-020-70476-2" target="_blank" rel="noopener">원논문과 전체 도판</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0 이용허락</a> · <a href="chest-eval49.json">측정값</a> · <a href="chest-poses49.png">자세별 실렌더</a></footer>
</main><script type="module" src="chest-reference49.mjs"></script></body></html>
