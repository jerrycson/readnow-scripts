<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모든 판본 비교 · 책방 친구</title><link rel="stylesheet" href="studio-versions.css"></head><body>
<header><h1>판본 비교</h1><div><button id="swap">좌우 바꾸기</button><button id="recent">최신 두 회차</button><button id="overlay">화소 겹쳐보기</button><span id="source" role="status"></span></div></header><details id="frozenCamera"><summary>동결 전신 모델의 구도와 설정 함께 바꾸기</summary><div id="angles"></div><div id="bodyParams"></div></details><main id="pair"></main>
<dialog id="mix"><header><h2>같은 크기로 겹쳐보기</h2><button id="endMix" autofocus>닫기</button></header><div id="layers"></div><label>오른쪽 그림 농도 <input id="alpha" type="range" min="0" max="100" value="50"><output id="opacity">50%</output></label><p id="mixNote"></p></dialog><template id="side"><section><header><h2></h2><button class="pick" aria-expanded="false">판본 고르기</button></header><div class="picker" hidden><label>회차·이름 찾기 <input type="search" placeholder="예: 34 또는 옆얼굴"></label><div class="editions"></div></div><p class="caption"></p><div class="variants" aria-label="보존 결과 선택"></div><div class="preview"></div><p class="limit"></p></section></template>
<script type="module" src="studio-versions.mjs"></script></body></html>
