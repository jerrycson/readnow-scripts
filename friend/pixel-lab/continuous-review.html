<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>형태 관찰창 · 33차</title><link rel="stylesheet" href="form33.css"></head><body>
<header><div><a href="../research/hub/">책방 친구 연구실</a><h1>형태 관찰창</h1></div><nav><a href="study34.html">33·34차 맞대기</a> · <a href="study33.html">33차 근거와 비교</a> · <a href="blind32.html">32차 가·나</a></nav></header>
<main class="studio"><section class="stage"><div class="stagehead"><span id="status" role="status">형태 불러오는 중</span><button id="fit">화면 맞춤</button></div>
<div class="pair"><figure><figcaption id="beforeTitle">32차 기준</figcaption><div class="viewport" id="leftViewport" tabindex="0" aria-label="이전 판, 드래그 회전과 휠 확대"><canvas id="before"></canvas></div></figure><figure><figcaption>33차 수정판</figcaption><div class="viewport" id="rightViewport" tabindex="0" aria-label="수정판, 드래그 회전과 관절 조작"><canvas id="after"></canvas><svg id="markers" viewBox="0 0 1000 1000" aria-hidden="true"></svg></div></figure></div>
<div class="quick" aria-label="표시 전환"><label><input id="handles" type="checkbox" checked>관절점</label><label><input id="strain" type="checkbox">늘어남·눌림</label><label><input id="guides" type="checkbox">골격선</label><label><input id="castShadows" type="checkbox">가림 그림자</label><label><input id="silhouette" type="checkbox">실루엣</label><label><input id="isolateDetail" type="checkbox">손발 단독</label></div><div class="quick" id="angles" aria-label="시점"></div>
<p id="strainStatus" hidden></p><p class="hint">빈 곳을 끌어 회전 · 휠로 포인터 위치 확대 · 관절점을 좌우로 끌어 각도 변경</p></section>
<aside><nav class="tabs" id="tools"><button data-panel="base" aria-pressed="true">보기</button><button data-panel="pose">자세</button><button data-panel="shape">비율</button><button data-panel="chest">가슴</button></nav>
<section id="base" class="panel"><div id="baseControls"></div><button id="download">비교 그림 저장</button></section>
<section id="pose" class="panel" hidden><div id="poseControls"></div><label>관절 각도 <output id="readout"></output><input id="angle" type="range" step=".5"></label><button id="neutral">중립으로</button></section>
<section id="shape" class="panel" hidden><div id="bodyPresets"></div><div id="bodySliders"></div><button id="saveShape">이 기기에 저장</button><button id="loadShape">저장 형태 복원</button><output id="saveStatus"></output></section>
<section id="chest" class="panel" hidden><p id="scope"></p><div id="chestControls"><div id="chestPresets"></div><div id="chestSliders"></div><label class="dynamic"><input id="dynamics" type="checkbox" checked>관절을 움직일 때 연부조직 반응</label><button id="pulse">움직임 후 가라앉기</button><button id="pulseLeft">왼쪽만 시험</button><button id="pauseMotion" aria-pressed="false">일시정지</button><button id="stopMotion">중립으로 감쇠 초기화</button></div></section>
</aside></main><script type="module" src="continuous-review.mjs"></script></body></html>
