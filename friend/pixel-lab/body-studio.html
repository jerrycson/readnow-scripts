<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몸과 얼굴 디자인 · 책방 친구</title><link rel="stylesheet" href="style.css"><style>.studio-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px}.studio-controls{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:18px;align-self:start}.studio-controls label{margin-bottom:12px}.studio-controls select,.studio-controls input{width:100%}.studio-view{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center;background:#e8e8de;border-radius:12px;padding:16px}.studio-view figure{margin:0;text-align:center}.studio-view canvas{width:256px;height:256px;max-width:100%}.studio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(154px,1fr));gap:12px;margin-top:18px}.design-card{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:12px}.design-card canvas{width:128px;height:128px;max-width:100%}.design-card span{font-size:13px}.studio-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.studio-tabs button[aria-pressed=true]{background:var(--accent);color:white}input[type=range]{padding:0}output{font-size:12px;color:var(--muted);margin-left:6px}.small{max-width:80ch}@media(max-width:850px){.studio-layout{grid-template-columns:1fr}.studio-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.studio-controls details,.studio-controls button{grid-column:1/-1}.studio-view canvas{width:224px;height:224px}}@media(max-width:420px){.studio-controls{grid-template-columns:1fr}}</style></head><body>
<header><div><p class="eyebrow">책방 친구 · 기본형 재설계 6차</p><h1>몸과 얼굴의 개성을 만듭니다</h1><p class="intro">2~4등신은 둥근 귀여움, 5~8등신은 체형의 차이. 망가풍 6~8등신을 별도로 비교합니다.</p></div><div class="header-links"><a href="./">기본형 연구실</a><a href="../research/pixel/anatomy.html">연구 기록</a></div><a href="anatomy-review.html">인체 집중 비교</a> · <a href="reference-study.html">참고 그림 대조</a></header>
<main><div class="studio-layout"><aside class="studio-controls" id="controls"><label>기본형<select id="sex"><option value="female">여성</option><option value="male">남성</option></select></label><label>등신<select id="heads"></select></label><label>그림체<select id="designStyle"><option value="natural">현실형 · 작은 등신은 귀여운형</option><option value="manga">망가풍</option></select></label><label>체형 출발점<select id="body-preset"></select></label><label>방향<select id="yaw"></select></label><label>몸 전체 원본 크기<select id="resolution"><option>48</option><option>64</option><option>96</option><option selected>128</option></select></label><details><summary>체형과 나이를 따로 조절</summary><div id="body-axes"></div></details><details><summary>얼굴 부품 조합</summary><div id="face-options"></div></details><button class="primary" id="save-character">이 모습으로 연구 친구 만들기</button><p id="save-status" role="status"></p></aside>
<section><div class="studio-view"><figure><canvas id="body-preview" aria-label="선택한 체형의 전신"></canvas><figcaption id="body-caption"></figcaption></figure><figure><canvas id="face-preview" aria-label="선택한 얼굴 부품을 확대한 초상"></canvas><figcaption>얼굴 확대 · 128px 별도 투영</figcaption></figure></div><p class="small">체형 수치는 실제 체지방률이나 나이가 아닌 디자인 조절값입니다. 각 체형은 남녀 모두에 적용할 수 있습니다. 2~4등신은 성인형의 가슴·근육 강조를 사용하지 않습니다. 망가풍은 특정 작품을 복제하지 않은 새 시안이며, 완성판이나 세계 선호도 1위라는 뜻은 아닙니다.</p>
<nav class="studio-tabs" id="catalog-tabs" aria-label="디자인 비교"></nav><p id="catalog-status" role="status"></p><div class="studio-grid" id="catalog-grid"></div></section></div></main><script type="module" src="body-studio.mjs"></script></body></html>
