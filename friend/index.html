<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐾 책방 친구</title>
<!-- 🐾 책방 친구 혼자 도는 화면 — 윈도우·안드로이드 '책방 친구 프로그램'이 이 화면을 엶(?host=tauri|android) · 크롬 탭으로 열면 캐릭터 설정 화면(?settings=1) · PC 프로그램 ⚙ 설정 창(?settings=1&win=set · 0.2.0)
     캐릭터 본체 = readnow-friend.js(단 하나뿐인 원본 · 웹앱 안에서 켤 때도 같은 파일) · 바탕 = readnow-friend-boot.js -->
<style>
:root{--paper:#FFFFFF;--bg:#F3F5F4;--ink:#1E2B28;--sub:#5B6B66;--line:#DCE3E0;--cloth:#2F5D50;--soft:#E6EFEB;--red:#B0322A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{color:var(--ink);font:15px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button{font:inherit;cursor:pointer}input,textarea,select{font:inherit}
.hint{color:var(--sub);font-size:12.5px}
.btn{border:1px solid var(--cloth);background:var(--cloth);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}.btn.sm{padding:4px 9px;font-size:13px}.btn.ghost{background:#fff;color:var(--cloth)}.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ldg{display:inline-block;margin-right:4px;animation:rnfSpin 1s linear infinite}@keyframes rnfSpin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}.toast.on{opacity:.95}
html.rn-fhide body>*{visibility:hidden!important}
.fr-card{position:fixed;right:16px;bottom:16px;z-index:60;width:min(340px,calc(100vw - 32px));background:#fff;border:2px solid #2F5D50;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:14px;line-height:1.5}
.fr-card h4{margin:0 0 6px;font-size:15px}.fr-card p{margin:4px 0}.fr-card small{color:var(--sub)}.fr-card .row{display:flex;gap:6px;margin-top:8px}
.fr-card input{flex:1;min-width:0;font:600 18px/1.2 monospace;letter-spacing:2px;text-transform:uppercase;padding:6px 8px;border:1px solid #C9D3D0;border-radius:8px}
.fr-card button{border:0;border-radius:8px;background:#2F5D50;color:#fff;padding:6px 12px;font-weight:700}.fr-card button.ghost{background:#EEF3F1;color:#2F5D50}.fr-card .x{position:absolute;right:8px;top:6px;background:none;color:var(--sub);padding:2px 6px}.fr-card.err{border-color:var(--red)}.fr-card .bad{color:var(--red);font-weight:700}
/* (10/29 급한 일) 연결 카드: 머리줄 끌기 · ▾ 접기(알약) · 휴대폰 폭 40% */
.fr-card .fr-hd{display:flex;align-items:center;gap:6px;margin:-12px -14px 6px;padding:5px 6px 5px 12px;background:#EEF3F1;border-bottom:1px solid #DCE3E0;border-radius:12px 12px 0 0;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none;font-size:13px;color:#2F5D50}
.fr-card .fr-hd .grip{opacity:.6}.fr-card .fr-hd .sp{flex:1}
.fr-card .fr-hd .hb{background:none;color:#2F5D50;padding:3px 9px;border-radius:6px;font-size:13px;line-height:1.2;font-weight:700;border:1px solid #C9D6D1}.fr-card .fr-hd .hb:hover{background:#DCE8E3}
.fr-card .fr-pill{display:none}
.fr-card.fold{width:auto;padding:0;border:0;background:none;box-shadow:none;max-height:none;overflow:visible}
.fr-card.fold .fr-hd,.fr-card.fold .fr-bd{display:none}
.fr-card.fold .fr-pill{display:inline-flex;align-items:center;gap:4px;border:2px solid #2F5D50;background:#fff;color:#2F5D50;border-radius:20px;padding:7px 14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer;touch-action:none;white-space:nowrap}
.fr-card.err.fold .fr-pill{border-color:#B0322A;color:#B0322A}
.fr-card .fr-how{margin:4px 0}.fr-card .fr-how summary{cursor:pointer;color:#5B6B66;font-size:12.5px}
@media (max-width:480px){.fr-card{right:10px;bottom:10px;width:calc(100vw - 20px);max-height:40vh;overflow:auto;padding:10px 12px;font-size:13px;line-height:1.4}.fr-card .fr-hd{margin:-10px -12px 6px;position:sticky;top:-10px;z-index:1}.fr-card h4{font-size:14px}.fr-card input{font-size:16px}.fr-card .row{margin-top:6px}}
/* (P5 · 프로그램 0.2.0) 캐릭터 자리 옮기기(Ctrl+끌기 → 무리 전체를 margin으로) · 캐릭터 옆 ⚙ · 설정 창 */
html.rn-friend #msc_wrap,html.rn-friend #msc_ico,html.rn-friend #msc_gear,html.rn-friend #msc_msgbtn,html.rn-friend #msc_mlist{margin-right:var(--fr-mx,var(--msc-mx,0px))!important;margin-bottom:var(--fr-my,var(--msc-my,0px))!important}
.fr-hgear{position:fixed;z-index:31;display:none;width:30px;height:30px;border-radius:15px;border:1px solid rgba(47,93,80,.35);background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:16px;line-height:1;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#2F5D50}.fr-hgear:hover{background:#fff;border-color:#2F5D50}
html.fr-ctrl #msc_ch,html.fr-ctrl #msc_ch *,html.fr-moving,html.fr-moving *{cursor:move!important}
html.fr-setwin,html.fr-setwin body{background:#F3F5F4}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="readnow-friend-boot.js?v=0.15.12"></script>
<script src="readnow-friend.js?v=0.15.12"></script>
<script>RNF_START();</script>
</body>
</html>
