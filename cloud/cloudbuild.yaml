# 리드나우 클라우드 자동 배포 — Google Cloud Build 트리거 판 (priv2 11/13)
#  · GitHub Actions '클라우드 자동 배포'(.github/workflows/deploy-cloud.yml)의 배포 작업과 같은 일을 GitHub 밖에서 함:
#    공용 파일 사본(cores_*) → 문법 검사 → 이미지 만들기(서울 Artifact Registry) → readnow-cloud 새 판 → 판 확인 → 🛍 readnow-shop 같은 이미지
#  · 부르는 곳: Cloud Build 트리거 rn-cloud-deploy(서울 asia-northeast3 · main push · cloud/**·readnow-*-core.js·readnow-registry.js) — 준비는 cloud/setup-cloudbuild.sh
#  · 두 번 배포하지 않기: 트리거를 만든 뒤 GitHub 저장소 변수 RN_CLOUD_DEPLOY=cloudbuild → Actions 배포 작업은 쉼(손으로 Run workflow는 그대로 됨 — 비상용)
#  · 옛 판이 새 판을 덮지 않기: 이 빌드보다 뒤에 만들어진 rn-cloud 빌드가 기다리거나·돌거나·성공했으면 이 빌드는 그만둠(Actions의 '배포끼리 한 줄'과 같은 뜻)
#  · 계정: 트리거에 gh-deployer(지금 Actions가 쓰는 배포 전용 계정)를 붙임 — 열쇠·비밀번호 없음 · 로그는 Cloud Logging에만
#  · 비용: 기본 풀 e2-standard-2 · 결제 계정마다 한 달 2,500 빌드 분 무료 · 넘으면 분당 $0.006(초 단위) — https://cloud.google.com/build/pricing
#    지금도 Actions의 'gcloud run deploy --source'가 같은 빌드를 Cloud Build에서 돌리고 있음(새로 생기는 몫은 배포 명령 시간 1~2분)
#  · 셸 변수는 그대로 $X(automapSubstitutions — 기본 치환값 PROJECT_ID·COMMIT_SHA·BUILD_ID와 _로 시작하는 값이 환경 변수로 들어옴)
#  · (cbuild 11/13) 🧾 빌드 끝 결과 남기기 — 정범님 11/13 「무조건 마무리」: 단계마다 종료 코드·로그를 모으고(cloud/cb-lib.sh) 마지막 report 단계가
#    성공·실패·실패 단계·로그 마지막 줄을 클라우드 /cb-in → Firestore cloudbuild_runs에 남김(cloud/cb-report.py · 비밀값 꼴 가림) → Claude는 진단 cbuild=1로 읽음
#    그래서 일하는 단계는 allowFailure(실패해도 report까지 감) · 실패 뒤 단계는 rn_gate가 건너뜀 · report가 실패면 1로 끝나 빌드 전체가 '실패'
#  · 두 길로 부름: ① 트리거 rn-cloud-deploy(COMMIT_SHA) ② GitHub Actions가 맡기고 기다리지 않음(gcloud builds submit · _SHA·_VIA=submit — 트리거 연결 전 · deploy-cloud.yml)
#  · 시험: _RN_FAIL_AT=<단계>(그 단계 일부러 실패) · _RN_DRY=1(이미지·배포·우리숍 건너뜀 — 아무것도 안 올림) · _RN_TEST=시험 이름표
substitutions:
  _SHA: ''
  _VIA: trigger
  _RN_FAIL_AT: ''
  _RN_DRY: ''
  _RN_TEST: ''
  _REGION: asia-northeast3
  _SERVICE: readnow-cloud
  _SHOP: readnow-shop
  _AR: cloud-run-source-deploy   # 'gcloud run deploy --source'가 쓰던 저장소(정리 규칙: 최근 3개만) — 같은 곳에 둠
tags: ['rn-cloud']
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
steps:
  - id: newer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    allowFailure: true
    script: |
      #!/usr/bin/env bash
      set -uo pipefail
      . /workspace/cloud/cb-lib.sh newer
      "$RN_PY" /workspace/cloud/cb-report.py start || true
      # 뒤 단계(배포 직전)에서도 다시 부르는 확인 — 이 빌드보다 뒤에 만들어진 rn-cloud 빌드가 살아 있으면 그 번호
      cat > /workspace/.rn/newer.sh <<'EOF'
      #!/usr/bin/env bash
      CT=$(gcloud builds describe "$BUILD_ID" --region="$_REGION" --format='value(createTime)' 2>/dev/null)
      gcloud builds list --region="$_REGION" --filter='tags:rn-cloud' --limit=15 --format=json 2>/dev/null | CT="$CT" ME="$BUILD_ID" "${RN_PY:-python3}" -c "
      import json,os,sys
      from datetime import datetime as D
      import re
      p=lambda s:D.fromisoformat(re.sub(r'(\.\d{1,6})\d*','\\1',s).replace('Z','+00:00'))
      ct=os.environ.get('CT') or ''
      if not ct: print(''); sys.exit()
      me=p(ct); n=[b['id'] for b in json.load(sys.stdin) if b['id']!=os.environ['ME'] and b.get('status') in ('QUEUED','PENDING','WORKING','SUCCESS') and p(b['createTime'])>me and not (b.get('substitutions') or {}).get('_RN_TEST')]  # 시험 빌드(_RN_TEST)는 '더 새 빌드'로 안 셈
      print(n[0] if n else '')"
      EOF
      chmod +x /workspace/.rn/newer.sh
      rn_gate
      N=$(/workspace/.rn/newer.sh)
      if [ -n "$N" ] && [ -z "${_RN_TEST:-}" ]; then echo "⏭ 더 새 빌드 $N 이 있어 이 빌드(${SHA:0:7})는 그만둠 — 새 빌드가 그 커밋 전체를 올림"; touch /workspace/.rn/skip; fi
      echo "빌드 ${BUILD_ID} · 커밋 ${SHA:0:7} · 길 ${_VIA}${_RN_TEST:+ · 시험 $_RN_TEST}"
  - id: check
    name: node:22-slim
    allowFailure: true
    waitFor: ['-']
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      . /workspace/cloud/cb-lib.sh check
      rn_gate
      cd /workspace
      # 문법 검사(깨진 파일은 올리지 않음) · 공용 파일을 이미지에 함께(cores_<파일> · cores_commit.js — Actions 배포와 같음)
      for f in cloud/*.js; do node --check "$f"; done
      for f in readnow-*-core.js readnow-registry.js; do cp "$f" "cloud/cores_$(basename "$f")"; done
      echo "module.exports = '$SHA';" > cloud/cores_commit.js
      ls cloud/cores_* | wc -l
  - id: image
    name: gcr.io/cloud-builders/docker
    allowFailure: true
    waitFor: ['newer', 'check']
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      . /workspace/cloud/cb-lib.sh image
      rn_gate deploy
      [ -n "$SHA" ] || { echo "❌ 커밋 번호(COMMIT_SHA·_SHA)가 비어 있음"; exit 1; }
      IMG="$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR/$_SERVICE"
      # 앞 판 이미지를 캐시로(크롬·글꼴·npm 층은 거의 안 바뀜 → 빌드 분 줄임) · 같은 서울 지역이라 받기 요금 없음
      docker pull -q "$IMG:latest" >/dev/null 2>&1 || echo "(캐시 이미지 없음 — 처음부터 빌드)"
      docker build --cache-from "$IMG:latest" -t "$IMG:$SHA" -t "$IMG:latest" /workspace/cloud 2>&1 | tail -n 40
      docker image inspect "$IMG:$SHA" >/dev/null 2>&1 || { echo "❌ 이미지를 못 만듦(위 줄)"; exit 1; }
      docker push -q "$IMG:$SHA" && docker push -q "$IMG:latest"
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    allowFailure: true
    script: |
      #!/usr/bin/env bash
      set -uo pipefail
      . /workspace/cloud/cb-lib.sh deploy
      rn_gate deploy
      if [ -z "${_RN_TEST:-}" ]; then N=$(/workspace/.rn/newer.sh); if [ -n "$N" ]; then echo "⏭ 배포 직전에 더 새 빌드 $N 을 봄 — 이 판은 올리지 않음"; touch /workspace/.rn/skip /workspace/.rn/skipped_deploy; exit 0; fi; fi
      IMG="$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR/$_SERVICE"
      VER=$(grep -oP "^const VER = '\K[0-9.]+" /workspace/cloud/index.js)
      # 다른 설정(비밀·메모리·CPU·예약 호출)은 그대로 — 이미지와 CODE_SHA·동시 처리만 바꿈(Actions 배포와 같은 값)
      if ! gcloud run deploy "$_SERVICE" --image "$IMG:$SHA" --region "$_REGION" --project "$PROJECT_ID" --update-env-vars "CODE_SHA=$SHA" --concurrency 8 --quiet > /tmp/deploy.log 2>&1; then
        tail -n 25 /tmp/deploy.log; echo "❌ readnow-cloud 배포 실패(위 줄) — 지금 돌던 판은 그대로"; exit 1; fi
      tail -n 4 /tmp/deploy.log
      URL=$(gcloud run services describe "$_SERVICE" --region "$_REGION" --project "$PROJECT_ID" --format='value(status.url)')
      for i in 1 2 3 4 5 6; do GOT=$(curl -fsS "$URL/status" | grep -oP '"ver":"\K[0-9.]+' || true); [ "$GOT" = "$VER" ] && break; sleep 10; done
      echo "☁ 클라우드 $GOT 올라감 (기대 $VER · 커밋 ${SHA:0:7})"
      [ "$GOT" = "$VER" ] || { echo "❌ 올린 뒤 판이 $GOT — 기대한 $VER 아님"; exit 1; }
  - id: shop
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    allowFailure: true   # 🛍 우리숍 전용 서버 — readnow-cloud는 이미 올라감(그동안 booksqueen.com은 원래 서비스가 받음)
    # (11/13 shopsrv2) 예전엔 RN_SOFT(실패해도 '성공' · warn만)라 11/12부터 숍 전용 서버가 한 번도 손님 길에 안 들어간 것이 묻혔음 → 이제 실패면 report가 FAILURE(fail=shop)로 빨간불
    #  · 확인 주소는 /status — /healthz는 Cloud Run 예약 길(끝이 z)이라 run.app 주소에선 구글이 404를 냄(그 때문에 '공개 안 됨'으로 잘못 알았음)
    script: |
      #!/usr/bin/env bash
      set -uo pipefail
      . /workspace/cloud/cb-lib.sh shop
      rn_gate deploy
      SHOP_URL="https://$_SHOP-63884079760.$_REGION.run.app"
      pub() { curl -fsS -m 20 "$SHOP_URL/status" 2>/dev/null | grep -q "\"srv\":\"$_SHOP\""; }
      IMG=$(gcloud run services describe "$_SERVICE" --region "$_REGION" --project "$PROJECT_ID" --format='value(spec.template.spec.containers[0].image)')
      RSA=$(gcloud run services describe "$_SERVICE" --region "$_REGION" --project "$PROJECT_ID" --format='value(spec.template.spec.serviceAccountName)')
      [ -n "$IMG" ] || { echo "❌ 수집 서버 이미지 주소를 못 읽음"; exit 1; }
      A=(--image "$IMG" --region "$_REGION" --project "$PROJECT_ID" --command node --args="--max-old-space-size=700,shop-main.js" --memory 1Gi --cpu 1 --concurrency 40 --min-instances 0 --max-instances 3 --cpu-boost --timeout 60 --set-env-vars "FB_PROJECT=$PROJECT_ID,CODE_SHA=$SHA,RN_ROLE=shop" --quiet)
      [ -n "$RSA" ] && A+=(--service-account "$RSA")
      gcloud run deploy "$_SHOP" "${A[@]}" --allow-unauthenticated > /tmp/shop.log 2>&1 || { tail -n 15 /tmp/shop.log; echo "(공개 설정만 실패했을 수 있음 — 아래에서 확인)"; }
      for i in 1 2 3; do pub && break; sleep 10; done
      if ! pub; then
        echo "❌ readnow-shop이 공개되지 않음(배포 계정은 공개 설정 권한이 없음) — 정범님 Cloud Shell 한 줄: gcloud run services add-iam-policy-binding readnow-shop --region asia-northeast3 --project readnow-3a385 --member=allUsers --role=roles/run.invoker"; exit 1; fi
      B=$(curl -sS -m 20 -D - -o /dev/null "https://booksqueen.com/shop/ping?t=$(date +%s)" | tr -d '\r' | grep -i '^x-rn-srv:' || true)
      echo "🛍 우리숍 전용 서버 올라감 · booksqueen.com 지금 넘김: ${B:-모름}"
      echo "$B" | grep -qi "$_SHOP" || { echo "❌ booksqueen.com /shop/**이 아직 원래 서비스(readnow-cloud)로 넘어감 — 수집 서버가 죽으면 숍도 멎음 · GitHub Actions '우리숍 내기'를 한 번 Run workflow(6시간마다 '우리숍 실제 점검'도 저절로 다시 돌림)"; exit 1; }
  - id: report
    name: python:3.12-slim   # cloud-sdk:slim엔 python3가 없음(11/13 첫 시험 — 보고 단계가 127로 끝남) · 보고는 urllib·메타데이터만 씀
    # 🧾 빌드 끝 결과 남기기 — 앞 단계가 실패해도 여기는 언제나 돎(앞 단계 allowFailure) · 실패가 있으면 1로 끝나 빌드 전체가 '실패'
    script: |
      #!/usr/bin/env bash
      python3 /workspace/cloud/cb-report.py end
