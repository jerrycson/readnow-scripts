name: stability
on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'local/**'
      - 'shop/**'
      - 'readnow-*-core.js'
      - 'hosting/build.js'
      - '.github/workflows/stability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  standalone:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 고객 정보와 운영 연결 없는 안전성 시험
        run: |
          node src/tests/standalone/run.cjs
          node src/tests/tSHIPPC.js
          node src/tests/tSENDPREP1115.js

  shop-browser:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 고정된 브라우저 시험 도구 준비
        run: |
          npm install --prefix "$RUNNER_TEMP/rn-browser" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/rn-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: 가짜 자료로 손님 화면 전환 검사
        run: |
          export NODE_PATH="$RUNNER_TEMP/rn-browser/node_modules"
          RN_SHOP_UI=1 node src/tests/tSHOPPAGE.js
          node src/tests/tORDERCLIENT.js
          node src/tests/standalone/shelf-browser.cjs

      - name: 고정된 서버 계약 의존 코드 준비
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a110555fb9b88ee77c63ef01f738be0d81dbb139
          path: .order-server
      - name: 실제 서버 함수와 고객 화면 HTTP 통합 검사
        run: |
          export NODE_PATH="$RUNNER_TEMP/rn-browser/node_modules"
          cp -a .order-server/cloud/. cloud/
          cp .order-server/src/tests/standalone/order-attempt.test.cjs src/tests/standalone/order-attempt.test.cjs
          cp .order-server/src/tests/standalone/stability.test.cjs src/tests/standalone/stability.test.cjs
          node src/tests/tORDERINTEGRATED.js
