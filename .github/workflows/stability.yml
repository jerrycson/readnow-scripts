name: stability
on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'local/**'
      - 'shop/**'
      - 'readnow-*-core.js'
      - 'hosting/build.js'
      - '.github/workflows/stability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  standalone:
    # (privzero1 11/17) 💸 가벼운 기계(ubuntu-slim · 분당 값 1/3) + Node 22 그대로(예전 container node:22-bookworm과 같은 판 · 가벼운 기계는 container를 못 씀)
    #  · 브라우저 시험(shop-browser·account-browser)은 숍 파일이 바뀐 PR에서만 — stability-shop.yml
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: 고객 정보와 운영 연결 없는 안전성 시험
        run: |
          node src/tests/standalone/run.cjs
          node src/tests/tSHIPPC.js
          node src/tests/tSENDPREP1115.js
          node src/tests/tLIFECYCLE.js
          node src/tests/tSHOP9_1112.js
          node src/tests/tSHOPVIEW2_1114.js
