# 🔎 읽기 전용 진단 — Claude 대화 세션이 로거 사용량·기록 등 원인 분석이 필요할 때 diag/q.txt를 바꿔 main에 올리면 저절로 돎
#  · 비밀번호 없음: 구글이 이 저장소 main 가지에만 주는 1회용 ID 토큰으로 클라우드 /diag를 부름(읽기만 · app_secrets·고객 문서 제외)
#  · 결과는 diag/pub.pem(공개 열쇠)으로 암호화해 diag-out 가지에 올림 — 풀 수 있는 개인 열쇠는 저장소에 없음
name: 진단 읽기 (읽기 전용)
on:
  push:
    branches: [main]
    paths: ['diag/q.txt']
concurrency: { group: diag, cancel-in-progress: false }
permissions: { contents: write, id-token: write }
env:
  PROJECT: readnow-3a385
  REGION: asia-northeast3
  SERVICE: readnow-cloud
  WIF: projects/63884079760/locations/global/workloadIdentityPools/github/providers/readnow-scripts
  SA: gh-deployer@readnow-3a385.iam.gserviceaccount.com
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}', token_format: id_token, id_token_audience: readnow-diag, id_token_include_email: true }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: 읽고 암호화해 올리기
        env: { IDT: '${{ steps.auth.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          mkdir -p /tmp/o; n=0
          while IFS= read -r Q || [ -n "$Q" ]; do [ -z "$Q" ] && continue; n=$((n+1)); curl -sS -m 240 -H "Authorization: Bearer $IDT" "$URL/diag?$Q" > /tmp/o/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/o/r$n.json; echo "q$n bytes $(wc -c < /tmp/o/r$n.json)"; done < diag/q.txt
          tar czf /tmp/o.tgz -C /tmp/o .; openssl rand -hex 32 > /tmp/k; openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/o.tgz -out /tmp/o.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey diag/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc; rm -f /tmp/k /tmp/o.tgz; rm -rf /tmp/o
          git config user.email "actions@github.com"; git config user.name "diag"
          git fetch origin diag-out --depth 1 2>/dev/null && git checkout -B diag-out FETCH_HEAD 2>/dev/null || git checkout --orphan diag-out
          git rm -rfq . 2>/dev/null || true; cp /tmp/o.enc out.enc; cp /tmp/k.enc out.key; echo "$GITHUB_SHA" > for.txt
          git add out.enc out.key for.txt; git commit -qm "diag $GITHUB_SHA"; git push -f origin HEAD:diag-out
