# 🌐 결과물을 Firebase Hosting(readnow-3a385)에도 함께 냄 (11/10 · 1단계 — 지금 주소는 그대로 · 수집기·도우미는 아직 새 주소를 쓰지 않음)
#  · 열쇠 없음: 클라우드 자동 배포와 같은 1회용 신분증(OIDC · 이 저장소 main만)
#  · 준비(한 번): Cloud Shell에서 hosting/setup-hosting.sh — 준비 전이면 경고만 남기고 초록으로 끝남
#  · 바뀐 파일만 올라감(지문 비교) · 잇달아 올라오면 마지막 것만(앞 것은 취소)
name: 결과물 함께 내기 (Firebase Hosting)
on:
  push:
    branches: [main]
    paths: ['index.html', 'pc-live.json', 'readnow-*.js', 'app/**', 'manual/**', 'friend/**', 'aladin-terms/**', 'yes24-terms/**', 'facts-docs/**', 'local/**', 'lab/col2/**', 'firebase.json', 'hosting/**', 'cloud/shop-promo.js', 'cloud/setup-*.sh', 'ui2/**', 'src/readnow-collector.src.js', '.github/workflows/deploy-hosting.yml']
  workflow_dispatch:
  workflow_run:  # (priv1 11/13) 🐾 책방 친구 새 판(friend-v…)이 만들어지면 readnow.kr/dl/friend/에도 바로(판 만들기는 GitHub 열쇠로 해서 release 사건이 다른 작업을 깨우지 못함)
    workflows: ['책방 친구 안드로이드 앱', '책방 친구 PC 프로그램 (Windows)']
    types: [completed]
concurrency: { group: deploy-hosting, cancel-in-progress: true }
permissions: { contents: read, id-token: write }
env:
  WIF: projects/63884079760/locations/global/workloadIdentityPools/github/providers/readnow-scripts
  SA: gh-deployer@readnow-3a385.iam.gserviceaccount.com
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
        with: { fetch-depth: 1 }
      - name: 결과물 모으기
        run: node hosting/build.js
      - name: 🐾 책방 친구 설치 파일(가장 새 friend-v… 판) → dl/friend/ (priv1 11/13 · 저장소가 비공개여도 readnow.kr에서 받힘)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node hosting/friend-dl.js .hosting/public/dl/friend || echo "::warning::책방 친구 설치 파일을 못 받음 — 다른 결과물은 그대로 올림"
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}', token_format: access_token }
      - name: Hosting 올리기 (바뀐 파일만)
        env: { HOSTING_TOKEN: '${{ steps.auth.outputs.access_token }}' }
        run: node hosting/deploy.js
      - name: 올라간 것 확인
        run: |
          for i in 1 2 3 4 5 6; do GOT=$(curl -fsS "https://readnow-3a385.web.app/hosting-stamp.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true); [ "$GOT" = "$GITHUB_SHA" ] && break; sleep 5; done
          if [ "$GOT" = "$GITHUB_SHA" ]; then echo "### 🌐 Hosting에 ${GITHUB_SHA::7} 올라감" >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::Hosting에 이 커밋이 아직 안 보임(준비 전이거나 더 새 커밋이 올라감) — 지금 GitHub 쪽 결과물은 그대로"; fi
