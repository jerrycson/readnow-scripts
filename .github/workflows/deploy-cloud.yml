# 리드나우 클라우드 자동 배포 — cloud/ 폴더가 바뀐 채로 main에 올라오면 Cloud Run(readnow-cloud · 서울)에 저절로 새 판을 올림
#  · 비밀번호·열쇠 없음: GitHub가 주는 1회용 신분증(OIDC)을 구글이 확인(Workload Identity Federation) — 이 저장소의 main 가지에서만 통함
#  · (전체 점검 2026-10-12) 준비가 끝났으므로 로그인 실패는 이제 빨간 실패로 — 예전엔 '준비 전'으로 보고 초록으로 넘어가 배포 안 된 것을 놓칠 수 있었음
#  · 처음 한 번 준비(2026-10-12 끝남): Cloud Shell에서  curl -sL https://raw.githubusercontent.com/jerrycson/readnow-scripts/main/cloud/setup-autodeploy.sh | bash
#  · 기존 설정(비밀·메모리·예약 호출)은 그대로 두고 프로그램만 바꿈 — 비밀(알라딘 아이디·비밀번호)은 Secret Manager에만
#  · 손으로 다시 올리기: GitHub 저장소 → Actions → '클라우드 자동 배포' → Run workflow
#  · (deployfix 11/12) 진단 회차(side)와 배포 회차(deploy)는 묶음이 달라 진단 push가 기다리던 배포를 밀어내지 않음
#  · (priv2 11/13) 🚪 배포를 Cloud Build 트리거(cloud/cloudbuild.yaml · 준비 cloud/setup-cloudbuild.sh)로 옮기는 문 — 둘이 겹쳐 두 번 배포하지 않게
#      저장소 변수 RN_CLOUD_DEPLOY = cloudbuild 이면: push 때 배포 작업을 건너뜀 · 진단·수집기 새 판 알림이 없는 push는 '무엇이 바뀌었나'도 건너뜀(Actions 분 0)
#      (변수를 못 바꿀 때는 저장소 파일 .github/cloud-deploy-via 에 cloudbuild 한 줄로도 같음 — 배포만 건너뜀) · 손으로 Run workflow는 언제나 배포(비상용)
#      변수·파일이 없으면 지금과 똑같이 여기서 배포
#  · (cbuild 11/13) 🧾 Cloud Build에 맡기고 기다리지 않는 길(트리거 연결 전 · 정범님 손 없이) — 변수/파일 값이 cbsubmit 이면 push 배포를
#      'gcloud builds submit --async'로 Cloud Build(cloud/cloudbuild.yaml)에 맡기고 이 작업은 바로 끝남(회당 ~1분 · 예전 8분)
#      결과(성공·실패·실패 단계·로그 마지막 줄)는 빌드 끝 report 단계가 클라우드에 남김 → 진단 cbuild=1 · 손으로 Run workflow의 cb 칸 = 시험(build·fail·broken)
name: 클라우드 자동 배포 (Cloud Run)
on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/deploy-cloud.yml', 'readnow-*-core.js', 'readnow-registry.js', 'diag/q.txt', 'pc-live.json']  # (2026-10-16) diag/q.txt = 🔎 읽기 전용 진단(아래 '진단' 단계 · 배포는 건너뜀) — 구글 로그인은 이 파일(deploy-cloud.yml)에만 허락돼 있어 여기서 함  # (2026-10-13) 공용 파일이 바뀌어도 다시 올림 — 클라우드는 올린 커밋(CODE_SHA)의 공용 파일만 씀
  workflow_dispatch:
    inputs:
      health_only: { description: '숫자 요약만(배포 안 함)', type: boolean, default: false }
      cb: { description: 'Cloud Build에 맡기기 — build(진짜 배포) · fail(일부러 실패 · 안 올림) · broken(깨진 파일 · 안 올림) · dry(검사만 · 안 올림) · 비우면 예전처럼 여기서 배포', type: string, default: '' }
  schedule:
    - cron: '41 * * * *'  # (2026-10-22) 매시 41분 🔁 숫자 요약(@health 3시간·24시간)을 health-out 가지에 평문으로 — 예약 점검 세션이 push 없이 읽기만(예약 세션의 권한 검사가 진단 push를 막아 06:15 점검이 숫자를 못 본 것 · 쓰기 폭주를 못 잡은 까닭)
# (deployfix 11/12) 회차 전체 묶음은 없앰 — 예전엔 진단·숫자 요약 회차가 같은 'deploy-cloud' 묶음의 기다리던 배포를 '취소됨'으로 밀어냄(0.35.155·0.35.158·0.35.168). 묶음은 아래 작업마다 따로
permissions: { contents: write, id-token: write }  # contents: write = 진단 결과(암호화)를 diag-out 가지에 올릴 때만
env:
  PROJECT: readnow-3a385
  REGION: asia-northeast3
  SERVICE: readnow-cloud
  WIF: projects/63884079760/locations/global/workloadIdentityPools/github/providers/readnow-scripts
  SA: gh-deployer@readnow-3a385.iam.gserviceaccount.com
jobs:
  what:
    name: 무엇이 바뀌었나 (배포 · 진단)
    # (priv2 11/13) Cloud Build가 배포를 맡으면(변수) 진단(diag/q.txt)·수집기 새 판(pc-live.json)이 든 push에서만 돎 — 나머지 push는 작업 0개(분 0)
    if: vars.RN_CLOUD_DEPLOY != 'cloudbuild' || github.event_name != 'push' || contains(toJSON(github.event.commits), 'diag/q.txt') || contains(toJSON(github.event.commits), 'pc-live.json')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { cb: '${{ steps.ch.outputs.cb }}', deploy: '${{ steps.ch.outputs.deploy }}', diag: '${{ steps.ch.outputs.diag }}', pclive: '${{ steps.ch.outputs.pclive }}', health: '${{ steps.ch.outputs.health }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 (node24 · 전체 점검 2026-10-12: v4는 node20이라 곧 막힘)
        with: { fetch-depth: 2 }
      - id: ch
        name: 무엇이 바뀌었나 (배포 · 진단)
        run: |
          # (자동 점검 2026-10-16) 한 번에 여러 커밋을 올리면 HEAD~1과만 비교해 앞 커밋의 cloud/ 바뀜을 놓치고 배포를 건너뛰던 것 → 올리기 전 커밋(event.before)과 비교 · 못 받으면 ALL(배포)
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "${{ inputs.health_only }}" = true ]; then echo "health=1" >> "$GITHUB_OUTPUT"; exit 0; fi  # (2026-10-22) 숫자 요약만 — 배포·진단 안 함
          CB_IN="${{ inputs.cb }}"; if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$CB_IN" ]; then case "$CB_IN" in build|fail|broken|dry) echo "cb=$CB_IN" >> "$GITHUB_OUTPUT"; echo "::notice::Cloud Build에 맡김($CB_IN)";; *) echo "::error::cb 칸은 build·fail·broken·dry 중 하나"; exit 1;; esac; exit 0; fi  # (cbuild 11/13)
          B="${{ github.event.before }}"
          if [ -n "$B" ] && [ "$B" != 0000000000000000000000000000000000000000 ] && { git cat-file -e "$B^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$B" 2>/dev/null; }; then CH=$(git diff --name-only "$B" HEAD 2>/dev/null || echo ALL); else CH=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ALL); fi
          VIA="${{ vars.RN_CLOUD_DEPLOY }}"; [ -z "$VIA" ] && [ -f .github/cloud-deploy-via ] && VIA=$(head -c 40 .github/cloud-deploy-via | tr -dc 'a-z')  # (priv2 11/13) 🚪 배포를 Cloud Build가 맡는지
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$CH" = ALL ] || echo "$CH" | grep -qE '^(cloud/|\.github/workflows/deploy-cloud\.yml|readnow-[a-z]+-core\.js|readnow-registry\.js)'; then
            if [ "$VIA" = cloudbuild ] && [ "$GITHUB_EVENT_NAME" = push ]; then echo "::notice::배포는 Cloud Build 트리거(rn-cloud-deploy)가 맡음 — 여기서는 건너뜀(RN_CLOUD_DEPLOY=cloudbuild)"
            elif [ "$VIA" = cbsubmit ] && [ "$GITHUB_EVENT_NAME" = push ]; then echo "cb=build" >> "$GITHUB_OUTPUT"; echo "::notice::배포를 Cloud Build에 맡김(cbsubmit) — 결과는 진단 cbuild=1"
            else echo "deploy=1" >> "$GITHUB_OUTPUT"; fi; fi
          if echo "$CH" | grep -q '^diag/q\.txt$'; then echo "diag=1" >> "$GITHUB_OUTPUT"; fi
          if echo "$CH" | grep -q '^pc-live\.json$'; then echo "pclive=1" >> "$GITHUB_OUTPUT"; fi  # (2026-10-18) ⚡ 수집기 새 판 → 클라우드 /pclive → 켜진 PC가 바로
  deploy:
    name: Cloud Run 배포
    needs: what
    if: needs.what.outputs.deploy == '1'
    concurrency: { group: deploy-cloud, cancel-in-progress: false }  # 배포끼리만 한 줄 — 새 판이 기다리던 옛 판을 대신해도 새 판(그 커밋 전체)이 올라가므로 마지막 판은 꼭 배포됨
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs: { deployed: "${{ steps.ver.outcome == 'success' }}" }  # 클라우드 새 판이 올라갔는지(뒤 작업이 이어 받음)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
      - name: 문법 검사 (깨진 파일은 올리지 않음)
        run: |
          for f in cloud/*.js; do node --check "$f"; done
          echo "VER=$(grep -oP "^const VER = '\K[0-9.]+" cloud/index.js)" >> "$GITHUB_ENV"
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24)
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}' }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24)
      - name: Cloud Run 올리기 (빌드 3~6분)
        working-directory: cloud
        run: |
          # (11/10 big1) 공용 파일을 이미지에 함께 넣음(cores_<파일> · cores_commit.js) — 클라우드가 GitHub에서 받지 않고 이 커밋의 사본을 읽음(없거나 커밋이 다르면 예전처럼 GitHub)
          for f in ../readnow-*-core.js ../readnow-registry.js; do cp "$f" "cores_$(basename "$f")"; done; echo "module.exports = '$GITHUB_SHA';" > cores_commit.js; ls cores_* | wc -l
          # 실패하면 마지막 줄들을 알림(annotation)으로 — GitHub 화면·Claude가 로그 파일 없이도 까닭을 봄
          if ! gcloud run deploy "$SERVICE" --source . --region "$REGION" --project "$PROJECT" --update-env-vars "CODE_SHA=$GITHUB_SHA" --concurrency 8 --quiet > /tmp/deploy.log 2>&1; then
            tail -n 25 /tmp/deploy.log | sed 's/^/  /'; grep -iE 'error|denied|permission|not found|failed' /tmp/deploy.log | tail -n 6 | while IFS= read -r l; do echo "::error::$l"; done
            if grep -q "iam.serviceAccounts.getAccessToken\|generateAccessToken\|workloadIdentityUser" /tmp/deploy.log; then echo "::error::배포 계정을 쓸 권한(GitHub → gh-deployer 묶음)이 아직 없음 — Cloud Shell에서 setup-autodeploy.sh를 다시 실행하세요"; fi
            exit 1; fi
          tail -n 5 /tmp/deploy.log
          # (adapt5 11/11) 동시 처리·메모리·CPU가 실제로 들어갔는지 알림으로 남김(읽기만 · 실패해도 배포는 성공)
          C=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(spec.template.spec.containerConcurrency,spec.template.spec.containers[0].resources.limits.memory,spec.template.spec.containers[0].resources.limits.cpu,status.latestReadyRevisionName)' 2>/dev/null || true); echo "::notice::클라우드 설정(동시 처리·메모리·CPU·판) $C"
      - name: 올라간 판 확인
        id: ver
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          for i in 1 2 3 4 5 6; do GOT=$(curl -fsS "$URL/status" | grep -oP '"ver":"\K[0-9.]+' || true); [ "$GOT" = "$VER" ] && break; sleep 10; done
          echo "### ☁ 클라우드 $GOT 올라감 (기대 $VER)" >> "$GITHUB_STEP_SUMMARY"
          [ "$GOT" = "$VER" ] || { echo "::error::올린 뒤 판이 $GOT — 기대한 $VER 아님"; exit 1; }
  cbsub:
    name: Cloud Build에 맡기기 (기다리지 않음)
    needs: what
    if: needs.what.outputs.cb != ''
    concurrency: { group: "cbsub-${{ needs.what.outputs.cb }}", cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24)
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}' }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24)
      - name: 맡기기 (cloud/cloudbuild.yaml · 결과는 진단 cbuild=1)
        env: { CB: '${{ needs.what.outputs.cb }}' }
        run: |
          # 필요한 파일만 담아 올림(클라우드 코드·공용 파일) — 저장소 전체를 올리지 않음
          mkdir -p /tmp/cb; cp -r cloud /tmp/cb/; cp readnow-*-core.js readnow-registry.js /tmp/cb/
          FA=""; DRY=""; TEST=""
          case "$CB" in fail) FA=check; DRY=1; TEST=fail;; broken) DRY=1; TEST=broken; printf '%s\n' '/* 일부러 깨뜨린 시험 파일(cbuild 시험 · 올리지 않음) */' 'const x = ;' > /tmp/cb/cloud/zz-cbtest-broken.js;; dry) DRY=1; TEST=dry;; esac
          SUB="_SHA=$GITHUB_SHA,_VIA=submit,_RN_FAIL_AT=$FA,_RN_DRY=$DRY,_RN_TEST=$TEST"
          # 소스 올릴 곳: 'gcloud run deploy --source'가 이미 쓰는 run-sources 통(gh-deployer가 씀) — 기본 _cloudbuild 통은 이 계정이 못 엶(11/13 첫 시험)
          ST="gs://run-sources-$PROJECT-$REGION/cbuild"
          go() { gcloud builds submit /tmp/cb --region "$REGION" --project "$PROJECT" --config /tmp/cb/cloud/cloudbuild.yaml --substitutions="$SUB" --async --format='value(id)' "$@" 2>>/tmp/sub.err; }
          B=$(go --gcs-source-staging-dir="$ST") || B=$(go --gcs-source-staging-dir="$ST" --service-account="projects/$PROJECT/serviceAccounts/63884079760-compute@developer.gserviceaccount.com") || B=$(go) || { tail -n 20 /tmp/sub.err; grep -iE 'error|denied|permission' /tmp/sub.err | tail -n 4 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          echo "### ☁ Cloud Build $B 맡김 ($CB · 커밋 ${GITHUB_SHA:0:7}) — 결과는 진단 cbuild=1" >> "$GITHUB_STEP_SUMMARY"; echo "::notice::Cloud Build $B 맡김($CB)"
  side:
    name: 진단 · 숫자 요약 · 수집기 새 판 알림
    needs: what
    if: needs.what.outputs.diag == '1' || needs.what.outputs.pclive == '1' || needs.what.outputs.health == '1'
    concurrency: { group: "cloud-side-${{ needs.what.outputs.health == '1' && 'health' || 'diag' }}", cancel-in-progress: false }  # 배포 묶음과 따로 — 진단이 배포를 밀어내지 않음 · 매시 숫자 요약도 진단과 따로
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { DO_DIAG: '${{ needs.what.outputs.diag }}', DO_PCLIVE: '${{ needs.what.outputs.pclive }}', DO_HEALTH: '${{ needs.what.outputs.health }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24)
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}' }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24)
      - id: idt
        name: 진단용 1회용 ID 토큰
        if: env.DO_DIAG == '1' || env.DO_PCLIVE == '1' || env.DO_HEALTH == '1'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}', token_format: id_token, id_token_audience: readnow-diag, id_token_include_email: true, create_credentials_file: false }
      - name: 🔎 진단 — 읽고 암호화해 diag-out 가지에 (읽기 전용 · 개인 열쇠는 저장소에 없음)
        if: env.DO_DIAG == '1'
        env: { IDT: '${{ steps.idt.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          mkdir -p /tmp/o; n=0
          # (2026-10-16) '@kpin 파일' 줄 = 📰 출판 정보 요약 넣기(암호문 diag/파일 → 클라우드 /kp-in) · 'Rate exceeded'(클라우드가 바쁨)면 20초 뒤 다시(4번까지)
          while IFS= read -r Q || [ -n "$Q" ]; do [ -z "$Q" ] && continue; n=$((n+1))
            for t in 1 2 3 4; do
              if [ "${Q#@kpq }" != "$Q" ]; then mkdir -p /tmp/kq; curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?${Q#@kpq }" > /tmp/kq/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/kq/r$n.json; echo '{"ok":true,"kq":"kp-out 가지로"}' > /tmp/o/r$n.json; grep -q '^Rate exceeded' /tmp/kq/r$n.json || break; sleep 20; continue
              elif [ "${Q#@health}" != "$Q" ]; then curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?health=1${Q#@health}" > /tmp/health.json || echo '{"ok":false,"err":"curl"}' > /tmp/health.json; echo '{"ok":true,"health":"diag-out 가지 health.json(평문)"}' > /tmp/o/r$n.json; grep -q '^Rate exceeded' /tmp/health.json || break; sleep 20; continue
              elif [ "${Q#@mirror }" != "$Q" ]; then F="diag/${Q#@mirror }"; F=${F//../}; curl -sS -m 120 -X POST -H "Authorization: Bearer $IDT" -H 'content-type: application/json' --data-binary @"$F" "$URL/board-in" > /tmp/o/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/o/r$n.json  # (rel11 11/12) '@mirror 파일' 줄 = 📋 작업판 거울(암호문 diag/mirror/파일 → 클라우드 /board-in → app_settings/board_mirror·ship_quiet)
              elif [ "${Q#@kpin }" != "$Q" ]; then F="diag/${Q#@kpin }"; F=${F//../}; curl -sS -m 280 -X POST -H "Authorization: Bearer $IDT" -H 'content-type: application/json' --data-binary @"$F" "$URL/kp-in" > /tmp/o/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/o/r$n.json
              else curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?$Q" > /tmp/o/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/o/r$n.json; fi
              grep -q '^Rate exceeded' /tmp/o/r$n.json || break; sleep 20; done
            echo "q$n bytes $(wc -c < /tmp/o/r$n.json)"; done < diag/q.txt
          # (2026-10-16) '@kpq …' 줄 = 📰 요약할 출판 정보 글(공개 KPIPA 글만) — Claude 예약 작업용 열쇠(diag/kps_pub.pem · 개인 열쇠는 예약 작업 안에만)로 암호화해 kp-out 가지에
          if [ -d /tmp/kq ]; then tar czf /tmp/q.tgz -C /tmp/kq .; openssl rand -hex 32 > /tmp/qk; openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/q.tgz -out /tmp/q.enc -pass file:/tmp/qk; openssl pkeyutl -encrypt -pubin -inkey diag/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/qk -out /tmp/qk.enc; # (2026-11-02 정범님 '진단 열쇠 바꾸기') 옛 예약 열쇠(kps — 옛 예약 작업 설명에 글자로 남았던 것)로는 더 잠그지 않음 · 예약 작업은 회차 열쇠 out.key_<이름>으로 풂
          for P in diag/pub_*.pem; do [ -f "$P" ] || continue; N=$(basename "$P" .pem); openssl pkeyutl -encrypt -pubin -inkey "$P" -pkeyopt rsa_padding_mode:oaep -in /tmp/qk -out "/tmp/qx_${N#pub_}.enc" || true; done; rm -f /tmp/qk /tmp/q.tgz; rm -rf /tmp/kq
            git config user.email "actions@github.com"; git config user.name "diag"; B=$(git rev-parse HEAD); git checkout -q --orphan kp-out; git rm -rfq --cached . ; cp /tmp/q.enc out.enc; cp /tmp/qk.enc out.key; for F in /tmp/qx_*.enc; do [ -f "$F" ] || continue; N=$(basename "$F" .enc); cp "$F" "out.key_${N#qx_}"; git add -f "out.key_${N#qx_}"; rm -f "$F"; done; echo "$GITHUB_SHA" > for.txt; git add -f out.enc out.key for.txt; git commit -qm "kq $GITHUB_SHA"; git push -qf origin HEAD:kp-out; git checkout -q -f "$B"; fi
          tar czf /tmp/o.tgz -C /tmp/o .; openssl rand -hex 32 > /tmp/k; openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/o.tgz -out /tmp/o.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey diag/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc; for P in diag/pub_*.pem; do [ -f "$P" ] || continue; N=$(basename "$P" .pem); openssl pkeyutl -encrypt -pubin -inkey "$P" -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out "/tmp/kx_${N#pub_}.enc" || true; done; rm -f /tmp/k /tmp/o.tgz; rm -rf /tmp/o  # (2026-10-27) out.key2 = 예약 점검 열쇠(kps)로도 — 점검이 대화 세션처럼 원문 진단을 직접 풂(정범님 '왜 점검은 근원을 못 잡나')
          git config user.email "actions@github.com"; git config user.name "diag"; git checkout -q --orphan diag-out; git rm -rfq --cached . ; cp /tmp/o.enc out.enc; cp /tmp/k.enc out.key; for F in /tmp/kx_*.enc; do [ -f "$F" ] || continue; N=$(basename "$F" .enc); cp "$F" "out.key_${N#kx_}"; git add -f "out.key_${N#kx_}"; done; echo "$GITHUB_SHA" > for.txt  # (2026-10-29) diag/pub_<이름>.pem = Claude Code 예약 작업이 회차마다 새로 만든 열쇠 → out.key_<이름>
          if [ -f /tmp/health.json ]; then cp /tmp/health.json health.json; git add -f health.json; fi  # (2026-10-21) '@health' 줄 = 🔁 3시간 점검용 숫자 요약(평문 — 고객·제목·이름 없이 숫자와 오류 틀만 · 예약 점검이 열쇠 없이 읽음)
          git add -f out.enc out.key for.txt; git commit -qm "diag $GITHUB_SHA"; git push -qf origin HEAD:diag-out
      - name: 🔁 숫자 요약 → health-out 가지 (평문 · 고객·제목 없이 숫자·오류 틀만)
        if: env.DO_HEALTH == '1'
        env: { IDT: '${{ steps.idt.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          mkdir -p /tmp/h
          for H in 3 24; do for t in 1 2 3 4; do curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?health=1&hours=$H" > /tmp/h/health$H.json || echo '{"ok":false,"err":"curl"}' > /tmp/h/health$H.json; grep -q '^Rate exceeded' /tmp/h/health$H.json || break; sleep 20; done; echo "health$H bytes $(wc -c < /tmp/h/health$H.json)"; done
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/h/at.txt
          git config user.email "actions@github.com"; git config user.name "health"; git checkout -q --orphan health-out; git rm -rfq --cached . ; cp /tmp/h/* .; git add -f health3.json health24.json at.txt; git commit -qm "health $(cat /tmp/h/at.txt)"; git push -qf origin HEAD:health-out
      - name: ⚡ 수집기 새 판 알림 (pc-live.json이 바뀌었을 때 — 켜진 PC가 몇 초 안에 받음)
        if: env.DO_PCLIVE == '1'
        env: { IDT: '${{ steps.idt.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          V=$(python3 -c "import json;print(json.load(open('pc-live.json'))['ver'])")
          for t in 1 2 3 4; do R=$(curl -sS -m 60 -X POST -H "Authorization: Bearer $IDT" "$URL/pclive?ver=$V&commit=$GITHUB_SHA" || true); echo "$R"; echo "$R" | grep -q '"ok":true' && break; sleep 20; done

  # (11/12 shopsrv · 정범님 11/12 밤 '우리숍 전용 서버를 바로 둠') 🛍 readnow-shop — 수집 서버(readnow-cloud)와 같은 이미지 · 명령만 node shop-main.js(숍 창구만 · 크롬·수집·배우기·예약 일 없음)
  #  · 최소 0대(손님 없으면 0원) · 최대 3대 · 동시 40 · 1 vCPU·1GiB · 켤 때 CPU 부스트 · 요청 처리 중에만 CPU 값
  #  · 공개(allUsers 호출)가 안 되면 빨간 실패 + 정범님이 Cloud Shell에서 한 줄 — 그동안 booksqueen.com은 원래 서비스로 넘어감(hosting/deploy.js resolveRuns)
  #  · booksqueen.com/shop/ping 응답 머리(X-RN-Srv)가 아직 readnow-cloud면 '우리숍 내기'를 다시 돌려 Hosting 넘김을 새 서비스로 바꿈
  shop:
    name: 🛍 우리숍 전용 서버
    needs: deploy
    concurrency: { group: deploy-shopsrv, cancel-in-progress: false }
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, id-token: write, actions: write }
    env: { SHOP_SVC: readnow-shop, SHOP_URL: 'https://readnow-shop-63884079760.asia-northeast3.run.app' }
    steps:
      - name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}' }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: 🛍 우리숍 전용 서버 올리기 (같은 이미지)
        run: |
          # (shopsrv2 11/13) 확인 주소는 /status — /healthz는 Cloud Run 예약 길(끝이 z)이라 run.app에선 늘 404
          pub() { curl -fsS -m 20 "$SHOP_URL/status" 2>/dev/null | grep -q "\"srv\":\"$SHOP_SVC\""; }
          IMG=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(spec.template.spec.containers[0].image)')
          RSA=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(spec.template.spec.serviceAccountName)')
          [ -n "$IMG" ] || { echo "::error::수집 서버 이미지 주소를 못 읽음"; exit 1; }
          echo "이미지 $IMG · 실행 계정 ${RSA:-기본}"
          A=(--image "$IMG" --region "$REGION" --project "$PROJECT" --command node --args="--max-old-space-size=700,shop-main.js" --memory 1Gi --cpu 1 --concurrency 40 --min-instances 0 --max-instances 3 --cpu-boost --timeout 60 --set-env-vars "FB_PROJECT=$PROJECT,CODE_SHA=$GITHUB_SHA,RN_ROLE=shop" --quiet)
          [ -n "$RSA" ] && A+=(--service-account "$RSA")
          if ! gcloud run deploy "$SHOP_SVC" "${A[@]}" --allow-unauthenticated > /tmp/shop.log 2>&1; then
            tail -n 15 /tmp/shop.log
            if grep -qi "iam\|policy" /tmp/shop.log && gcloud run services describe "$SHOP_SVC" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then echo "::warning::공개 설정(IAM)만 실패 — 아래에서 다시"; else
              grep -iE 'error|denied|permission|quota|billing' /tmp/shop.log | tail -n 6 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          fi
          tail -n 4 /tmp/shop.log
          for i in 1 2 3; do pub && break; sleep 10; done
          if ! pub; then
            gcloud run services update "$SHOP_SVC" --region "$REGION" --project "$PROJECT" --no-invoker-iam-check --quiet > /tmp/iam1.log 2>&1 || tail -n 3 /tmp/iam1.log
            gcloud run services add-iam-policy-binding "$SHOP_SVC" --region "$REGION" --project "$PROJECT" --member=allUsers --role=roles/run.invoker --quiet > /tmp/iam2.log 2>&1 || tail -n 3 /tmp/iam2.log
            for i in 1 2 3 4 5 6; do pub && break; sleep 10; done
          fi
          if ! pub; then
            echo "::error::readnow-shop이 공개되지 않음(배포 계정 gh-deployer는 run.developer라 공개 설정 권한이 없음) — 정범님: Cloud Shell에서  gcloud run services add-iam-policy-binding readnow-shop --region asia-northeast3 --project readnow-3a385 --member=allUsers --role=roles/run.invoker  한 줄 → 그 뒤 Actions '클라우드 자동 배포' Run workflow (그동안 booksqueen.com은 원래 서비스가 받음)"
            echo "### 🛍 우리숍 전용 서버: 올렸지만 공개 안 됨 — 정범님 한 줄 필요(오류 알림 참고) · 숍은 원래 서비스로 계속" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          C=$(gcloud run services describe "$SHOP_SVC" --region "$REGION" --project "$PROJECT" --format='value(spec.template.spec.containerConcurrency,spec.template.spec.containers[0].resources.limits.memory,spec.template.metadata.annotations."autoscaling.knative.dev/maxScale",status.latestReadyRevisionName)' 2>/dev/null || true); echo "::notice::우리숍 전용 서버 설정(동시·메모리·최대 대수·판) $C"
      - name: 🛍 확인 (응답 머리·자료)
        run: |
          H=$(curl -sS -m 30 -D - -o /tmp/cfg.json "$SHOP_URL/shop/cfg" | tr -d '\r' | grep -i '^x-rn-srv:' || true)
          N=$(python3 -c "import json;print(json.load(open('/tmp/cfg.json')).get('n'))" 2>/dev/null || echo '?')
          S=$(curl -sS -m 30 "$SHOP_URL/shop/shelf?k=0" | python3 -c "import json,sys;j=json.load(sys.stdin);print(len(j.get('rows',[])),'/',j.get('n'))" 2>/dev/null || echo '?')
          B=$(curl -sS -m 20 -D - -o /dev/null "https://booksqueen.com/shop/ping?t=$(date +%s)" | tr -d '\r' | grep -i '^x-rn-srv:' || true)
          echo "### 🛍 우리숍 전용 서버 — ${H:-머리 없음} · 판매 ${N}권 · 서가 첫 묶음 ${S} · booksqueen.com 지금 넘김: ${B:-모름}" >> "$GITHUB_STEP_SUMMARY"
          echo "$B" | grep -qi "$SHOP_SVC" && echo "ROUTED=1" >> "$GITHUB_ENV"
          echo "$H" | grep -qi "$SHOP_SVC" || { echo "::error::새 서비스 응답 머리에 $SHOP_SVC가 없음"; exit 1; }
      - name: booksqueen.com이 아직 새 서비스로 안 넘어갔으면 Hosting 다시 (우리숍 내기)
        if: env.ROUTED != '1'
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: gh workflow run deploy-shop.yml --ref main && echo "::notice::'우리숍 내기'를 다시 돌림 — booksqueen.com 넘김이 readnow-shop으로"
