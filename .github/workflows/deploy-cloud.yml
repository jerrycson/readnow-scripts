# 리드나우 클라우드 자동 배포 — cloud/ 폴더가 바뀐 채로 main에 올라오면 Cloud Run(readnow-cloud · 서울)에 저절로 새 판을 올림
#  · 비밀번호·열쇠 없음: GitHub가 주는 1회용 신분증(OIDC)을 구글이 확인(Workload Identity Federation) — 이 저장소의 main 가지에서만 통함
#  · (전체 점검 2026-10-12) 준비가 끝났으므로 로그인 실패는 이제 빨간 실패로 — 예전엔 '준비 전'으로 보고 초록으로 넘어가 배포 안 된 것을 놓칠 수 있었음
#  · 처음 한 번 준비(2026-10-12 끝남): Cloud Shell에서  curl -sL https://raw.githubusercontent.com/jerrycson/readnow-scripts/main/cloud/setup-autodeploy.sh | bash
#  · 기존 설정(비밀·메모리·예약 호출)은 그대로 두고 프로그램만 바꿈 — 비밀(알라딘 아이디·비밀번호)은 Secret Manager에만
#  · 손으로 다시 올리기: GitHub 저장소 → Actions → '클라우드 자동 배포' → Run workflow
name: 클라우드 자동 배포 (Cloud Run)
on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/deploy-cloud.yml', 'readnow-*-core.js', 'readnow-registry.js', 'diag/q.txt', 'pc-live.json']  # (2026-10-16) diag/q.txt = 🔎 읽기 전용 진단(아래 '진단' 단계 · 배포는 건너뜀) — 구글 로그인은 이 파일(deploy-cloud.yml)에만 허락돼 있어 여기서 함  # (2026-10-13) 공용 파일이 바뀌어도 다시 올림 — 클라우드는 올린 커밋(CODE_SHA)의 공용 파일만 씀
  workflow_dispatch:
    inputs:
      health_only: { description: '숫자 요약만(배포 안 함)', type: boolean, default: false }
  schedule:
    - cron: '41 * * * *'  # (2026-10-22) 매시 41분 🔁 숫자 요약(@health 3시간·24시간)을 health-out 가지에 평문으로 — 예약 점검 세션이 push 없이 읽기만(예약 세션의 권한 검사가 진단 push를 막아 06:15 점검이 숫자를 못 본 것 · 쓰기 폭주를 못 잡은 까닭)
concurrency: { group: deploy-cloud, cancel-in-progress: false }
permissions: { contents: write, id-token: write }  # contents: write = 진단 결과(암호화)를 diag-out 가지에 올릴 때만
env:
  PROJECT: readnow-3a385
  REGION: asia-northeast3
  SERVICE: readnow-cloud
  WIF: projects/63884079760/locations/global/workloadIdentityPools/github/providers/readnow-scripts
  SA: gh-deployer@readnow-3a385.iam.gserviceaccount.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 (node24 · 전체 점검 2026-10-12: v4는 node20이라 곧 막힘)
        with: { fetch-depth: 2 }
      - name: 무엇이 바뀌었나 (배포 · 진단)
        run: |
          # (자동 점검 2026-10-16) 한 번에 여러 커밋을 올리면 HEAD~1과만 비교해 앞 커밋의 cloud/ 바뀜을 놓치고 배포를 건너뛰던 것 → 올리기 전 커밋(event.before)과 비교 · 못 받으면 ALL(배포)
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "${{ inputs.health_only }}" = true ]; then echo "DO_HEALTH=1" >> "$GITHUB_ENV"; exit 0; fi  # (2026-10-22) 숫자 요약만 — 배포·진단 안 함
          B="${{ github.event.before }}"
          if [ -n "$B" ] && [ "$B" != 0000000000000000000000000000000000000000 ] && { git cat-file -e "$B^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$B" 2>/dev/null; }; then CH=$(git diff --name-only "$B" HEAD 2>/dev/null || echo ALL); else CH=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ALL); fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$CH" = ALL ] || echo "$CH" | grep -qE '^(cloud/|\.github/workflows/deploy-cloud\.yml|readnow-[a-z]+-core\.js|readnow-registry\.js)'; then echo "DO_DEPLOY=1" >> "$GITHUB_ENV"; fi
          if echo "$CH" | grep -q '^diag/q\.txt$'; then echo "DO_DIAG=1" >> "$GITHUB_ENV"; fi
          if echo "$CH" | grep -q '^pc-live\.json$'; then echo "DO_PCLIVE=1" >> "$GITHUB_ENV"; fi  # (2026-10-18) ⚡ 수집기 새 판 → 클라우드 /pclive → 켜진 PC가 바로
      - name: 문법 검사 (깨진 파일은 올리지 않음)
        if: env.DO_DEPLOY == '1'
        run: |
          for f in cloud/*.js; do node --check "$f"; done
          echo "VER=$(grep -oP "^const VER = '\K[0-9.]+" cloud/index.js)" >> "$GITHUB_ENV"
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24)
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}' }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24)
      - id: idt
        name: 진단용 1회용 ID 토큰
        if: env.DO_DIAG == '1' || env.DO_PCLIVE == '1' || env.DO_HEALTH == '1'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}', token_format: id_token, id_token_audience: readnow-diag, id_token_include_email: true, create_credentials_file: false }
      - name: 🔎 진단 — 읽고 암호화해 diag-out 가지에 (읽기 전용 · 개인 열쇠는 저장소에 없음)
        if: env.DO_DIAG == '1'
        env: { IDT: '${{ steps.idt.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          mkdir -p /tmp/o; n=0
          # (2026-10-16) '@kpin 파일' 줄 = 📰 출판 정보 요약 넣기(암호문 diag/파일 → 클라우드 /kp-in) · 'Rate exceeded'(클라우드가 바쁨)면 20초 뒤 다시(4번까지)
          while IFS= read -r Q || [ -n "$Q" ]; do [ -z "$Q" ] && continue; n=$((n+1))
            for t in 1 2 3 4; do
              if [ "${Q#@kpq }" != "$Q" ]; then mkdir -p /tmp/kq; curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?${Q#@kpq }" > /tmp/kq/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/kq/r$n.json; echo '{"ok":true,"kq":"kp-out 가지로"}' > /tmp/o/r$n.json; grep -q '^Rate exceeded' /tmp/kq/r$n.json || break; sleep 20; continue
              elif [ "${Q#@health}" != "$Q" ]; then curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?health=1${Q#@health}" > /tmp/health.json || echo '{"ok":false,"err":"curl"}' > /tmp/health.json; echo '{"ok":true,"health":"diag-out 가지 health.json(평문)"}' > /tmp/o/r$n.json; grep -q '^Rate exceeded' /tmp/health.json || break; sleep 20; continue
              elif [ "${Q#@kpin }" != "$Q" ]; then F="diag/${Q#@kpin }"; F=${F//../}; curl -sS -m 280 -X POST -H "Authorization: Bearer $IDT" -H 'content-type: application/json' --data-binary @"$F" "$URL/kp-in" > /tmp/o/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/o/r$n.json
              else curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?$Q" > /tmp/o/r$n.json || echo '{"ok":false,"err":"curl"}' > /tmp/o/r$n.json; fi
              grep -q '^Rate exceeded' /tmp/o/r$n.json || break; sleep 20; done
            echo "q$n bytes $(wc -c < /tmp/o/r$n.json)"; done < diag/q.txt
          # (2026-10-16) '@kpq …' 줄 = 📰 요약할 출판 정보 글(공개 KPIPA 글만) — Claude 예약 작업용 열쇠(diag/kps_pub.pem · 개인 열쇠는 예약 작업 안에만)로 암호화해 kp-out 가지에
          if [ -d /tmp/kq ]; then tar czf /tmp/q.tgz -C /tmp/kq .; openssl rand -hex 32 > /tmp/qk; openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/q.tgz -out /tmp/q.enc -pass file:/tmp/qk; openssl pkeyutl -encrypt -pubin -inkey diag/kps_pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/qk -out /tmp/qk.enc; rm -f /tmp/qk /tmp/q.tgz; rm -rf /tmp/kq
            git config user.email "actions@github.com"; git config user.name "diag"; B=$(git rev-parse HEAD); git checkout -q --orphan kp-out; git rm -rfq --cached . ; cp /tmp/q.enc out.enc; cp /tmp/qk.enc out.key; echo "$GITHUB_SHA" > for.txt; git add -f out.enc out.key for.txt; git commit -qm "kq $GITHUB_SHA"; git push -qf origin HEAD:kp-out; git checkout -q -f "$B"; fi
          tar czf /tmp/o.tgz -C /tmp/o .; openssl rand -hex 32 > /tmp/k; openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/o.tgz -out /tmp/o.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey diag/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc; openssl pkeyutl -encrypt -pubin -inkey diag/kps_pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k2.enc; rm -f /tmp/k /tmp/o.tgz; rm -rf /tmp/o  # (2026-10-27) out.key2 = 예약 점검 열쇠(kps)로도 — 점검이 대화 세션처럼 원문 진단을 직접 풂(정범님 '왜 점검은 근원을 못 잡나')
          git config user.email "actions@github.com"; git config user.name "diag"; git checkout -q --orphan diag-out; git rm -rfq --cached . ; cp /tmp/o.enc out.enc; cp /tmp/k.enc out.key; cp /tmp/k2.enc out.key2; echo "$GITHUB_SHA" > for.txt
          if [ -f /tmp/health.json ]; then cp /tmp/health.json health.json; git add -f health.json; fi  # (2026-10-21) '@health' 줄 = 🔁 3시간 점검용 숫자 요약(평문 — 고객·제목·이름 없이 숫자와 오류 틀만 · 예약 점검이 열쇠 없이 읽음)
          git add -f out.enc out.key out.key2 for.txt; git commit -qm "diag $GITHUB_SHA"; git push -qf origin HEAD:diag-out
      - name: 🔁 숫자 요약 → health-out 가지 (평문 · 고객·제목 없이 숫자·오류 틀만)
        if: env.DO_HEALTH == '1'
        env: { IDT: '${{ steps.idt.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          mkdir -p /tmp/h
          for H in 3 24; do for t in 1 2 3 4; do curl -sS -m 280 -H "Authorization: Bearer $IDT" "$URL/diag?health=1&hours=$H" > /tmp/h/health$H.json || echo '{"ok":false,"err":"curl"}' > /tmp/h/health$H.json; grep -q '^Rate exceeded' /tmp/h/health$H.json || break; sleep 20; done; echo "health$H bytes $(wc -c < /tmp/h/health$H.json)"; done
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/h/at.txt
          git config user.email "actions@github.com"; git config user.name "health"; git checkout -q --orphan health-out; git rm -rfq --cached . ; cp /tmp/h/* .; git add -f health3.json health24.json at.txt; git commit -qm "health $(cat /tmp/h/at.txt)"; git push -qf origin HEAD:health-out
      - name: Cloud Run 올리기 (빌드 3~6분)
        if: env.DO_DEPLOY == '1'
        working-directory: cloud
        run: |
          # 실패하면 마지막 줄들을 알림(annotation)으로 — GitHub 화면·Claude가 로그 파일 없이도 까닭을 봄
          if ! gcloud run deploy "$SERVICE" --source . --region "$REGION" --project "$PROJECT" --update-env-vars "CODE_SHA=$GITHUB_SHA" --quiet > /tmp/deploy.log 2>&1; then
            tail -n 25 /tmp/deploy.log | sed 's/^/  /'; grep -iE 'error|denied|permission|not found|failed' /tmp/deploy.log | tail -n 6 | while IFS= read -r l; do echo "::error::$l"; done
            if grep -q "iam.serviceAccounts.getAccessToken\|generateAccessToken\|workloadIdentityUser" /tmp/deploy.log; then echo "::error::배포 계정을 쓸 권한(GitHub → gh-deployer 묶음)이 아직 없음 — Cloud Shell에서 setup-autodeploy.sh를 다시 실행하세요"; fi
            exit 1; fi
          tail -n 5 /tmp/deploy.log
      - name: 올라간 판 확인
        if: env.DO_DEPLOY == '1'
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          for i in 1 2 3 4 5 6; do GOT=$(curl -fsS "$URL/status" | grep -oP '"ver":"\K[0-9.]+' || true); [ "$GOT" = "$VER" ] && break; sleep 10; done
          echo "### ☁ 클라우드 $GOT 올라감 (기대 $VER)" >> "$GITHUB_STEP_SUMMARY"
          [ "$GOT" = "$VER" ] || { echo "::error::올린 뒤 판이 $GOT — 기대한 $VER 아님"; exit 1; }
      - name: ⚡ 수집기 새 판 알림 (pc-live.json이 바뀌었을 때 — 켜진 PC가 몇 초 안에 받음)
        if: env.DO_PCLIVE == '1'
        env: { IDT: '${{ steps.idt.outputs.id_token }}' }
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          V=$(python3 -c "import json;print(json.load(open('pc-live.json'))['ver'])")
          for t in 1 2 3 4; do R=$(curl -sS -m 60 -X POST -H "Authorization: Bearer $IDT" "$URL/pclive?ver=$V&commit=$GITHUB_SHA" || true); echo "$R"; echo "$R" | grep -q '"ok":true' && break; sleep 20; done
