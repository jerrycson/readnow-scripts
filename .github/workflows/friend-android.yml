# 🐾 책방 친구 안드로이드 앱 — friend-v… 꼬리표를 올리면 APK(사이드로드 · 플레이 스토어 아님)를 만들어 GitHub 판에 붙임
#  · 서명 열쇠 (friendkey1 11/14) 찾는 차례:
#    ① Google Secret Manager friend-android-keystore · friend-android-keystore-pass — Cloud Shell 한 줄로 만듦(curl -sL https://readnow.kr/cloud/setup-friend-key.sh | bash)
#       · 배포 계정(gh-deployer · 열쇠 없이 OIDC)으로 꺼냄 — 그 계정은 main 가지에서만 통하므로 main 푸시·main에서 누른 실행만 ①을 씀
#    ② 저장소 비밀 FRIEND_KS_B64 · FRIEND_KS_PASS · (선택) FRIEND_KS_ALIAS — 예전 길(friend-app/android/make-keystore.sh)
#    ③ 둘 다 없으면 디버그 열쇠(그 판끼리는 덮어 설치가 안 될 수 있음 → 경고) — 단 friend-app/android/release-key.sha256(진짜 열쇠 지문)이 저장소에 있으면 디버그로 내지 않고 멈춤
#  · 다 만든 APK의 서명 지문을 기록·요약에 적고, 지문 파일이 있으면 같은지 견줌(다르면 판에 붙이지 않음)
#  · 같은 판 번호의 APK가 이미 GitHub 판에 있으면 덮지 않음(판 번호를 올려야 새로 붙음)
name: 책방 친구 안드로이드 앱
on:
  push:
    tags: ['friend-v*']
    branches: [main]
    paths: ['friend-app/**', '.github/workflows/friend-*.yml']  # (10/28) 껍데기를 고쳐 올리면 저절로 새 판(꼬리표 없이도 · 판 번호는 tauri.conf.json)
  workflow_dispatch:
permissions: { contents: write, id-token: write }  # id-token = 배포 계정(gh-deployer)으로 Secret Manager 열쇠를 꺼낼 때만
concurrency: { group: 'friend-release-${{ github.ref }}', cancel-in-progress: false }
env:
  PROJECT: readnow-3a385
  WIF: projects/63884079760/locations/global/workloadIdentityPools/github/providers/readnow-scripts
  SA: gh-deployer@readnow-3a385.iam.gserviceaccount.com
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: 안드로이드 SDK (러너에 이미 있음 — 라이선스만)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.14.3' }
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC · main에서만 · 안 되면 다음 길로)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (node24)
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}' }
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 (node24)
        if: steps.auth.outcome == 'success'
        continue-on-error: true
      - name: 판 번호 · 서명 열쇠
        env:
          AUTH: '${{ steps.auth.outcome }}'
          KS: '${{ secrets.FRIEND_KS_B64 }}'
          KS_PASS: '${{ secrets.FRIEND_KS_PASS }}'
          KS_ALIAS: '${{ secrets.FRIEND_KS_ALIAS }}'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#friend-v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=$(node -p "require('./friend-app/desktop/src-tauri/tauri.conf.json').version")
          echo "FRIEND_VERSION=$V" >> "$GITHUB_ENV"
          KF="$RUNNER_TEMP/friend.jks"; PF="$RUNNER_TEMP/friend.pass"; SRC=""; AL=friend; umask 077
          # ① Secret Manager (열쇠·비밀번호는 파일로만 · 기록에 찍지 않음)
          if [ "$AUTH" = success ]; then
            if gcloud secrets versions access latest --secret=friend-android-keystore --project="$PROJECT" --out-file="$KF" >/dev/null 2>"$RUNNER_TEMP/sm.err" && [ -s "$KF" ] \
               && gcloud secrets versions access latest --secret=friend-android-keystore-pass --project="$PROJECT" --out-file="$PF" >/dev/null 2>>"$RUNNER_TEMP/sm.err" && [ -s "$PF" ]; then
              echo "::add-mask::$(cat "$PF")"; SRC="Secret Manager"
            else rm -f "$KF" "$PF"; echo "Secret Manager에서 열쇠를 못 꺼냄(아직 안 만들었거나 읽기 권한 없음): $(grep -m1 -iE 'error|denied|not found' "$RUNNER_TEMP/sm.err" | cut -c1-200)"; fi
            rm -f "$RUNNER_TEMP/sm.err"
          else echo "구글 로그인 안 함/실패($AUTH) — Secret Manager 길은 건너뜀"; fi
          # ② 저장소 비밀(예전 길)
          if [ -z "$SRC" ] && [ -n "$KS" ]; then printf '%s' "$KS" | base64 -d > "$KF"; printf '%s' "$KS_PASS" > "$PF"; [ -n "$KS_ALIAS" ] && AL="$KS_ALIAS"; SRC="저장소 비밀"; fi
          if [ -n "$SRC" ]; then
            { echo "FRIEND_KS_FILE=$KF"; echo "FRIEND_KS_PASSFILE=$PF"; echo "FRIEND_KS_ALIAS=$AL"; echo "FRIEND_KS_SRC=$SRC"; } >> "$GITHUB_ENV"; echo "✓ 서명 열쇠: $SRC"
          elif [ -s friend-app/android/release-key.sha256 ]; then
            echo "::error::진짜 서명 열쇠를 꺼내지 못함(지문 파일이 있어 디버그 열쇠로는 내지 않음) — main 가지에서 다시 돌리거나 Cloud Shell setup-friend-key.sh로 열쇠 확인"; exit 1
          else echo "::warning::서명 열쇠가 없어 디버그 열쇠로 서명함 — 새 판을 덮어 설치하지 못할 수 있음(Cloud Shell: curl -sL https://readnow.kr/cloud/setup-friend-key.sh | bash)"; fi
      - name: 만들기 (assembleRelease)
        shell: bash
        run: |
          set -o pipefail
          if [ -n "${FRIEND_KS_PASSFILE:-}" ]; then FRIEND_KS_PASS="$(cat "$FRIEND_KS_PASSFILE")"; export FRIEND_KS_PASS; fi
          gradle -p friend-app/android --no-daemon assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: 서명 열쇠 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/friend.jks" "$RUNNER_TEMP/friend.pass"
      - name: 실패하면 기록 끝부분을 주석으로(밖에서 읽을 수 있게)
        if: failure()
        shell: bash
        run: |
          f=$(ls -t "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -1); [ -f "$f" ] || exit 0
          tail -c 60000 "$f" | grep -v '^\s*$' | tail -400 > tail.txt
          split -l 40 tail.txt part_; for p in part_*; do m=$(sed 's/%/%25/g' "$p" | awk '{printf "%s%%0A", $0}'); echo "::error title=log $p::$m"; done
      - name: 파일 이름 정리
        run: |
          mkdir -p dist-friend; cp friend-app/android/app/build/outputs/apk/release/*.apk "dist-friend/readnow-friend-${FRIEND_VERSION}.apk"; ls -la dist-friend
      - name: 서명 지문 확인 · 같은 판이 이미 올라가 있나
        id: pub
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          A="dist-friend/readnow-friend-${FRIEND_VERSION}.apk"
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          D=$("$AS" verify --print-certs "$A" 2>/dev/null | grep -m1 -i 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          W=$(tr -d ': \r\n' < friend-app/android/release-key.sha256 2>/dev/null | tr 'A-F' 'a-f')
          echo "서명 지문(SHA-256): ${D:-읽지 못함} · 열쇠: ${FRIEND_KS_SRC:-디버그}"; echo "🐾 책방 친구 ${FRIEND_VERSION} · 서명 ${FRIEND_KS_SRC:-디버그 열쇠} · 지문 \`${D:-?}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$W" ] && [ "$D" != "$W" ]; then echo "::error::APK 서명 지문($D)이 저장소 지문 파일($W)과 다름 — 판에 붙이지 않음"; exit 1; fi
          if [ -n "${FRIEND_KS_SRC:-}" ] && [ -z "$W" ] && [ -n "$D" ]; then echo "::notice::진짜 열쇠로 서명함 — 지문 $D 를 friend-app/android/release-key.sha256에 넣으면 그 뒤로 다른 열쇠·디버그 판을 막음"; fi
          if gh release view "friend-v${FRIEND_VERSION}" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qxF "readnow-friend-${FRIEND_VERSION}.apk"; then
            echo "::notice::friend-v${FRIEND_VERSION}에 같은 이름의 APK가 이미 있어 덮지 않음(판 번호를 올리면 새로 붙음)"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v7
        with: { name: 'readnow-friend-android-${{ env.FRIEND_VERSION }}', path: dist-friend/* }
      - name: GitHub 판에 붙이기
        if: github.event_name != 'pull_request' && steps.pub.outputs.skip != '1'
        uses: softprops/action-gh-release@v3
        with: { tag_name: 'friend-v${{ env.FRIEND_VERSION }}', files: dist-friend/* }
