# 🌐 Firebase Hosting 사용자 지정 도메인 등록·상태 보기 (11/10 · 2단계 준비)
#  · 손으로만 돎(Actions → 이 작업 → Run workflow) · 열쇠 없음: deploy-hosting과 같은 OIDC(gh-deployer · roles/firebasehosting.admin)
#  · 없으면 등록, 있으면 상태만 읽음(바꾸지 않음) · mode=status면 등록도 하지 않음
#  · Firebase가 바라는 DNS 레코드(A·TXT·ACME)·주인 확인·인증서 상태를 작업 요약과 로그에 그대로 · domain-status.json 결과물
name: 사용자 지정 도메인 (Firebase Hosting)
on:
  workflow_dispatch:
    inputs:
      custom_domain: { description: '도메인 (예 readnow.kr)', required: true, default: 'readnow.kr' }
      site: { description: '사이트 이름(비우면 관리 사이트 readnow-3a385 · 우리숍은 booksqueen)', required: false, default: '' }
      redirect: { description: '(www용) 이 도메인으로 넘김 — 예 booksqueen.com · 비우면 넘김 없음 · 처음 등록 때만', required: false, default: '' }
      mode: { description: 'register = 없으면 등록 · status = 읽기만', required: true, default: 'register', type: choice, options: [register, status] }
permissions: { contents: read, id-token: write }
env:
  WIF: projects/63884079760/locations/global/workloadIdentityPools/github/providers/readnow-scripts
  SA: gh-deployer@readnow-3a385.iam.gserviceaccount.com
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
        with: { fetch-depth: 1 }
      - id: auth
        name: 구글 로그인 (열쇠 없이 OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with: { workload_identity_provider: '${{ env.WIF }}', service_account: '${{ env.SA }}', token_format: access_token }
      - name: 도메인 등록·상태 읽기
        env: { HOSTING_TOKEN: '${{ steps.auth.outputs.access_token }}', CUSTOM_DOMAIN: '${{ inputs.custom_domain }}', DOMAIN_MODE: '${{ inputs.mode }}', DOMAIN_OUT: domain-status.json, SITE_IN: '${{ inputs.site }}', DOMAIN_REDIRECT: '${{ inputs.redirect }}' }
        run: node hosting/domain.js "$CUSTOM_DOMAIN" ${SITE_IN:+"$SITE_IN"}
      - name: 지금 공개 DNS 보기 (참고)
        if: always()
        env: { D: '${{ inputs.custom_domain }}' }
        run: |
          for t in A AAAA TXT CAA; do echo "== $t $D"; dig +short "$t" "$D" @8.8.8.8 || true; done
          echo "== TXT _acme-challenge.$D"; dig +short TXT "_acme-challenge.$D" @8.8.8.8 || true
          { echo; echo '**공개 DNS(8.8.8.8)**'; echo '```'; for t in A TXT; do echo "$t: $(dig +short $t $D @8.8.8.8 | tr '\n' ' ')"; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: domain-status, path: domain-status.json, if-no-files-found: ignore, retention-days: 30 }
